grade a training room of twenty systems to the latest Windows version. Which of the following would be the most efficient method of performing this upgrade process?", "opts": ["Recovery partition", "Remote network installation", "Repair installation", "USB key"], "ans": [1], "why": "<strong>Remote network installation</strong> allows simultaneous deployment to multiple systems from a central server, making it the most efficient for large-scale upgrades. A USB key requires visiting each machine individually. A recovery partition restores to factory state.", "isAcronym": false}, {"id": "ACR58", "obj": "Acronyms", "q": "What does <strong>WPA3</strong> stand for?", "opts": ["Wi-Fi Protected Access 3 – current strongest wireless security standard", "Preboot eXecution Environment – network boot protocol for remote OS installation", "New Technology File System – standard Windows file system with permissions and encryption", "Random-Access Memory – volatile system memory"], "ans": [0], "why": "<strong>WPA3</strong> stands for <em>Wi-Fi Protected Access 3 – current strongest wireless security standard</em>. The other options describe PXE, NTFS, and RAM respectively.", "isAcronym": true}, {"id": "C53", "obj": "Obj 1.4", "q": "A technician has been tasked with updating the BIOS of any Windows device using an older BIOS version. The technician cannot reboot these systems to check the BIOS versions currently in use. Which of the following would be the best way to proceed?", "opts": ["Install the BIOS upgrade regardless of the version", "View BIOS information in Group Policy Editor", "Run a report using Performance Monitor", "Use System Information to view the BIOS version"], "ans": [3], "why": "<strong>System Information</strong> (msinfo32) displays the current BIOS version and date without requiring a reboot. Group Policy Editor manages security policies, not hardware info.", "isAcronym": false}, {"id": "C16", "obj": "Obj 3.1", "q": "A user has just installed a driver update from a laptop manufacturer. After restarting, their system shows a Windows Stop Error before the login prompt is displayed. Each subsequent reboot causes the same error to be displayed. Which of the following should the system administrator follow to best resolve this issue?", "opts": ["Modify the BIOS boot order", "Boot to Safe Mode and perform a Windows Reset", "Perform a System Restore", "Reinstall the patch files"], "ans": [2], "why": "<strong>System Restore</strong> rolls back system files and drivers to a previous working state, resolving Stop Errors caused by a bad driver update.", "isAcronym": false}, {"id": "B13", "obj": "Obj 1.5", "q": "A system administrator has been tasked with locating all of the log files contained within an application folder. The folder currently contains over a thousand files, and only a portion of them have a .log extension. Which of these Windows commands would be the best way to find these files?", "opts": ["sfc", "diskpart", "robocopy", "dir"], "ans": [3], "why": "The <strong>dir</strong> command with a wildcard (e.g., dir *.log) lists only files matching a specific extension within a directory. sfc checks system file integrity. diskpart manages partitions. robocopy is a robust file copy utility.", "isAcronym": false}, {"id": "B53", "obj": "Obj 1.6", "q": "A technician would like to modify a configuration in a user's UEFI BIOS, but the system will not provide a BIOS configuration hotkey after shutting down and powering on the computer. Which of the following would be the best way to address this issue?", "opts": ["Change the File Explorer Options", "Modify the Indexing Options", "Turn off Fast Startup", "Start the computer in Safe Mode", "Modify the Ease of Access settings"], "ans": [2], "why": "<strong>Fast Startup</strong> causes Windows to hibernate rather than fully shut down, bypassing the POST and preventing BIOS access on the next boot. Turning it off forces a full shutdown, restoring access to BIOS configuration keys.", "isAcronym": false}, {"id": "A84", "obj": "Obj 2.2", "q": "A business partner in a different country needs to access an internal company server during the very early morning hours. The internal firewall will limit the partner's access to this single server. Which of these would be the most important security task to perform on this server?", "opts": ["Restrict log-in times for the partner account", "Remove the server from the Active Directory domain", "Use only 64-bit applications", "Run a weekly anti-virus scan"], "ans": [0], "why": "<strong>Restricting login times</strong> limits when the account can authenticate, reducing the attack window to only approved hours.", "isAcronym": false}, {"id": "ACR04", "obj": "Acronyms", "q": "What does <strong>CPU</strong> stand for?", "opts": ["Hard Disk Drive – traditional spinning magnetic storage", "Video Random-Access Memory – dedicated memory for GPU/graphics processing", "Central Processing Unit – the processor", "Graphical User Interface – visual OS interface"], "ans": [2], "why": "<strong>CPU</strong> stands for <em>Central Processing Unit – the processor</em>. The other options describe VRAM, HDD, and GUI respectively.", "isAcronym": true}, {"id": "B84", "obj": "Obj 1.4", "q": "A system administrator is troubleshooting an application issue. The application uses an increasing amount of memory until all available RAM is eventually depleted. The computer must be rebooted every few days when this memory issue occurs. Which of the following utilities would show how much RAM is used by this application?", "opts": ["Event Viewer", "Device Manager", "Task Manager", "Programs and Features"], "ans": [2], "why": "<strong>Task Manager's</strong> Processes and Performance tabs display real-time RAM usage per application, making memory leaks visible. Event Viewer logs errors. Device Manager manages hardware.", "isAcronym": false}, {"id": "A59", "obj": "Obj 4.9", "q": "A network administrator needs to manage a switch and a firewall in the local data center. Which of the following would be the best choice for this requirement?", "opts": ["RDP", "VPN", "SSH", "VNC"], "ans": [2], "why": "<strong>SSH</strong> (Secure Shell) provides encrypted command-line access to network devices like switches and firewalls.", "isAcronym": false}, {"id": "C29", "obj": "Obj 2.1", "q": "Users on the corporate network authenticate once at the beginning of the day, and are not prompted again for authentication until the following day. Which of the following would BEST describe this functionality?", "opts": ["NTFS", "SSO", "Inherited permissions", "EFS"], "ans": [1], "why": "<strong>SSO</strong> (Single Sign-On) allows a user to authenticate once and access all authorized resources without repeated prompts. NTFS is a Windows file system. EFS encrypts individual files.", "isAcronym": false}, {"id": "ACR17", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Mobile Device Management – platform for managing and enforcing mobile policies</em>?", "opts": ["SSD", "HDD", "MDM", "XFS"], "ans": [2], "why": "<strong>MDM</strong> stands for Mobile Device Management – platform for managing and enforcing mobile policies. HDD = Hard Disk Drive – traditional spinning magnetic storage. XFS = Extended File System – high-performance Linux/Unix file system. SSD = Solid-State Drive – flash-based non-volatile storage.", "isAcronym": true}, {"id": "B9", "obj": "Obj 1.7", "q": "A macOS server administrator needs a backup system to allow the recovery of data from any point in the last thirty days. Which of the following should be used for this requirement?", "opts": ["Backup and Restore", "Spotlight", "Spaces", "Time Machine"], "ans": [3], "why": "<strong>Time Machine</strong> maintains incremental backups allowing point-in-time recovery over a rolling backup window. Backup and Restore is Windows-based. Spotlight is macOS's search feature. Spaces is virtual desktops.", "isAcronym": false}, {"id": "B88", "obj": "Obj 2.8", "q": "A system administrator needs a way to deploy new smartphone configurations across four different user groups. Each group will require a different set of email and security configurations. Which of the following would be the best way to setup these smartphones?", "opts": ["Assign configuration profiles for each group", "Restore all smartphones from cloud backups", "Provide customized instructions for each user", "Assign separate support teams for each group"], "ans": [0], "why": "<strong>MDM configuration profiles</strong> allow administrators to push different email and security settings to specific user groups automatically.", "isAcronym": false}, {"id": "C82", "obj": "Obj 3.4", "q": "A user is browsing to their corporate home page, but a different website appears instead. The user tries to connect with other browsers on the same computer, but the result is identical. Which of the following would be the best next troubleshooting step?", "opts": ["Try connecting to the site in Safe Mode", "Perform an anti-malware scan", "View all browsing results in the Event Viewer", "Roll back to a previous configuration"], "ans": [1], "why": "Browser redirection occurring across all browsers on one computer is a strong indicator of malware requiring an <strong>anti-malware scan</strong>.", "isAcronym": false}, {"id": "ACR50", "obj": "Acronyms", "q": "What does <strong>RDP</strong> stand for?", "opts": ["Unified Extensible Firmware Interface – modern replacement for BIOS", "Random-Access Memory – volatile system memory", "Virtual Network Computing – cross-platform graphical remote desktop protocol", "Remote Desktop Protocol – Microsoft protocol for graphical remote access"], "ans": [3], "why": "<strong>RDP</strong> stands for <em>Remote Desktop Protocol – Microsoft protocol for graphical remote access</em>. The other options describe UEFI, VNC, and RAM respectively.", "isAcronym": true}, {"id": "ACR32", "obj": "Acronyms", "q": "What does <strong>TPM</strong> stand for?", "opts": ["Trusted Platform Module – hardware chip providing cryptographic functions; required for Windows 11", "Hard Disk Drive – traditional spinning magnetic storage", "Network Time Protocol – synchronizes clocks across network devices", "Non-Volatile Memory Express – high-speed SSD interface protocol"], "ans": [0], "why": "<strong>TPM</strong> stands for <em>Trusted Platform Module – hardware chip providing cryptographic functions; required for Windows 11</em>. The other options describe NTP, NVMe, and HDD respectively.", "isAcronym": true}, {"id": "C65", "obj": "Obj 2.6", "q": "A computer on a manufacturing floor has a virus, and the system administrator has removed the system from the company network. Which of the following virus removal tasks should occur next?", "opts": ["Discuss virus prevention with the end user", "Install the latest anti-virus signatures", "Schedule a virus scan to run each morning", "Disable System Restore"], "ans": [3], "why": "After quarantining the system (removing from network), <strong>disabling System Restore</strong> is the next step to prevent restoration of infected restore points.", "isAcronym": false}, {"id": "A15", "obj": "Obj 2.8", "q": "A user in the accounting department would like to ensure their mobile device data is always available. If the user's smartphone is damaged or stolen, they would like to replace the device and restore all data as quickly as possible. Which of the following would provide this functionality?", "opts": ["Full device encryption", "Remote backup", "IoT isolation", "Remote wipe"], "ans": [1], "why": "<strong>Remote backup</strong> stores device data to the cloud, enabling quick restoration to a new device after loss or damage. Remote wipe deletes data rather than restoring it.", "isAcronym": false}, {"id": "ACR29", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Serial Advanced Technology Attachment – storage drive interface</em>?", "opts": ["MBR", "CPU", "SSD", "SATA"], "ans": [3], "why": "<strong>SATA</strong> stands for Serial Advanced Technology Attachment – storage drive interface. CPU = Central Processing Unit – the processor. MBR = Master Boot Record – legacy partition style, max 4 partitions, max 2TB. SSD = Solid-State Drive – flash-based non-volatile storage.", "isAcronym": true}, {"id": "A68", "obj": "Obj 3.2", "q": "A user is having problems with the 802.11 wireless connection on his iOS phone. Although there are names appearing in the network list, his phone does not show any connectivity to a wireless network. The user has confirmed airplane mode is not enabled, Bluetooth is on, and VPN is not enabled. Which of the following is the most likely reason for this lack of wireless connectivity?", "opts": ["The phone does not include a data plan", "The wireless network is disabled", "The Bluetooth connection is conflicting with the Wi-Fi", "The Wi-Fi password is incorrect", "The wireless radio is disabled"], "ans": [3], "why": "If networks appear in the list but the phone shows no connectivity, an <strong>incorrect Wi-Fi password</strong> is the most likely cause.", "isAcronym": false}, {"id": "ACR54", "obj": "Acronyms", "q": "What does <strong>TOTP</strong> stand for?", "opts": ["Time-based One-Time Password – rotating codes used in authenticator apps", "Network Access Control – enforcing security policy before network access is granted", "Solid-State Drive – flash-based non-volatile storage", "Facial Recognition Technology – biometric authentication using facial features"], "ans": [0], "why": "<strong>TOTP</strong> stands for <em>Time-based One-Time Password – rotating codes used in authenticator apps</em>. The other options describe FRT, NAC, and SSD respectively.", "isAcronym": true}, {"id": "C43", "obj": "Obj 2.1", "q": "A user in the shipping department is able to view order information, but they cannot modify or delete any order details. Which of the following would best describe this security principle?", "opts": ["Multi-factor authentication", "Least privilege", "Group Policy", "Organizational Units"], "ans": [1], "why": "<strong>Least privilege</strong> grants users only the minimum access needed to perform their job, nothing more.", "isAcronym": false}, {"id": "B34", "obj": "Obj 3.4", "q": "A user is receiving alerts on their desktop computer stating, \"Access to this PC has been blocked for security reasons.\" A technician has determined this message was not created by the company's security software. Which of the following would be the best next step in this troubleshooting process?", "opts": ["Update the desktop computer operating system", "Check the certificate of the corporate web server", "Restart the desktop computer", "Run an anti-malware utility"], "ans": [3], "why": "Fake security block messages are a common malware symptom; running an <strong>anti-malware utility</strong> identifies and removes the source.", "isAcronym": false}, {"id": "B80", "obj": "Obj 3.3", "q": "An Android phone user is traveling internationally and would like to avoid overage charges for using too much cellular data while overseas. Which of the following would be the best way to control data access?", "opts": ["Install a VPN client", "Remove all apps with high data requirements", "Enable data usage notifications", "Connect exclusively through a cellular hotspot"], "ans": [2], "why": "<strong>Data usage notifications</strong> alert the user when approaching data limits, allowing them to manually control consumption before incurring overage charges.", "isAcronym": false}, {"id": "A50", "obj": "Obj 3.1", "q": "A system administrator is starting a Windows computer, but during startup they receive the message, \"One or more services failed to start.\" Additional reboots result in the same error message. Which of the following would be the best next troubleshooting step?", "opts": ["Check for proper cooling", "Run a hardware diagnostic", "Modify the service permissions", "Rebuild the BCD"], "ans": [2], "why": "A persistent service failure on every boot most commonly points to incorrect <strong>service account permissions</strong> preventing the service from starting.", "isAcronym": false}, {"id": "C6", "obj": "Obj 3.1", "q": "A technician has been called to resolve an issue with a desktop computer in a training facility. The computer appears to boot properly to the desktop, but applications take five minutes to load. While using the application, pop-up messages and other windows appear on the desktop. Which of the following should be the best next troubleshooting step?", "opts": ["View running processes in Task Manager", "Disable System Restore", "Remove the computer from the network", "Educate the end user"], "ans": [0], "why": "<strong>Task Manager</strong> reveals which processes are consuming CPU and memory resources, identifying the cause of slow performance and pop-ups.", "isAcronym": false}, {"id": "C79", "obj": "Obj 2.1", "q": "A healthcare administrator stores sensitive data on his laptop computer. His desk is in an open area near a busy hallway. Which of the following would add additional security to the administrator's work area?", "opts": ["Door lock", "Fingerprint scanner", "Magnetometer", "Bollards"], "ans": [1], "why": "A <strong>fingerprint scanner</strong> adds biometric authentication, preventing unauthorized access to the laptop even in an open area. A door lock doesn't apply to a laptop. A magnetometer detects metal. Bollards prevent vehicle access.", "isAcronym": false}, {"id": "B85", "obj": "Obj 3.1", "q": "An administrator is troubleshooting a desktop computer experiencing a reboot issue. Before the Windows login screen appears, the system reboots in a continuous loop. Which of the following would be the best way to address this issue?", "opts": ["Start Safe Mode and perform a defragmentation", "Reinstall the operating system from the original media", "Update the boot order from the system BIOS", "Run Startup Repair from the Advanced Boot Options"], "ans": [3], "why": "<strong>Startup Repair</strong> from Advanced Boot Options can fix corrupted boot files causing a pre-login reboot loop without reinstalling the OS.", "isAcronym": false}, {"id": "B11", "obj": "Obj 1.7", "q": "A technician needs to uninstall a video editing utility from a macOS laptop. Which folder would be the most likely location of this utility?", "opts": ["  /Program Files", "/Applications", "/Library", "/Users"], "ans": [1], "why": "macOS stores all installed user applications in the <strong>/Applications</strong> directory. /Program Files is a Windows directory. /Library contains system and app support files. /Users contains user home directories.", "isAcronym": false}, {"id": "A54b", "obj": "Obj 4.9", "q": "A user working from home is not able to print to a laser printer at the corporate office. Which of the following would be the most likely reason for this issue?", "opts": ["WPA3 settings", "Outdated anti-virus signatures", "Disconnected VPN", "MDM configuration"], "ans": [2], "why": "Corporate printers reside on the internal network; without a <strong>VPN connection</strong> a remote user cannot reach internal network resources.", "isAcronym": false}, {"id": "ACR12", "obj": "Acronyms", "q": "What does <strong>GPU</strong> stand for?", "opts": ["Graphics Processing Unit – dedicated graphics processor", "Random-Access Memory – volatile system memory", "Redundant Array of Independent Disks – storage redundancy/performance configuration", "GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB"], "ans": [0], "why": "<strong>GPU</strong> stands for <em>Graphics Processing Unit – dedicated graphics processor</em>. The other options describe GPT, RAID, and RAM respectively.", "isAcronym": true}, {"id": "ACR08", "obj": "Acronyms", "q": "What does <strong>exFAT</strong> stand for?", "opts": ["Boot Configuration Data – Windows boot loader data store", "Graphical User Interface – visual OS interface", "Temporal Key Integrity Protocol – older WPA encryption algorithm", "Extended File Allocation Table – cross-platform file system for flash drives"], "ans": [3], "why": "<strong>exFAT</strong> stands for <em>Extended File Allocation Table – cross-platform file system for flash drives</em>. The other options describe TKIP, BCD, and GUI respectively.", "isAcronym": true}, {"id": "A64", "obj": "Obj 1.5", "q": "A malware infection has recently been removed from a computer. When starting the operating system, Windows shows errors during the startup process indicating some core operating system files are missing. Which of the following should be used to restore these missing files?", "opts": ["gpupdate", "winver", "sfc", "diskpart"], "ans": [2], "why": "The <strong>System File Checker (sfc /scannow)</strong> scans and restores corrupted or missing core Windows system files. gpupdate refreshes Group Policy. winver displays the Windows version. diskpart manages disk partitions.", "isAcronym": false}, {"id": "ACR49", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Personally Identifiable Information – data that can identify an individual</em>?", "opts": ["BIOS", "PAM", "OEM", "PII"], "ans": [3], "why": "<strong>PII</strong> stands for Personally Identifiable Information – data that can identify an individual. PAM = Privileged Access Management – security controls for admin-level accounts. OEM = Original Equipment Manufacturer – hardware/software pre-installed by manufacturer. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "ACR20", "obj": "Acronyms", "q": "What does <strong>NVMe</strong> stand for?", "opts": ["Redundant Array of Independent Disks – storage redundancy/performance configuration", "International Organization for Standardization – also refers to disc image file format", "Non-Volatile Memory Express – high-speed SSD interface protocol", "Random-Access Memory – volatile system memory"], "ans": [2], "why": "<strong>NVMe</strong> stands for <em>Non-Volatile Memory Express – high-speed SSD interface protocol</em>. The other options describe RAID, ISO, and RAM respectively.", "isAcronym": true}, {"id": "B74", "obj": "Obj 2.5", "q": "An employee used their tablet to take pictures of the company's newest product. Those pictures were posted on an industry rumor website the following week. Which of the following should be evaluated as the MOST likely security concern?", "opts": ["Cloud storage", "USB flash drive use", "Application updates", "Deleted email messages"], "ans": [0], "why": "Automatic <strong>cloud sync</strong> (e.g., iCloud, Google Photos) can silently upload sensitive images to shared or public cloud accounts.", "isAcronym": false}, {"id": "C52", "obj": "Obj 2.2", "q": "A system administrator has configured EFS on a user's workstation. Which of the following would describe this functionality?", "opts": ["Encryption of individual files and folders", "Secure wireless communication", "Encrypted network tunnel", "Full disk encryption"], "ans": [0], "why": "<strong>EFS</strong> provides file-level encryption of specific files and folders in Windows, not full disk encryption. Full disk encryption is BitLocker's function.", "isAcronym": false}, {"id": "ACR43", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Facial Recognition Technology – biometric authentication using facial features</em>?", "opts": ["SODIMM", "FRT", "MBR", "CPU"], "ans": [1], "why": "<strong>FRT</strong> stands for Facial Recognition Technology – biometric authentication using facial features. SODIMM = Small Outline DIMM – laptop RAM form factor. MBR = Master Boot Record – legacy partition style, max 4 partitions, max 2TB. CPU = Central Processing Unit – the processor.", "isAcronym": true}, {"id": "ACR07", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>External SATA – external version of SATA interface for storage</em>?", "opts": ["eSATA", "BIOS", "DIMM", "RAM"], "ans": [0], "why": "<strong>eSATA</strong> stands for External SATA – external version of SATA interface for storage. DIMM = Dual In-line Memory Module – standard RAM form factor for desktops. RAM = Random-Access Memory – volatile system memory. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "C76", "obj": "Obj 2.9", "q": "A financial services company is upgrading the storage drives in their SAN and need to dispose of one hundred older storage drives. The security administrator would like to permanently disable the drive and guarantee the data on the drives could not be recovered. Which of the following methods would be the best way to accomplish this goal?", "opts": ["Standard format", "Full disk encryption", "Shredder", "Delete the master boot record"], "ans": [2], "why": "Physical <strong>shredding</strong> permanently destroys the drive and guarantees no data recovery is possible.", "isAcronym": false}, {"id": "ACR23", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Power-On Self-Test – hardware check performed at system startup</em>?", "opts": ["BIOS", "VGA", "MDM", "POST"], "ans": [3], "why": "<strong>POST</strong> stands for Power-On Self-Test – hardware check performed at system startup. VGA = Video Graphics Array – older analog video output standard. MDM = Mobile Device Management – platform for managing and enforcing mobile policies. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "C10", "obj": "Obj 1.5", "q": "A computer technician has been asked to verify a set of new Active Directory settings on computers at a remote site. Which of the following commands should be used to validate the last policy update on the systems?", "opts": ["net use", "sfc", "gpresult", "netstat", "tracert"], "ans": [2], "why": "The <strong>gpresult</strong> command displays the Resultant Set of Policy (RSoP) and shows which Group Policy settings have been applied. net use maps network drives. sfc repairs system files. netstat shows network connections.", "isAcronym": false}, {"id": "ACR13", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Graphical User Interface – visual OS interface</em>?", "opts": ["NAC", "SSD", "MFA", "GUI"], "ans": [3], "why": "<strong>GUI</strong> stands for Graphical User Interface – visual OS interface. NAC = Network Access Control – enforcing security policy before network access is granted. MFA = Multi-Factor Authentication – requiring two or more verification factors. SSD = Solid-State Drive – flash-based non-volatile storage.", "isAcronym": true}, {"id": "A27", "obj": "Obj 3.2", "q": "A help desk technician has been called to a training room with Android tablets as presentation devices. An application used during the training program will not start on any of the tablets. When the application is selected, the splash screen appears for a moment and then completely disappears with no error message. Which of the following would be the best next troubleshooting step?", "opts": ["Install all operating system updates", "Uninstall the application", "Power cycle the tablets", "Roll back to the previous application version"], "ans": [2], "why": "<strong>Power cycling</strong> clears temporary memory states and resolves many transient application launch failures across multiple devices.", "isAcronym": false}, {"id": "C84", "obj": "Obj 4.2", "q": "A system administrator has been notified a serious security vulnerability has been identified in software used by the company. In order to quickly patch this vulnerability, the administrator has created change management documentation for the change control board. Which part of the documentation would explain the disadvantages of not quickly patching this software?", "opts": ["Backout plan", "End-user acceptance", "Detailed change plan", "Risk analysis"], "ans": [3], "why": "The <strong>risk analysis</strong> section of change documentation describes the consequences and disadvantages of not implementing the change.", "isAcronym": false}, {"id": "B82", "obj": "Obj 4.9", "q": "A system administrator is installing a new video editing application on a user's workstation from a USB flash drive. However, the installation process fails due to lack of available drive space. Which of the following would be the best way to complete the installation process?", "opts": ["Use a share drive for the installation source", "Compress the installation files", "Install the application to a network share", "Manually copy the installation files to the application directory"], "ans": [2], "why": "<strong>Installing to a network share</strong> bypasses local storage limitations by placing the application files on a remote server with available space.", "isAcronym": false}, {"id": "B63", "obj": "Obj 2.6", "q": "An administrator has identified and removed malware on a corporate desktop computer. Which of the following malware removal steps should be performed next?", "opts": ["Disconnect the computer from the corporate network", "Educate the end-user", "Schedule periodic anti-virus scans", "Disable System Restore"], "ans": [2], "why": "<strong>Scheduling periodic scans</strong> is step 8 in the malware removal process, ensuring ongoing protection after remediation. Educating the user is the final step 10.", "isAcronym": false}, {"id": "A62", "obj": "Obj 2.4", "q": "A user has opened a help desk ticket relating to desktop alerts randomly appearing throughout the day. Most of the alerts contain information about third-party products and services. Which of the following is the most likely cause of these messages?", "opts": ["On-path attack", "Corrupted email database", "OS update failure", "Adware"], "ans": [3], "why": "<strong>Adware</strong> generates unsolicited advertisements and pop-up alerts, typically promoting third-party products.", "isAcronym": false}, {"id": "B49", "obj": "Obj 1.8", "q": "A Linux administrator is modifying a log file and needs to rename the file. Which of the following should be used to make this change?", "opts": ["rm", "mv", "mkdir", "pwd"], "ans": [1], "why": "The <strong>mv</strong> command moves or renames files and directories in Linux. rm removes files. mkdir creates directories. pwd prints the current working directory.", "isAcronym": false}, {"id": "A15b", "obj": "Obj 4.3", "q": "A user in the accounting department would like to ensure their mobile device data is always available. If the user's smartphone is damaged or stolen, they would like to replace the device and restore all data as quickly as possible. Which of the following would provide this functionality?", "opts": ["Full device encryption", "Remote backup", "IoT isolation", "Remote wipe"], "ans": [1], "why": "<strong>Remote backup</strong> stores device data to the cloud enabling quick restoration to a replacement device after loss or damage.", "isAcronym": false}, {"id": "B27", "obj": "Obj 2.10", "q": "A local coffee shop has a public wireless network for customers and a private wireless network for company devices. The shop owner wants to be sure customers can never connect to the company network. Which of the following should be configured on this network?", "opts": ["Install a new access point for company devices", "Configure WPA3 on the company network", "Require static IP addresses on the customer network", "Assign MAC filters to the company network", "Use a firewall between the customer and corporate network"], "ans": [1], "why": "<strong>WPA3 encryption</strong> with a strong passphrase on the company network prevents unauthorized customers from connecting.", "isAcronym": false}, {"id": "A47", "obj": "Obj 1.2", "q": "A system administrator is upgrading four workstations from Windows 8.1 to Windows 11. All of the user files and applications are stored on the server, and no documents or settings need to be retained between versions. Which of these installation methods would be the best way to provide this upgrade?", "opts": ["Factory reset", "Repair installation", "Clean install", "In-place upgrade"], "ans": [2], "why": "A <strong>clean install</strong> wipes the existing OS entirely, which is ideal when no local data or settings need to be preserved. A repair installation fixes a broken OS without removing it. An in-place upgrade preserves apps and settings. A factory reset returns to manufacturer defaults, not a new OS version.", "isAcronym": false}, {"id": "C51", "obj": "Obj 3.4", "q": "A user's workstation has been identified as participating in a DDoS to a large Internet service provider. The computer has been powered down and stored in a locked area until investigators arrive. Which of these procedures would be the most important to follow in the meantime?", "opts": ["Create documentation of the storage area", "Retrieve logs from the workstation Event Viewer", "Obtain the purchase records of the workstation", "Maintain integrity of the workstation data"], "ans": [3], "why": "<strong>Maintaining data integrity</strong> preserves the forensic evidence on the workstation, which is critical for any legal investigation.", "isAcronym": false}, {"id": "A19", "obj": "Obj 1.3", "q": "What is the maximum amount of RAM supported by a 32-bit version of an operating system?", "opts": ["4 GB", "8 GB", "16 GB", "192 GB"], "ans": [0], "why": "A <strong>32-bit OS</strong> can address a maximum of 2^32 memory addresses, which equals 4 GB of RAM. 64-bit operating systems can address far more.", "isAcronym": false}, {"id": "ACR18", "obj": "Acronyms", "q": "What does <strong>mSATA</strong> stand for?", "opts": ["Wi-Fi Protected Access 3 – current strongest wireless security standard", "Mini-SATA – compact SATA interface for smaller devices", "Graphical User Interface – visual OS interface", "Resilient File System – Microsoft server-grade file system with fault tolerance"], "ans": [1], "why": "<strong>mSATA</strong> stands for <em>Mini-SATA – compact SATA interface for smaller devices</em>. The other options describe ReFS, WPA3, and GUI respectively.", "isAcronym": true}, {"id": "A31", "obj": "Obj 1.8", "q": "A Linux administrator needs to modify the configuration text file for a service. Which of the following utilities would provide this functionality?", "opts": ["nano", "chmod", "df", "sudo"], "ans": [0], "why": "<strong>nano</strong> is a simple command-line text editor for Linux used to create and modify configuration files. chmod changes file permissions. df reports disk space usage. sudo grants elevated privileges.", "isAcronym": false}, {"id": "C67", "obj": "Obj 3.1", "q": "When a user starts their desktop computer, the Windows splash screen is shown with a rotating circle, but the login screen is never displayed. A technician researches the issue and finds the computer was just updated to the latest set of Windows patches. Which of the following would be the next step the technician should follow to help solve this issue?", "opts": ["Restart the computer", "Perform a Startup Repair", "Start in VGA mode", "Rebuild the user's profile"], "ans": [1], "why": "<strong>Startup Repair</strong> diagnoses and fixes boot-related issues including those introduced by a Windows patch update.", "isAcronym": false}, {"id": "A21", "obj": "Obj 2.5", "q": "An attacker is using every combination of letters, numbers, and special characters in an attempt to discover a user's password. Which of the following would describe this attack type?", "opts": ["Spoofing", "Social engineering", "Brute force attack", "DDoS"], "ans": [2], "why": "A <strong>brute force attack</strong> tries every possible character combination systematically until the correct password is found.", "isAcronym": false}, {"id": "A73", "obj": "Obj 4.2", "q": "A network consulting firm is upgrading the Internet firewalls for a large corporation. The proposal includes a description of the project and the network topology changes required to support the upgrade. The proposal also describes the risks involved with making this upgrade. Which of the following would be the last step in this upgrade?", "opts": ["Detailed upgrade plan", "Backout plan", "Change control application", "End-user acceptance"], "ans": [3], "why": "<strong>End-user acceptance</strong> is the final step in a change management process, confirming the change meets requirements and is approved by stakeholders.", "isAcronym": false}, {"id": "B78", "obj": "Obj 4.3", "q": "A server administrator has configured an automated process to backup VM snapshots each evening during non-working hours. The backups will be stored on a series of high-density tape drives. How can the administrator confirm these backups will be useful when a server recovery is needed?", "opts": ["Send the backups to an off-site facility", "Connect the tape drives to a battery backup", "Create separate file-level backups", "Perform occasional recovery tests"], "ans": [3], "why": "Regularly <strong>testing backup recovery</strong> confirms the backups are valid and restorable before they are needed in a real disaster.", "isAcronym": false}, {"id": "B59", "obj": "Obj 3.1", "q": "A user in the accounting department has installed a new application for the upcoming tax year. Although the current application worked perfectly, the newer application runs significantly slower. Which of the following should be the first troubleshooting step?", "opts": ["Roll back to the previous application", "Run a repair installation", "Verify the requirements for the new application", "Perform a system file check"], "ans": [2], "why": "Checking the new application's <strong>system requirements</strong> first determines if the hardware meets the minimum specs before attempting other fixes.", "isAcronym": false}, {"id": "B71", "obj": "Obj 3.4", "q": "A network administrator has a report showing a single user with numerous visits to a website. This website is known to violate the company's AUP. Which of the following should the administrator do next?", "opts": ["Create a firewall filter to block the website", "Scan all computers with the latest anti-malware signatures", "Contact the company's security officer", "Change the user's password"], "ans": [2], "why": "AUP violations are a security and HR matter; the correct escalation path is to notify the <strong>company's security officer</strong> rather than taking unilateral action.", "isAcronym": false}, {"id": "B20", "obj": "Obj 2.2", "q": "A medical research company is using laptop computers when visiting testing centers. The IT security team is concerned about a data breach if a laptop is lost or stolen. Which of the following would be the best way to manage this issue?", "opts": ["BIOS password", "Authenticator application", "Full disk encryption", "Biometric authentication", "Cable lock"], "ans": [2], "why": "<strong>Full disk encryption</strong> ensures all data on the laptop is unreadable without the correct credentials, even if the drive is removed. A BIOS password can be bypassed by removing the drive. A cable lock is physical theft prevention only.", "isAcronym": false}, {"id": "B21", "obj": "Obj 2.3", "q": "A security administrator is installing a new VPN connection for remote users. The administrator would like all users to authenticate with their Windows Active Directory credentials. Which of the following technologies would provide this functionality?", "opts": ["RADIUS", "WPA3", "TKIP", "AES"], "ans": [0], "why": "<strong>RADIUS</strong> integrates with Active Directory to provide centralized authentication for VPN and network access services. WPA3 is a wireless encryption protocol. TKIP and AES are encryption algorithms, not authentication protocols.", "isAcronym": false}, {"id": "C22", "obj": "Obj 2.6", "q": "A desktop administrator is removing a virus from a laptop computer in a shared lab. The computer has been removed from the network and the System Restore feature has been disabled. When the administrator attempts to update to the latest anti-virus signatures, the anti-virus utility disables itself. Which of the following would be the best next step?", "opts": ["Boot to Safe Mode and use signatures downloaded from a separate computer", "Roll back to a previous configuration", "Schedule periodic updates and reconnect to the network", "Discuss anti-virus strategies with the end user"], "ans": [0], "why": "<strong>Booting to Safe Mode</strong> prevents malware from loading and allows scanning with externally obtained signatures when the malware disables antivirus tools.", "isAcronym": false}, {"id": "C61", "obj": "Obj 3.1", "q": "A user has noticed his computer begins to slow down during daily use and eventually locks up completely. During the lock up, the keyboard and mouse do not respond and the screen does not show any error messages. Which of the following tasks should a technician follow to best troubleshoot this issue? (Choose TWO)", "opts": ["Start the computer in Safe Mode", "Perform a hardware diagnostic", "Connect the computer to a different VLAN", "Update the OS to the latest patches", "Roll back to a previous configuration", "Scan for viruses and malware"], "ans": [1, 5], "why": "Complete system lockups with no error messages can be caused by <strong>failing hardware</strong> or <strong>malware</strong>; both should be investigated simultaneously.", "isAcronym": false}, {"id": "ACR28", "obj": "Acronyms", "q": "What does <strong>RSR</strong> stand for?", "opts": ["Central Processing Unit – the processor", "Rapid Security Response – Apple's fast-delivery security patch system for macOS/iOS", "Unified Extensible Firmware Interface – modern replacement for BIOS", "Basic Input/Output System – firmware interface pre-UEFI"], "ans": [1], "why": "<strong>RSR</strong> stands for <em>Rapid Security Response – Apple's fast-delivery security patch system for macOS/iOS</em>. The other options describe UEFI, BIOS, and CPU respectively.", "isAcronym": true}, {"id": "B17", "obj": "Obj 4.6", "q": "A technician has been asked to power down and store a server which has been exploited by an external attacker. The legal department will be performing tests and gathering information from this server. Which of the following would be most important to ensure the integrity of the server data?", "opts": ["Report the server location to the proper channels", "Compile all support tickets associated with the server", "Maintain a chain of custody", "Take photos of the server in the storage room"], "ans": [2], "why": "<strong>Chain of custody</strong> documents who handled evidence and when, preserving its integrity and admissibility in legal proceedings.", "isAcronym": false}, {"id": "A9", "obj": "Obj 2.1", "q": "A system administrator has required the use of FRT for authentication on all laptops, mobile phones, and tablets. Which of the following will be required to meet this requirement?", "opts": ["Fingerprint reader", "Badge reader", "Token generator", "Integrated camera"], "ans": [3], "why": "<strong>FRT</strong> (Facial Recognition Technology) requires a camera to capture and analyze facial features for authentication. A fingerprint reader is for fingerprint biometrics. A badge reader reads physical access cards. A token generator creates time-based codes.", "isAcronym": false}, {"id": "C58", "obj": "Obj 3.1", "q": "A client's desktop computer is randomly rebooting throughout the workday without any warnings or error messages. Which of the following would be the best next troubleshooting step?", "opts": ["Update the system BIOS", "Reinstall the Windows operating system", "Boot to Safe Mode and disable all startup applications", "Perform a full system diagnostic"], "ans": [3], "why": "Random reboots without errors can indicate hardware failure; a <strong>full system diagnostic</strong> checks RAM, CPU, storage, and power supply.", "isAcronym": false}, {"id": "C81", "obj": "Obj 4.9", "q": "A network administrator has been asked to manage the router configurations at all company locations. Which of the following would be the best choice for this task?", "opts": ["SSH", "VNC", "NFC", "RDP"], "ans": [0], "why": "<strong>SSH</strong> provides secure encrypted command-line management of routers and other network devices across all locations.", "isAcronym": false}, {"id": "ACR31", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Solid-State Drive – flash-based non-volatile storage</em>?", "opts": ["VRAM", "GPT", "SSD", "RAM"], "ans": [2], "why": "<strong>SSD</strong> stands for Solid-State Drive – flash-based non-volatile storage. VRAM = Video Random-Access Memory – dedicated memory for GPU/graphics processing. GPT = GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB. RAM = Random-Access Memory – volatile system memory.", "isAcronym": true}, {"id": "B8", "obj": "Obj 1.5", "q": "A user needs to modify a spreadsheet for an upcoming meeting. The spreadsheet is currently stored on a remote computer in a shared drive. The user would like to access the shared drive as a drive letter inside of Windows File Explorer. Which of the following command line options would provide this functionality?", "opts": ["tasklist", "net use", "diskpart", "netstat"], "ans": [1], "why": "The <strong>net use</strong> command maps a network share to a local drive letter, making it accessible in File Explorer. tasklist shows running processes. diskpart manages local disk partitions. netstat shows active network connections.", "isAcronym": false}, {"id": "A42", "obj": "Obj 1.2", "q": "A technician is installing a fresh Windows operating system on a file server. Unfortunately, the drive controller in the system is not recognized during the installation process. Which of the following would be the best way to manage this issue?", "opts": ["Load third-party drivers", "Restart the system", "Use a remote network installation", "Boot from the recovery partition"], "ans": [0], "why": "When Windows does not natively recognize a drive controller during installation, <strong>loading third-party drivers</strong> from the manufacturer provides the required support. Restarting won't resolve a missing driver.", "isAcronym": false}, {"id": "A69", "obj": "Obj 4.4", "q": "A desktop administrator is upgrading the video adapter in a workstation. Which of the following should the administrator use during this process?", "opts": ["Tone generator", "Anti-static strap", "Safety goggles", "Toner vacuum"], "ans": [1], "why": "An <strong>anti-static strap</strong> prevents electrostatic discharge that can damage sensitive electronic components during installation.", "isAcronym": false}, {"id": "B29", "obj": "Obj 2.11", "q": "A company's shipping department maintains ten different computers for printing shipping labels and for tracking outgoing shipments. All of the systems are displaying an error when they access a third-party shipping management website over a secure connection. Which of the following would be the most likely reason for this issue?", "opts": ["The computers have not been updated with the latest OS patches", "The website certificate has expired", "The local computer storage drives are not encrypted", "The systems are infected with malware"], "ans": [1], "why": "When all computers in a group get the same HTTPS error on the same website, an <strong>expired server certificate</strong> is the most likely cause.", "isAcronym": false}, {"id": "C8", "obj": "Obj 3.3", "q": "A user has noticed a Bluetooth device currently connected to their tablet, but they don't recognize the make or model of the connected device. Which of the following would be the first step for troubleshooting this issue?", "opts": ["Perform an anti-malware scan", "Research installed apps with an app scanner", "Disable the Wi-Fi network", "Remove the Bluetooth device"], "ans": [3], "why": "The immediate first step when an unrecognized Bluetooth device is connected is to <strong>remove it</strong>, stopping any potential unauthorized access.", "isAcronym": false}, {"id": "B68", "obj": "Obj 4.7", "q": "A user has dropped off their laptop at the repair desk. A message taped to the laptop states: \"Doesn't work.\" Which of the following would be the best next step?", "opts": ["Start the laptop and look for any issues", "Call the customer and ask for more information", "Replace the power adapter and try booting the laptop", "Use a diagnostics boot CD to run hardware tests"], "ans": [1], "why": "A vague problem description requires clarification; <strong>calling the customer to ask open-ended questions</strong> narrows the scope before attempting any repair.", "isAcronym": false}, {"id": "C85", "obj": "Obj 2.9", "q": "A company is donating ten laptop computers to a local community center. Which of the following processes should be followed before making this donation?", "opts": ["Inventory management", "Acceptable use policy", "Password policy", "Knowledge base article"], "ans": [0], "why": "<strong>Inventory management</strong> ensures donated assets are properly tracked, decommissioned, and wiped before leaving the organization.", "isAcronym": false}, {"id": "B47", "obj": "Obj 3.2", "q": "A technician is troubleshooting an issue with an iOS tablet randomly restarting during normal use. A check of the device shows no significant application updates and the operating system was upgraded to a new version three days ago. The user states the tablet was working normally last week. Which of the following would be the most likely reason for these random reboots?", "opts": ["Faulty OS upgrade", "Invalid device certificate", "Malware infection", "Faulty battery", "Incorrect network settings"], "ans": [0], "why": "Random reboots beginning immediately after an OS upgrade with no other changes strongly indicate the <strong>upgrade introduced a fault</strong>.", "isAcronym": false}, {"id": "ACR36", "obj": "Acronyms", "q": "What does <strong>VM</strong> stand for?", "opts": ["Virtual Machine – software emulation of a computer system", "Operating System – software managing hardware and applications", "Central Processing Unit – the processor", "Virtual Private Network – encrypted tunnel for secure remote access"], "ans": [0], "why": "<strong>VM</strong> stands for <em>Virtual Machine – software emulation of a computer system</em>. The other options describe VPN, OS, and CPU respectively.", "isAcronym": true}, {"id": "A59b", "obj": "Obj 4.9", "q": "A help desk technician needs to view and control the desktop of a Windows computer at a remote location. Which of the following would be the best choice for this task?", "opts": ["VPN", "VNC", "SSH", "RDP"], "ans": [3], "why": "<strong>RDP</strong> (Remote Desktop Protocol) provides full graphical desktop access and control of a remote Windows computer.", "isAcronym": false}, {"id": "B22", "obj": "Obj 4.3", "q": "A mobile user is using apps on their smartphone for most business tasks. To ensure no data will be lost, the smartphone will need to have multiple backups each day. The user travels most of the time and rarely visits the home office. Which of the following would be the best way to provide these backups?", "opts": ["Connect an external USB drive", "Use incremental backups each night", "Connect the smartphone to a laptop", "Use a cloud backup service"], "ans": [3], "why": "A <strong>cloud backup service</strong> provides automatic, frequent backups regardless of the user's location without requiring physical media.", "isAcronym": false}, {"id": "B66", "obj": "Obj 1.4", "q": "An administrator is troubleshooting an error message which appears each time an application is started. The administrator has uninstalled and reinstalled the application, but the error message still appears. Which of the following would be the best next troubleshooting step?", "opts": ["Use Performance Monitor to view operational data", "Check the Event Viewer logs", "View the hardware settings in Device Manager", "Disable unneeded background processes in Services"], "ans": [1], "why": "<strong>Event Viewer logs</strong> provide detailed error codes and messages that identify the root cause of persistent application errors. When reinstalling doesn't fix the issue, the error log reveals whether the problem is a dependency, registry entry, or external service conflict.", "isAcronym": false}, {"id": "B45", "obj": "Obj 2.1", "q": "The employees of a company have direct access to applications and databases from their desktop computers. If the employees are using the company wireless network or the conference room, connectivity is only available after authenticating through a VPN. Which of the following would best describe this policy?", "opts": ["Multifactor authentication", "Group Policy", "Least privilege", "Zero trust"], "ans": [3], "why": "<strong>Zero trust</strong> requires all users to authenticate regardless of network location, never implicitly trusting any connection — even those on the internal network.", "isAcronym": false}, {"id": "A71", "obj": "Obj 2.2", "q": "A technician is troubleshooting a computer infected with a virus. The user thought they were opening a spreadsheet, but the file was actually a virus executable. Which of the following Windows options were most likely associated with this issue?", "opts": ["Always show icons, never thumbnails", "Display the full path in the title bar", "Always show menus", "Hide extensions for known file types"], "ans": [3], "why": "<strong>Hiding extensions</strong> causes a file like invoice.xlsx.exe to appear as invoice.xlsx, tricking users into executing malware.", "isAcronym": false}, {"id": "B67", "obj": "Obj 2.5", "q": "Four users in the accounting department have received similar emails asking for payment of an outstanding invoice and a link to a third-party payment site. The emails contains purchase information which appears to be correct, but additional research shows the invoice numbers are not valid. Which of the following would best describe this attack type?", "opts": ["Spear phishing", "Denial of service", "Shoulder surfing", "Evil twin"], "ans": [0], "why": "<strong>Spear phishing</strong> targets a specific group with personalized, convincing content to manipulate them into fraudulent action.", "isAcronym": false}, {"id": "C11", "obj": "Obj 1.8", "q": "A system administrator needs to modify the Linux group associated with a file. Which of the following would provide this functionality?", "opts": ["ps", "df", "chown", "grep"], "ans": [2], "why": "The <strong>chown</strong> command changes the owner and group associated with a file or directory in Linux. ps shows running processes. df reports disk space. grep searches for text patterns in files.", "isAcronym": false}, {"id": "B14", "obj": "Obj 3.2", "q": "A user runs a corporate app on their smartphone which downloads a database each time the app is started. This download process normally takes a few seconds, but today the download is taking minutes to complete. Which of the following should a technician follow as the best next troubleshooting step?", "opts": ["Disable Bluetooth", "Run a network speed check", "Charge the smartphone battery", "Check the cloud storage resource usage"], "ans": [1], "why": "When a normally fast download slows significantly, a <strong>network speed check</strong> determines if the issue is with the connection rather than the device.", "isAcronym": false}, {"id": "B76", "obj": "Obj 4.9", "q": "A user is traveling to a conference, and they would like to be sure any messages sent from their phone during the event remain private while using the event's wireless network. Which of the following should be configured on this user's phone?", "opts": ["VPN", "Strong password", "Network-based firewall", "Multi-factor authentication"], "ans": [0], "why": "A <strong>VPN</strong> encrypts all network traffic from the phone, protecting messages from interception on untrusted public wireless networks.", "isAcronym": false}, {"id": "ACR25", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Redundant Array of Independent Disks – storage redundancy/performance configuration</em>?", "opts": ["GPT", "RAID", "BIOS", "SSD"], "ans": [1], "why": "<strong>RAID</strong> stands for Redundant Array of Independent Disks – storage redundancy/performance configuration. GPT = GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB. SSD = Solid-State Drive – flash-based non-volatile storage. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "B37", "obj": "Obj 1.6", "q": "Which of the following Windows Share permissions has the priority when assigning access on a mapped drive?", "opts": ["Allow", "Full control", "List folder contents", "Deny"], "ans": [3], "why": "A <strong>Deny</strong> permission always overrides any Allow permission in Windows, regardless of group membership or other assignments.", "isAcronym": false}, {"id": "A10", "obj": "Obj 4.4", "q": "A desktop technician is cleaning the outside of computers used on a manufacturing assembly line. The assembly line creates sawdust and wood chips, so most of the computers are protected with enclosed computer cases. Which of the following would be the most important item for the technician to include during this cleaning process?", "opts": ["Surge suppressor", "Temperature sensor", "Air filter mask", "ESD mat"], "ans": [2], "why": "In environments with sawdust and wood chips, an <strong>air filter mask</strong> protects the technician from inhaling airborne particles during cleaning.", "isAcronym": false}, {"id": "B81", "obj": "Obj 4.4", "q": "A technician is upgrading the motherboard in a server. Which of the following should be the first task when beginning this upgrade?", "opts": ["Wear safety goggles", "Connect an ESD strap", "Remove any motherboard batteries", "Disconnect from all power sources"], "ans": [3], "why": "<strong>Disconnecting all power sources</strong> is always the first step before opening any system to perform internal hardware work.", "isAcronym": false}, {"id": "A13", "obj": "Obj 2.2", "q": "Which of these Windows features provides full disk encryption for all data on a storage drive?", "opts": ["Domain Services", "EFS", "RDP", "BitLocker"], "ans": [3], "why": "<strong>BitLocker</strong> is Windows' built-in full disk encryption feature that protects all data on a storage drive. EFS only encrypts individual files and folders. RDP is for remote desktop access.", "isAcronym": false}, {"id": "C35", "obj": "Obj 2.3", "q": "A company requires all users to authenticate to a proxy before communicating to external websites. Which of the following should be used to integrate the proxy authentication with the existing Active Directory credentials?", "opts": ["AES", "TKIP", "RADIUS", "WPA3"], "ans": [2], "why": "<strong>RADIUS</strong> provides centralized authentication integrating proxy services with existing Active Directory credentials. AES and TKIP are encryption algorithms. WPA3 is a wireless security protocol.", "isAcronym": false}, {"id": "C33", "obj": "Obj 2.7", "q": "A medical center's hospital staff uses shared computer systems installed in hallways and patient rooms. However, hospital administrators are concerned patient information might be visible if someone leaves the computer without logging out. Which of the following would help prevent this type of issue?", "opts": ["Multi-factor authentication", "Password expiration policy", "Login time restrictions", "Screensaver passwords"], "ans": [3], "why": "A <strong>screensaver password</strong> automatically locks the workstation after inactivity, preventing unauthorized access to patient data on shared systems.", "isAcronym": false}, {"id": "B38", "obj": "Obj 4.4", "q": "A data center manager would like to ensure any potential power fault on a server would not be harmful to employees. Which of the following would be the best choice for this requirement?", "opts": ["Electrical ground", "Battery backup", "Air filter mask", "ESD mat"], "ans": [0], "why": "Proper <strong>electrical grounding</strong> diverts fault current safely to ground, protecting employees from electrocution in the event of a power fault.", "isAcronym": false}, {"id": "C31", "obj": "Obj 1.8", "q": "A Linux administrator is using the grep command while monitoring a database application. Which of the following would best describe this activity?", "opts": ["Search through a file for specific text", "View a list of running processes", "Change the permissions of a file", "View the name of the working directory"], "ans": [0], "why": "The <strong>grep</strong> command searches through files or output for lines matching a specified text pattern. Running processes are viewed with ps or top. File permissions are changed with chmod.", "isAcronym": false}, {"id": "B43", "obj": "Obj 1.9", "q": "A user in the engineering department needs to use some applications written for Windows, but also needs to use applications designed for Linux. Which of the following would be the best way to provide access to these applications?", "opts": ["Assign the user multiple computers", "Boot the operating systems from two removable USBs", "Configure the user's PC for multiboot", "Compile the Linux applications in Windows"], "ans": [2], "why": "A <strong>multiboot</strong> configuration allows a single PC to run either Windows or Linux at startup, providing access to both sets of applications natively.", "isAcronym": false}, {"id": "A34", "obj": "Obj 2.8", "q": "A user in the finance department has purchased a new Android smartphone and has installed a number of productivity apps. After a day of use, the phone is displaying a large number of advertisements when browsing the Internet. Which of the following tasks should the user perform after completing a factory reset?", "opts": ["Disable Bluetooth", "Check app sharing permissions", "Run a speed test on the cellular connection", "Verify the source of each app before installation"], "ans": [3], "why": "Adware typically enters via apps from unofficial sources; <strong>verifying app sources</strong> before installation prevents future infections.", "isAcronym": false}, {"id": "B7", "obj": "Obj 4.5", "q": "A company has just performed annual laser printer maintenance, and has accumulated hundreds of used toner cartridges. Which of the following would be the best way to dispose of the old cartridges?", "opts": ["Take to a hazardous waste facility", "Send in bulk to the local landfill", "Separate the parts and dispose of normally", "Contract with an incineration company"], "ans": [0], "why": "Toner cartridges contain chemicals classified as <strong>hazardous waste</strong> and must be disposed of at an approved hazardous waste facility.", "isAcronym": false}, {"id": "A41", "obj": "Obj 1.2", "q": "A system administrator is configuring a server to use eight bootable partitions on a single SSD. Which of the following partition styles would be the best choice for this configuration?", "opts": ["MBR", "NTFS", "diskpart", "GPT"], "ans": [3], "why": "<strong>GPT</strong> supports up to 128 partitions and drives larger than 2TB, whereas MBR is limited to four primary partitions. NTFS is a file system, not a partition style. diskpart is a management utility.", "isAcronym": false}, {"id": "B75", "obj": "Obj 4.6", "q": "A manufacturing company in the United States sells monthly subscriptions from their website. Which of the following regulated data types would be the MOST important to manage?", "opts": ["Personal government-issued information", "Credit card transactions", "Healthcare data", "Software license terms"], "ans": [1], "why": "A subscription-based website processes credit card payments, making <strong>PCI DSS compliance</strong> for credit card transaction data the most critical regulatory concern.", "isAcronym": false}, {"id": "B86", "obj": "Obj 2.4", "q": "A user has downloaded a browser add-on which assists with new car purchases. During the installation, the Windows UAC is requesting permissions to continue with the install. Which of these is most likely?", "opts": ["The operating system requires an update", "The software is a Trojan horse", "The workstation is already part of a botnet", "A worm will be downloaded and installed"], "ans": [1], "why": "A <strong>Trojan horse</strong> disguises itself as legitimate software while requesting elevated permissions to install malicious components.", "isAcronym": false}, {"id": "A40", "obj": "Obj 1.5", "q": "A system administrator needs to view a set of application log files contained in a folder named \"logs.\" Which of the following commands should be used to make this folder the current directory?", "opts": ["cd logs", "mv logs", "dir logs", "md logs"], "ans": [0], "why": "The <strong>cd</strong> (change directory) command navigates to a specified directory, making it the current working directory. mv moves/renames files. dir lists directory contents. md creates a new directory.", "isAcronym": false}, {"id": "B54", "obj": "Obj 3.4", "q": "A user has noticed their mouse arrow has been moving around the screen when they are not touching the mouse. The user has watched the mouse opening applications and changing settings in the Control Panel. Which of the following would be the best way for an administrator to resolve this issue?", "opts": ["Turn the firewall off and back on again", "Run an anti-virus scan", "Remove all recently installed applications", "Upgrade to the latest OS patches"], "ans": [1], "why": "A mouse moving autonomously and opening applications indicates remote access malware or a RAT; an <strong>antivirus scan</strong> identifies and removes it.", "isAcronym": false}, {"id": "C89", "obj": "Obj 4.3", "q": "A company has configured a server for daily backups, and a full backup is created each Sunday based on the previous incremental backups. Which of the following would best describe this backup strategy?", "opts": ["Differential", "GFS", "Synthetic", "3-2-1"], "ans": [2], "why": "A <strong>synthetic full backup</strong> is created by combining a previous full backup with incremental backups, without reading data directly from the source.", "isAcronym": false}, {"id": "B48", "obj": "Obj 1.6", "q": "A system administrator needs to modify a file in the \\Windows\\Installer directory, but the folder doesn't appear in the list of available files. Which of these options would help the system administrator with this task?", "opts": ["Safe Mode", "File Explorer Options", "User Accounts", "Internet Options"], "ans": [1], "why": "<strong>File Explorer Options</strong> allows enabling the display of hidden files and folders, which are hidden by default in Windows. Safe Mode is a diagnostic boot environment. User Accounts manages logins.", "isAcronym": false}, {"id": "ACR53", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Temporal Key Integrity Protocol – older WPA encryption algorithm</em>?", "opts": ["HDD", "TKIP", "AUP", "DIMM"], "ans": [1], "why": "<strong>TKIP</strong> stands for Temporal Key Integrity Protocol – older WPA encryption algorithm. AUP = Acceptable Use Policy – document defining rules for use of company resources. DIMM = Dual In-line Memory Module – standard RAM form factor for desktops. HDD = Hard Disk Drive – traditional spinning magnetic storage.", "isAcronym": true}, {"id": "C64", "obj": "Obj 1.6", "q": "A user would like to configure their local printer to be accessible to anyone on the corporate network. Which of the following would be the best way to configure this connection?", "opts": ["Configure a VPN connection", "Create a share name in printer properties", "Configure a metered connection", "Use a static IP address"], "ans": [1], "why": "<strong>Creating a share name in printer properties</strong> makes the local printer visible and accessible to other users on the network.", "isAcronym": false}, {"id": "B73", "obj": "Obj 4.1", "q": "A system administrator has installed a SOHO network of five Windows computers. The administrator would like to provide a method of sharing documents and spreadsheets between all of the office computers. Which of the following would be the best way to provide this functionality?", "opts": ["Domain", "Proxy server", "Workgroup", "Remote Desktop"], "ans": [2], "why": "A <strong>Windows Workgroup</strong> provides peer-to-peer file and resource sharing for small networks without requiring a dedicated domain server.", "isAcronym": false}, {"id": "B79", "obj": "Obj 4.9", "q": "A system administrator needs to configure a laptop to support inbound Remote Desktop services for the help desk team. Which of these Control Panel features provides access to these settings?", "opts": ["Internet Options", "Devices and Printers", "Network and Sharing Center", "System"], "ans": [3], "why": "Remote Desktop settings are configured in the <strong>System</strong> section of Control Panel under the Remote tab.", "isAcronym": false}, {"id": "ACR03", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Boot Configuration Data – Windows boot loader data store</em>?", "opts": ["RAM", "BIOS", "BCD", "CPU"], "ans": [2], "why": "<strong>BCD</strong> stands for Boot Configuration Data – Windows boot loader data store. CPU = Central Processing Unit – the processor. BIOS = Basic Input/Output System – firmware interface pre-UEFI. RAM = Random-Access Memory – volatile system memory.", "isAcronym": true}, {"id": "A60", "obj": "Obj 3.3", "q": "A user is using a smartphone at their desk, and they occasionally receive a security warning in the browser. After some additional troubleshooting, the technician determines the security warnings are fake. Which of the following should a technician follow to best resolve this issue?", "opts": ["Put the phone into airplane mode", "Connect to the corporate network using a VPN connection", "Run an anti-malware scan on the smartphone", "Remove any paired Bluetooth devices"], "ans": [2], "why": "Fake security warnings in a mobile browser are a symptom of adware or malware; an <strong>anti-malware scan</strong> identifies and removes the cause.", "isAcronym": false}, {"id": "A38", "obj": "Obj 4.4", "q": "A server administrator is replacing the memory in a database server. Which of the following steps should be followed first?", "opts": ["Remove the existing memory modules", "Wear an air filter mask", "Disconnect all power sources", "Connect an ESD strap"], "ans": [2], "why": "<strong>Disconnecting all power sources</strong> before opening a server is the first safety step to prevent electrical shock and component damage.", "isAcronym": false}, {"id": "B64", "obj": "Obj 4.9", "q": "The clock on an executive's Windows laptop has consistently been losing time and is behind by a few minutes at the end of the week. The executive uses this laptop to monitor an assembly line and needs the time and date to be as accurate as possible. Which of these would be the best way to address this issue?", "opts": ["Create a login script to update the date and time", "Configure an NTP server", "Set the clock for a different time zone", "Replace the laptop batteries"], "ans": [1], "why": "An <strong>NTP server</strong> automatically synchronizes the system clock at regular intervals, correcting ongoing time drift without manual intervention.", "isAcronym": false}, {"id": "C55", "obj": "Obj 4.3", "q": "A company has recently been the victim of a storm with large-scale flooding, and all systems and backups at the corporate data center were completely destroyed. Which of the following would be the best way to avoid this loss of data in the future?", "opts": ["Battery backup", "Cloud storage", "RADIUS administration servers", "Image-level backups"], "ans": [1], "why": "<strong>Offsite cloud storage</strong> ensures backups survive local disasters like flooding that destroy on-premises systems and backup media.", "isAcronym": false}, {"id": "B30", "obj": "Obj 2.2", "q": "A manufacturing company performs a third-party audit of their accounting records each year. The auditors use laptops provided by the company to access internal resources. When the audit is complete, the auditors should be prevented from logging on until the following audit process begins. Which of the following would be the best way to accomplish this?", "opts": ["Uninstall the audit software", "Assign an expiration date to the auditor accounts", "Remove the auditor accounts from all Windows groups", "Require two-factor authentication for the auditor accounts"], "ans": [1], "why": "<strong>Account expiration dates</strong> automatically disable access after a defined date without requiring manual account management.", "isAcronym": false}, {"id": "ACR06", "obj": "Acronyms", "q": "What does <strong>DIMM</strong> stand for?", "opts": ["New Technology File System – standard Windows file system with permissions and encryption", "Dual In-line Memory Module – standard RAM form factor for desktops", "Random-Access Memory – volatile system memory", "Power-On Self-Test – hardware check performed at system startup"], "ans": [1], "why": "<strong>DIMM</strong> stands for <em>Dual In-line Memory Module – standard RAM form factor for desktops</em>. The other options describe POST, NTFS, and RAM respectively.", "isAcronym": true}, {"id": "B44", "obj": "Obj 4.1", "q": "A help desk technician has been tasked with rebuilding an email server which recently crashed. Which of the following would be the best source for the information required to reconstruct this system?", "opts": ["Compliance report", "Acceptable use policies", "Network topology map", "Knowledge base"], "ans": [3], "why": "A <strong>knowledge base</strong> contains documented procedures and configuration details needed to rebuild or reconstruct systems.", "isAcronym": false}, {"id": "C41", "obj": "Obj 4.6", "q": "The Human Resources department is installing a shared computer in the company lobby to use for electronic job applications. The kiosk should start automatically without requiring any network login prompt, and the kiosk should only have access to the job application modules. Which of the following account types would be the best choice for this system?", "opts": ["SSO user", "Administrator", "Guest", "Power User"], "ans": [2], "why": "A <strong>Guest</strong> account provides limited, restricted access without requiring domain authentication, making it ideal for a public-facing kiosk.", "isAcronym": false}, {"id": "B58", "obj": "Obj 1.2", "q": "A system administrator would like to create a Windows distribution which can automatically configure itself to connect to the corporate domain and automatically configure individual user email settings. Which of the following would be the best choice for this requirement?", "opts": ["Zero-touch deployment", "Recovery partition installation", "Image deployment", "In-place upgrade"], "ans": [0], "why": "<strong>Zero-touch deployment</strong> automates the entire setup process including domain join and email configuration with no manual intervention. Image deployment provides a snapshot but doesn't automate post-install configuration.", "isAcronym": false}, {"id": "C90", "obj": "Obj 2.5", "q": "Which of the following would allow someone else in the room to maliciously obtain a username and password?", "opts": ["Spoofing", "Tailgating", "DoS", "Shoulder surfing"], "ans": [3], "why": "<strong>Shoulder surfing</strong> involves directly observing someone entering credentials by looking over their shoulder.", "isAcronym": false}, {"id": "C73", "obj": "Obj 4.6", "q": "A company has created an internal process to ensure all PII is encrypted. Which of the following would be the most likely reason for adding this additional security?", "opts": ["Helps prevent identity theft", "Improves application performance", "Allows customer data to be easily deleted", "Uses less storage space"], "ans": [0], "why": "Encrypting PII ensures that even if data is breached, it cannot be used to steal identities as it is <strong>unreadable without the decryption key</strong>.", "isAcronym": false}, {"id": "B60", "obj": "Obj 1.7", "q": "A macOS user needs to protect all of the data on their laptop if the laptop is stolen or lost. Which of the following would be the best choice for this requirement?", "opts": ["Spaces", "Mission Control", "FileVault", "Keychain"], "ans": [2], "why": "<strong>FileVault</strong> provides full-disk encryption on macOS, protecting all data on the drive if the laptop is lost or stolen. Spaces is virtual desktops. Mission Control is multitasking view. Keychain stores passwords but doesn't encrypt the entire drive.", "isAcronym": false}, {"id": "B10", "obj": "Obj 4.4", "q": "Why would a technician use an ESD strap?", "opts": ["Protect electronic parts from extreme heat", "Keep electronic parts dry and free from moisture", "Prevent damage from static electricity", "Protect computer parts from dust"], "ans": [2], "why": "An <strong>ESD strap</strong> grounds the technician to prevent static electricity buildup from discharging into and damaging sensitive components.", "isAcronym": false}, {"id": "A12", "obj": "Obj 4.4", "q": "The motherboard of a server in the corporate data center has started smoking, and flames can be seen inside the computer case. Which of the following would be the best way to extinguish this fire?", "opts": ["Water hose", "Foam-based extinguisher", "Disconnect the power", "Carbon dioxide extinguisher"], "ans": [3], "why": "<strong>Carbon dioxide extinguishers</strong> are safe for electrical fires as they displace oxygen without leaving residue or conducting electricity.", "isAcronym": false}, {"id": "ACR01", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Apple File System – macOS native file system</em>?", "opts": ["EFS", "BIOS", "APFS", "ext4"], "ans": [2], "why": "<strong>APFS</strong> stands for Apple File System – macOS native file system. EFS = Encrypting File System – Windows feature for file-level encryption. ext4 = Fourth Extended Filesystem – primary Linux file system. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "A79", "obj": "Obj 1.6", "q": "While using a Windows laptop during presentations, a company vice president has reported her system is interrupting the meeting with system notifications from the browser, PDF reader, the Microsoft Store, and other applications. Which of the following would be the best way to address this issue?", "opts": ["Use a different laptop for presentations", "Run the presentation software as Administrator", "Enable Airplane mode while presenting", "Disable notifications while specific applications are running"], "ans": [3], "why": "Windows Focus Assist or per-application <strong>notification settings</strong> allow suppressing interruptions during presentations without disconnecting from the network. Airplane mode would cut off internet access.", "isAcronym": false}, {"id": "C83", "obj": "Obj 4.5", "q": "A technician has just received fifty boxes of used laser printer toner cartridges removed during an annual preventive maintenance project. Which of the following would be the best next step for managing these used cartridges?", "opts": ["Refer to the MSDS", "Ship the cartridges to the original manufacturer", "Incinerate the cartridges", "Drill a hole in each cartridge"], "ans": [0], "why": "The <strong>MSDS</strong> (Material Safety Data Sheet) provides the manufacturer's official guidance on safe handling and disposal of toner cartridges.", "isAcronym": false}, {"id": "C56", "obj": "Obj 1.6", "q": "A user commonly stores large graphic image files in a shared folder on a network server. After logging in one morning, the user notices the shared folders are no longer in the list of available storage drives
