. The user confirms they are logged in properly to the Windows Domain. Which of the following would be the most likely reason for this issue?", "opts": ["User's permissions have been modified", "User is running untrusted software", "Network is using MAC filtering", "Port security is enabled"], "ans": [0], "why": "If a user suddenly loses access to previously available network shares while still logged into the domain, the most likely cause is a change in their <strong>account permissions</strong>.", "isAcronym": false}, {"id": "C26", "obj": "Obj 4.8", "q": "Which of the following would be the best choice for a system administrator to manage an Active Directory database?", "opts": ["Batch file", "PowerShell", "JavaScript", "Visual Basic Scripting"], "ans": [1], "why": "<strong>PowerShell</strong> is Microsoft's preferred scripting environment for managing Active Directory with extensive built-in cmdlets for directory operations.", "isAcronym": false}, {"id": "A63b", "obj": "Obj 4.8", "q": "In which of the following file types would a system administrator expect to see the command, \"cd c:\\source\"?", "opts": ["  .sh", ".vbs", ".py", ".bat"], "ans": [3], "why": "The <strong>.bat</strong> (batch) file type executes Windows command-line instructions. .sh is a Linux shell script. .vbs is Visual Basic Script. .py is Python.", "isAcronym": false}, {"id": "ACR48", "obj": "Acronyms", "q": "What does <strong>PAM</strong> stand for?", "opts": ["Random-Access Memory – volatile system memory", "Graphical User Interface – visual OS interface", "Privileged Access Management – security controls for admin-level accounts", "File Allocation Table 32 – older Windows/cross-platform file system, 4GB max file size"], "ans": [2], "why": "<strong>PAM</strong> stands for <em>Privileged Access Management – security controls for admin-level accounts</em>. The other options describe FAT32, GUI, and RAM respectively.", "isAcronym": true}, {"id": "B23", "obj": "Obj 4.4", "q": "A desktop administrator is moving an SSD from one laptop to another. Which of the following should be used to protect the SSD during the move?", "opts": ["Padded envelope", "Anti-static bag", "Box with foam filler", "Cloth wrap"], "ans": [1], "why": "An <strong>anti-static bag</strong> shields electronic components from electrostatic discharge during transport between systems.", "isAcronym": false}, {"id": "A48", "obj": "Obj 3.4", "q": "A computer on a manufacturing floor has been identified as a malware-infected system. Which of the following should be the best next step to resolve this issue?", "opts": ["Disconnect the network cable", "Perform a malware scan", "Disable System Restore", "Download the latest anti-malware signatures"], "ans": [0], "why": "The first step when malware is identified is to quarantine the system by <strong>disconnecting it from the network</strong> to prevent spread.", "isAcronym": false}, {"id": "A85", "obj": "Obj 1.8", "q": "A Linux administrator has been asked to upgrade the web server software on a device. Which of the following would provide the administrator with the appropriate rights and permissions for this upgrade?", "opts": ["chmod", "apt", "dig", "sudo"], "ans": [3], "why": "The <strong>sudo</strong> command grants a user temporary elevated (root-level) privileges to perform administrative tasks. chmod changes file permissions. apt is a package manager. dig is a DNS lookup tool.", "isAcronym": false}, {"id": "B31", "obj": "Obj 2.9", "q": "A manufacturing company is donating some older computers to a local charity. Which of the following should be done to ensure the existing hard drives could still be used but none of the existing data would be recoverable?", "opts": ["Degaussing", "Regular format", "Shredder", "Quick format"], "ans": [1], "why": "A <strong>regular format</strong> overwrites the file system making data unrecoverable while leaving the drive functional. Degaussing and shredding destroy the drive entirely.", "isAcronym": false}, {"id": "ACR45", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Multi-Factor Authentication – requiring two or more verification factors</em>?", "opts": ["ReFS", "GPT", "MFA", "GUI"], "ans": [2], "why": "<strong>MFA</strong> stands for Multi-Factor Authentication – requiring two or more verification factors. GPT = GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB. ReFS = Resilient File System – Microsoft server-grade file system with fault tolerance. GUI = Graphical User Interface – visual OS interface.", "isAcronym": true}, {"id": "A65", "obj": "Obj 3.4", "q": "A desktop administrator has determined an employee in the corporate office has been using their computer to share copyrighted materials to others on the Internet. Which of the following should be the best next step?", "opts": ["Create a firewall rule to block Internet access to this computer", "Create a hash for each file which was shared", "Compile a list of licenses for each set of copyrighted materials", "Retrieve and securely store the computer"], "ans": [3], "why": "<strong>Securing the computer</strong> preserves physical evidence and prevents tampering, which is the proper first step in an incident response.", "isAcronym": false}, {"id": "B15", "obj": "Obj 1.4", "q": "A system administrator is analyzing a problem with a USB flash drive on a Windows computer. When the flash drive is inserted, the CPU utilization increases to 100%. The administrator would like to disable one of the computer's USB controllers for troubleshooting. Which of the following would provide this functionality?", "opts": ["Services", "Performance Monitor", "Event Viewer", "Device Manager"], "ans": [3], "why": "<strong>Device Manager</strong> allows administrators to enable, disable, and manage hardware controllers and their drivers. Services manages background processes. Performance Monitor tracks utilization over time.", "isAcronym": false}, {"id": "A16", "obj": "Obj 4.1", "q": "Each time a user starts a specific corporate application, a page of disclaimers and usage requirements is shown before the login prompt. Which of the following would best describe this page?", "opts": ["Splash screen", "Acceptable use policy", "Standard operating procedures", "Topology diagram"], "ans": [0], "why": "A <strong>splash screen</strong> is the introductory page displayed before login that often contains disclaimers, branding, or usage notices.", "isAcronym": false}, {"id": "A7", "obj": "Obj 3.2", "q": "A user has opened a help desk ticket regarding the battery life on their mobile phone. The battery in the phone held a charge for most of the day prior to connecting to the corporate network. The battery now only lasts about half a day and the back of the phone is warmer than usual. The phone is configured as follows: Storage: 216.2 GB of 512 GB used / Display and Brightness: Automatic / Wi-Fi: Enabled / Auto-lock: Disabled / VPN: Not connected / Low Power Mode: Disabled / Battery Maximum Capacity: 100%. Which of the following changes would have the best impact on battery performance?", "opts": ["Enable auto-lock", "Connect to the VPN", "Increase available storage space", "Disable Wi-Fi"], "ans": [0], "why": "<strong>Auto-lock disabled</strong> means the screen stays on indefinitely, which is the most significant battery drain given all other settings are normal.", "isAcronym": false}, {"id": "A17", "obj": "Obj 1.4", "q": "A system administrator is troubleshooting an older application on a Windows computer and needs to modify the UAC process. Which of the following options would provide access to these settings?", "opts": ["Device Manager", "System Information", "Event Viewer", "User Accounts"], "ans": [3], "why": "<strong>UAC</strong> (User Account Control) settings are accessible through the <strong>User Accounts</strong> section of Control Panel. Device Manager handles hardware. System Information displays system specs.", "isAcronym": false}, {"id": "C48", "obj": "Obj 1.6", "q": "A help desk is receiving reports associated with a group of devices not able to communicate outside of their local IP subnet. A technician can ping devices on the same network, but does not receive a response when pinging the IP address of external devices. Which of the following would be the most likely cause of this issue?", "opts": ["Default gateway", "DNS server", "Proxy server", "Metered connection"], "ans": [0], "why": "The <strong>default gateway</strong> routes traffic from the local subnet to external networks; a missing or incorrect gateway prevents outside communication while local pinging still works.", "isAcronym": false}, {"id": "C77", "obj": "Obj 4.5", "q": "A company is updating all of their UPS systems with new batteries. Which of the following would be the best way to dispose of the old batteries?", "opts": ["Take to a local hazardous waste facility", "Throw out with the paper trash", "Ship them to a battery wholesaler", "Bury them in a landfill"], "ans": [0], "why": "UPS batteries contain lead-acid or lithium compounds classified as <strong>hazardous materials</strong> requiring disposal at an approved facility.", "isAcronym": false}, {"id": "B61", "obj": "Obj 2.1", "q": "A data center manager is installing a new access door which will require multi-factor authentication. Which of the following should be used to meet this requirement? (Select TWO)", "opts": ["Cabinet locks", "Key fobs", "Privacy filter", "Palmprint scanner", "USB lock", "Cable lock"], "ans": [1, 3], "why": "A <strong>key fob</strong> (something you have) and a <strong>palmprint scanner</strong> (something you are) together satisfy two different MFA factor types. Cabinet locks, USB locks, and cable locks are physical security controls, not authentication factors.", "isAcronym": false}, {"id": "C14", "obj": "Obj 4.1", "q": "A system administrator is planning to upgrade two physical servers in the corporate data center to external cloud-based platforms. Which of the following would provide information on connectivity and the plans for remote site access?", "opts": ["Change scope", "End-user acceptance", "Backout plan", "Risk analysis"], "ans": [0], "why": "The <strong>change scope</strong> document defines what is included in the change, including connectivity requirements and access plans for the new environment.", "isAcronym": false}, {"id": "A78", "obj": "Obj 1.4", "q": "A system administrator is adding an additional drive to a server and extending the size of an existing volume. Which of the following utilities would provide a graphical summary of the existing storage configuration?", "opts": ["Disk Management", "Performance Monitor", "Event Viewer", "Task Scheduler", "Device Manager"], "ans": [0], "why": "<strong>Disk Management</strong> provides a graphical view of all drives and volumes and allows extending existing volumes. Performance Monitor tracks system performance. Event Viewer logs errors. Task Scheduler automates tasks.", "isAcronym": false}, {"id": "B65", "obj": "Obj 2.1", "q": "A network administrator is installing a set of upgraded Internet routers in the data center. Which of the following would be the best choices to secure the access to the internal data center door? (Select TWO)", "opts": ["Biometric lock", "ACL", "Bollard", "Additional lighting", "Motion sensor", "Access control vestibule"], "ans": [0, 5], "why": "A <strong>biometric lock</strong> and <strong>access control vestibule</strong> (mantrap) provide layered physical security for high-security data center entry. ACLs are logical controls. Bollards protect against vehicles.", "isAcronym": false}, {"id": "A86", "obj": "Obj 1.6", "q": "A user is connecting their laptop to an external monitor and keyboard, but the laptop goes into sleep mode if the laptop screen is shut. Which of the following utilities can be used to keep the laptop running when the lid is closed?", "opts": ["Power Options", "Device Manager", "Personalization", "User Accounts"], "ans": [0], "why": "<strong>Power Options</strong> in Control Panel includes a setting to define what happens when the laptop lid is closed, including keeping it running. Device Manager handles hardware drivers. Personalization controls display themes.", "isAcronym": false}, {"id": "A55", "obj": "Obj 1.6", "q": "An employee has modified the NTFS permissions on a folder to provide read access to Everyone. However, users connecting from a different computer do not have access to the file. Which of the following is the reason for this issue?", "opts": ["The NTFS permissions were not synchronized", "Share permissions restrict access from remote devices", "The user is an Administrator", "Remote users are connecting with Guest accounts"], "ans": [1], "why": "When accessing files remotely, both <strong>NTFS and share permissions</strong> apply; the more restrictive of the two takes effect. Share permissions default to restricted access, so even broad NTFS permissions can be overridden.", "isAcronym": false}, {"id": "ACR57", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Virtual Private Network – encrypted tunnel for secure remote access</em>?", "opts": ["UEFI", "RAM", "VPN", "MDM"], "ans": [2], "why": "<strong>VPN</strong> stands for Virtual Private Network – encrypted tunnel for secure remote access. UEFI = Unified Extensible Firmware Interface – modern replacement for BIOS. MDM = Mobile Device Management – platform for managing and enforcing mobile policies. RAM = Random-Access Memory – volatile system memory.", "isAcronym": true}, {"id": "C13", "obj": "Obj 4.5", "q": "A home user provides numerous online presentations during the day. However, the power in the area is not stable and there will often be short outages. Which of the following would help with this issue?", "opts": ["Cloud backups", "External storage device", "Battery backup", "Surge suppressor"], "ans": [2], "why": "A <strong>battery backup (UPS)</strong> maintains power during short outages, preventing presentation interruptions caused by unstable power.", "isAcronym": false}, {"id": "C57", "obj": "Obj 4.6", "q": "A company deploys a suite of commercial software onto every workstation in the organization. Which of the following would best describe this licensing?", "opts": ["Personal licenses", "Corporate license", "Open-source license", "End user licensing agreement"], "ans": [1], "why": "A <strong>corporate license</strong> covers deployment of software across multiple workstations within an organization under a single agreement.", "isAcronym": false}, {"id": "B41", "obj": "Obj 2.2", "q": "A user would like to encrypt a small group of files in a shared folder without modifying other files on the drive. Which of the following would be the best way to accomplish this?", "opts": ["EFS", "Save the files with Administrator rights", "BitLocker", "Save the files with a dollar sign at the end of the filename"], "ans": [0], "why": "<strong>EFS</strong> (Encrypting File System) encrypts individual files and folders without requiring full disk encryption. BitLocker encrypts the entire drive.", "isAcronym": false}, {"id": "C45", "obj": "Obj 2.10", "q": "A small company is located in a large office building shared by fifty different companies. A network administrator would like to limit the possibility of someone else in the building accidentally connecting to their wireless network. Which of these configuration settings would prevent their wireless network from appearing in a list of available networks?", "opts": ["MAC filtering", "Static IP addressing", "WPA3 encryption", "SSID suppression"], "ans": [3], "why": "<strong>SSID suppression</strong> (disabling SSID broadcast) hides the network name from appearing in available network lists.", "isAcronym": false}, {"id": "B28", "obj": "Obj 1.6", "q": "A user in the shipping department has logged into the Windows domain. However, the desktop does not show the user's normal wallpaper and all of the user's spreadsheets and documents in the \"My Documents\" folder are missing. Which of these would be the best way to restore the user's normal work environment?", "opts": ["Rename the user's folder and delete their profile in the registry", "Boot into Safe Mode and disable all startup applications", "Add the user to the Administrator group", "Update to the latest operating system version"], "ans": [0], "why": "A <strong>corrupted Windows profile</strong> can be rebuilt by renaming the existing profile folder and removing the registry entry, forcing Windows to create a fresh profile at next login.", "isAcronym": false}, {"id": "B25", "obj": "Obj 3.2", "q": "A user in the accounting department is having an issue with his smartphone reaching websites and retrieving mail when working from home. Inside the office, the phone appears to work normally. Which of the following would be the best next step for troubleshooting this issue?", "opts": ["Verify the network configuration at home", "Install the latest operating system updates", "Connect the phone to power when working at home", "Restart the smartphone after arriving at home"], "ans": [0], "why": "When a device works at one location but not another, the <strong>home network configuration</strong> (DNS, gateway, or ISP issue) is the most likely cause.", "isAcronym": false}, {"id": "B26", "obj": "Obj 1.2", "q": "A security administrator has been asked to reinstall Windows on a web server diagnosed with a rootkit infection. Which of the following installation methods would be the best choice for this server?", "opts": ["In-place upgrade", "Remote network installation", "Clean install", "Repair installation"], "ans": [2], "why": "A <strong>clean install</strong> completely removes the existing OS and any embedded rootkit, which cannot be reliably eliminated any other way. An in-place upgrade or repair installation leaves existing system files in place, risking rootkit persistence.", "isAcronym": false}, {"id": "A37", "obj": "Obj 1.4", "q": "A user has installed multiple applications over the last week. During the startup process, the computer now takes over fifteen minutes to display the Windows desktop. Which of the following utilities would help the system administrator troubleshoot this issue?", "opts": ["defrag", "Performance Monitor", "Task Manager", "robocopy"], "ans": [2], "why": "<strong>Task Manager's Startup tab</strong> shows all programs that launch at boot and allows disabling those causing slow startup times. defrag optimizes disk files. Performance Monitor tracks long-term resource usage. robocopy is a file copying utility.", "isAcronym": false}, {"id": "A52", "obj": "Obj 3.1", "q": "A workstation on a manufacturing floor is taking much longer to boot than normal. Which of the following would be the best way to troubleshoot this issue?", "opts": ["Replace the CPU", "Disable the startup applications", "Upgrade the RAM", "Install the latest OS patches"], "ans": [1], "why": "<strong>Disabling unnecessary startup applications</strong> reduces boot time by preventing resource-heavy programs from loading at startup.", "isAcronym": false}, {"id": "A76", "obj": "Obj 4.5", "q": "A data center manager requires each server to maintain at least fifteen minutes of uptime during a power failure. Which of these would be the best choice for this requirement?", "opts": ["Cloud-based storage", "UPS", "Redundant power supplies", "Surge suppressor"], "ans": [1], "why": "A <strong>UPS</strong> (Uninterruptible Power Supply) provides battery backup that maintains server operation for a defined period during a power failure.", "isAcronym": false}, {"id": "C21", "obj": "Obj 1.7", "q": "A desktop administrator has received a notification of a deployed RSR update. Which of the following would be most affected by this update?", "opts": ["macOS laptops", "Linux database servers", "Android tablets", "Windows desktops"], "ans": [0], "why": "<strong>RSR</strong> (Rapid Security Response) is an Apple-specific update mechanism that delivers critical security patches to macOS and iOS devices.", "isAcronym": false}, {"id": "C38", "obj": "Obj 1.4", "q": "A system administrator would like to upgrade a user's Windows video editing application to the latest version, but the upgrade utility fails with the error \"Not enough free space.\" Which of the following utilities would allow the system administrator to resolve this issue?", "opts": ["cleanmgr", "perfmon", "eventvwr", "taskschd", "diskmgmt"], "ans": [0], "why": "<strong>Disk Cleanup (cleanmgr)</strong> removes temporary files, cached data, and other unnecessary files to free up drive space. perfmon is Performance Monitor. eventvwr is Event Viewer. taskschd is Task Scheduler.", "isAcronym": false}, {"id": "C68", "obj": "Obj 2.9", "q": "A desktop technician is moving hard drives from one set of training room computers to another. Which of the following would allow the drives to be used in the new computers but prevent any of the existing data from being recovered?", "opts": ["Shredder", "Quick format", "Drill", "Standard format"], "ans": [3], "why": "A <strong>standard format</strong> overwrites the drive's file structure making existing data unrecoverable while keeping the drive functional.", "isAcronym": false}, {"id": "ACR02", "obj": "Acronyms", "q": "What does <strong>BIOS</strong> stand for?", "opts": ["Central Processing Unit – the processor", "File Allocation Table 32 – older Windows/cross-platform file system, 4GB max file size", "Personally Identifiable Information – data that can identify an individual", "Basic Input/Output System – firmware interface pre-UEFI"], "ans": [3], "why": "<strong>BIOS</strong> stands for <em>Basic Input/Output System – firmware interface pre-UEFI</em>. The other options describe FAT32, PII, and CPU respectively.", "isAcronym": true}, {"id": "ACR10", "obj": "Acronyms", "q": "What does <strong>FAT32</strong> stand for?", "opts": ["Boot Configuration Data – Windows boot loader data store", "Universal Serial Bus – standard connection interface for peripherals and boot media", "File Allocation Table 32 – older Windows/cross-platform file system, 4GB max file size", "Identity Access Management – managing user identities and access controls"], "ans": [2], "why": "<strong>FAT32</strong> stands for <em>File Allocation Table 32 – older Windows/cross-platform file system, 4GB max file size</em>. The other options describe BCD, IAM, and USB respectively.", "isAcronym": true}, {"id": "ACR52", "obj": "Acronyms", "q": "What does <strong>SSO</strong> stand for?", "opts": ["Solid-State Drive – flash-based non-volatile storage", "Single Sign-On – authenticate once to access multiple systems", "Extended File Allocation Table – cross-platform file system for flash drives", "Random-Access Memory – volatile system memory"], "ans": [1], "why": "<strong>SSO</strong> stands for <em>Single Sign-On – authenticate once to access multiple systems</em>. The other options describe RAM, exFAT, and SSD respectively.", "isAcronym": true}, {"id": "C19", "obj": "Obj 2.5", "q": "An attacker has gained access to a password hash file. Which of the following will the attacker use to obtain the passwords?", "opts": ["DoS", "Decryption", "Brute force", "Phishing"], "ans": [2], "why": "Attackers hash guessed passwords and compare them against stolen hashes using <strong>brute force</strong> until a match is found. Hashes are one-way functions, so decryption is not directly applicable.", "isAcronym": false}, {"id": "A83", "obj": "Obj 3.4", "q": "A user in the accounting department has opened a help desk ticket due to problems accessing the website of the company's payroll service provider. While testing other website connections on the computer, the technician finds many pop-up windows are displayed. Which of the following would be the best way for the technician to resolve this issue?", "opts": ["Uninstall the browser and reinstall with a different version", "Restore the workstation from a known good backup", "Start in Safe Mode and connect to the payroll website", "Modify the browser's proxy settings"], "ans": [1], "why": "Widespread pop-ups combined with access issues indicate a malware infection best resolved by <strong>restoring from a known good backup</strong>.", "isAcronym": false}, {"id": "A81", "obj": "Obj 2.6", "q": "A user has opened a help desk ticket for application slowdowns and unwanted pop-up windows. A technician updates the anti-virus software, scans the computer, and removes the malware. The technician then schedules future scans and creates a new restore point. Which of the following should be the next step in the removal process?", "opts": ["Disable System Restore", "Update the anti-virus signatures", "Quarantine the system", "Educate the end user"], "ans": [3], "why": "After completing all technical removal steps, <strong>educating the end user</strong> on prevention is the final step in the malware removal process.", "isAcronym": false}, {"id": "A61", "obj": "Obj 3.1", "q": "A user on the research and development team reports her computer displays the message \"Missing operating system\" during boot. A technician runs hardware diagnostics and finds the RAM, CPU, storage drive, and power supply all pass the tests. The technician then finds a connected USB flash drive was causing the issue. Which of the following would prevent this issue from occurring in the future?", "opts": ["Create a login script", "Install the latest OS patches", "Run SFC", "Modify the BIOS boot order"], "ans": [3], "why": "Setting the internal drive as the first boot device in <strong>BIOS boot order</strong> prevents the system from attempting to boot from a connected USB drive.", "isAcronym": false}, {"id": "A28", "obj": "Obj 3.1", "q": "A user on the headquarters network has opened a help desk ticket about their Windows desktop. When starting their computer, the login process proceeds normally but the Windows desktop takes fifteen minutes to appear. Yesterday, the desktop appeared in just a few seconds. Which of the following would be the most likely reason for this issue?", "opts": ["Slow profile load", "Incorrect boot device order", "Faulty RAM", "Incorrect username and password"], "ans": [0], "why": "When login succeeds but the desktop takes an unusually long time to appear, a <strong>corrupted or oversized user profile</strong> is the most likely cause.", "isAcronym": false}, {"id": "A89", "obj": "Obj 2.2", "q": "A company is deploying laptops to all of their field sales teams. The company is concerned about protecting the security of data if the laptop is stolen or misplaced. Which of the following would be the best way to address this concern?", "opts": ["Multifactor authentication", "Strong password policies", "Unique device certificates", "Data-at-rest encryption"], "ans": [3], "why": "<strong>Data-at-rest encryption</strong> (such as BitLocker) protects stored data on a stolen or lost device by making it unreadable without the decryption key. Passwords and MFA can be bypassed if the drive is physically removed.", "isAcronym": false}, {"id": "ACR56", "obj": "Acronyms", "q": "What does <strong>VNC</strong> stand for?", "opts": ["Apple File System – macOS native file system", "Central Processing Unit – the processor", "Small Outline DIMM – laptop RAM form factor", "Virtual Network Computing – cross-platform graphical remote desktop protocol"], "ans": [3], "why": "<strong>VNC</strong> stands for <em>Virtual Network Computing – cross-platform graphical remote desktop protocol</em>. The other options describe APFS, SODIMM, and CPU respectively.", "isAcronym": true}, {"id": "A29", "obj": "Obj 1.9", "q": "A system administrator has been asked to install a new application on a server, but the application is 64-bit and the server operating system is 32-bit. Which of the following describes the issue associated with this installation?", "opts": ["File permissions", "OS compatibility", "Installation method", "Available drive space"], "ans": [1], "why": "A <strong>64-bit application cannot run on a 32-bit operating system</strong> due to fundamental processor and memory addressing incompatibilities.", "isAcronym": false}, {"id": "A67", "obj": "Obj 1.6", "q": "A system administrator is creating a series of shared folders which should not be visible when users browse the network for available resources. What symbol should be added to the end of a share name to provide this functionality?", "opts": ["  . (period)", "$ (dollar sign)", "! (exclamation mark / bang)", "# (hash sign / number sign)"], "ans": [1], "why": "Appending a <strong>$</strong> symbol to a Windows share name creates a hidden share that does not appear when browsing network resources. Users can still access it by typing the full UNC path directly.", "isAcronym": false}, {"id": "A11", "obj": "Obj 2.11", "q": "After a user authenticates to a web site, the browser performs very slowly and some of the items on the page will not properly display. Which of the following would be the best way to resolve this issue?", "opts": ["Disable browser notifications", "Update the web server certificate", "Update the system BIOS", "Clear the browser cache"], "ans": [3], "why": "A corrupted or oversized <strong>browser cache</strong> can cause slow page loads and display issues; clearing it resolves these symptoms.", "isAcronym": false}, {"id": "A35", "obj": "Obj 2.1", "q": "When making configuration changes, a technician is assigned a temporary administrator password to use for the duration of the update. Once the administrator credentials are used, they are automatically deleted. Which of the following would best describe this process?", "opts": ["Single sign-on", "Data loss prevention", "User Access Console", "Just-in-time access"], "ans": [3], "why": "<strong>Just-in-time access</strong> grants temporary elevated credentials that are automatically revoked after use, minimizing the privilege exposure window.", "isAcronym": false}, {"id": "C86", "obj": "Obj 1.8", "q": "A technician is troubleshooting a problem on a Linux server and needs to view the real-time CPU and memory utilization for each operating system process. Which of the following would provide this functionality?", "opts": ["dig", "df", "cat", "top"], "ans": [3], "why": "The <strong>top</strong> command displays real-time system resource usage including CPU and memory per process in Linux. dig queries DNS. df reports disk space. cat displays file contents.", "isAcronym": false}, {"id": "C87", "obj": "Obj 3.1", "q": "A technician has just installed a new device driver and restarted a Windows laptop, but now the system shows a Windows Stop Error before the login screen is displayed. Which of the following would be the best way to resolve this issue?", "opts": ["Start in Safe Mode", "Replace the system memory", "Reinstall Windows from the original media", "Perform a full backup"], "ans": [0], "why": "<strong>Safe Mode</strong> loads Windows with minimal drivers, allowing the technician to remove or roll back the problematic driver causing the Stop Error.", "isAcronym": false}, {"id": "ACR35", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Video Graphics Array – older analog video output standard</em>?", "opts": ["BIOS", "EFS", "VGA", "NTP"], "ans": [2], "why": "<strong>VGA</strong> stands for Video Graphics Array – older analog video output standard. NTP = Network Time Protocol – synchronizes clocks across network devices. EFS = Encrypting File System – Windows feature for file-level encryption. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "B36", "obj": "Obj 1.2", "q": "A technician has created a Windows image which can be used across all of the computers in a test lab. Which of the following would be the best way to deploy these images?", "opts": ["Clean install", "Remote network installation", "Repair installation", "Bootable USB"], "ans": [1], "why": "<strong>Remote network installation</strong> is the most efficient method for deploying a single image to multiple computers simultaneously. A bootable USB requires individual visits to each machine.", "isAcronym": false}, {"id": "ACR22", "obj": "Acronyms", "q": "What does <strong>OS</strong> stand for?", "opts": ["Operating System – software managing hardware and applications", "Acceptable Use Policy – document defining rules for use of company resources", "Double Data Rate – RAM generation type (DDR4, DDR5)", "Hard Disk Drive – traditional spinning magnetic storage"], "ans": [0], "why": "<strong>OS</strong> stands for <em>Operating System – software managing hardware and applications</em>. The other options describe AUP, DDR, and HDD respectively.", "isAcronym": true}];
let questions=[],answered=0,correct=0,wrong=0,selMulti={};
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function init(){questions=shuffle(ALL_Q);answered=0;correct=0;wrong=0;selMulti={};updateSb();renderAll()}
function renderAll(){const a=document.getElementById('quiz-area');a.innerHTML='';questions.forEach((q,i)=>a.appendChild(buildCard(q,i)));document.getElementById('final-banner').style.display='none'}
function buildCard(q,idx){
  const isMulti=q.ans.length>1;
  const L=['A','B','C','D','E','F','G'];
  const d=document.createElement('div');d.className='qcard';d.id='card-'+idx;
  const src=q.isAcronym?'<span class="b-acr">Acronym</span>':'<span class="b-messer">Messer</span>';
  const ref=q.isAcronym?'<span class="b-ref">Acronyms</span>':'<span class="b-ref">'+q.id+' &nbsp;|&nbsp; '+q.obj+'</span>';
  let opts='';q.opts.forEach((o,i)=>{opts+=`<button class="abtn" id="btn-${idx}-${i}" onclick="handleAns(${idx},${i})">${L[i]}. ${o}</button>`});
  const sub=isMulti?`<button class="sub-btn" id="sub-${idx}" style="display:none" onclick="submitMulti(${idx})">Submit Answer</button>`:'';
  d.innerHTML=`<div class="qcard-header"><span class="qnum">Q${idx+1}</span><div class="qmeta">${src}${ref}</div></div><div class="qtext">${q.q}</div><div class="answers" id="ans-${idx}">${opts}</div>${sub}<div class="result-badge" id="rb-${idx}"></div><div class="explanation" id="ex-${idx}">${q.why}</div>`;
  return d;
}
function handleAns(qi,oi){
  const q=questions[qi];const isMulti=q.ans.length>1;
  if(isMulti){
    if(!selMulti[qi])selMulti[qi]=new Set();
    const btn=document.getElementById(`btn-${qi}-${oi}`);
    if(selMulti[qi].has(oi)){selMulti[qi].delete(oi);btn.classList.remove('sel-multi')}
    else{selMulti[qi].add(oi);btn.classList.add('sel-multi')}
    const sb=document.getElementById(`sub-${qi}`);
    if(sb)sb.style.display=selMulti[qi].size>0?'block':'none';
  }else{lockAndScore(qi,[oi])}
}
function submitMulti(qi){lockAndScore(qi,selMulti[qi]?[...selMulti[qi]]:[]);}
function lockAndScore(qi,selected){
  const q=questions[qi];const L=['A','B','C','D','E','F','G'];
  const cSet=new Set(q.ans);const sSet=new Set(selected);
  q.opts.forEach((_,i)=>{
    const btn=document.getElementById(`btn-${qi}-${i}`);
    btn.classList.add('locked');
    if(cSet.has(i)){btn.classList.add('correct');btn.classList.remove('sel-multi')}
    else if(sSet.has(i)){btn.classList.add('wrong-sel');btn.classList.remove('sel-multi')}
    else{btn.classList.add('unchosen')}
  });
  const sb=document.getElementById(`sub-${qi}`);if(sb)sb.style.display='none';
  const isOk=q.ans.length===selected.length&&q.ans.every(a=>sSet.has(a));
  const rb=document.getElementById(`rb-${qi}`);rb.style.display='block';
  if(isOk){rb.className='result-badge cor';rb.textContent='\u2713 Correct!';correct++;}
  else{
    rb.className='result-badge wrg';
    if(q.ans.length===1){rb.textContent='\u2717 Wrong \u2014 Answer: '+L[q.ans[0]];}
    else{
      const cL=q.ans.map(a=>L[a]).join(', ');
      const sL=selected.map(a=>L[a]).join(', ')||'none';
      const missing=q.ans.filter(a=>!sSet.has(a)).map(a=>L[a]);
      const extra=selected.filter(a=>!cSet.has(a));
      if(extra.length===0&&missing.length>0){rb.textContent='\u2717 Incomplete \u2014 Missing: '+missing.join(', ')+'. You selected: '+sL+'.';}
      else{rb.textContent='\u2717 Wrong \u2014 Correct: '+cL+'. You selected: '+sL+'.';}
    }
    wrong++;
  }
  document.getElementById(`ex-${qi}`).style.display='block';
  answered++;updateSb();
  if(answered===questions.length)showFinal();
}
function updateSb(){
  const tot=questions.length;
  document.getElementById('sc-cor').textContent=correct;
  document.getElementById('sc-wrg').textContent=wrong;
  document.getElementById('sc-rem').textContent=tot-answered;
  document.getElementById('sc-pct').textContent=(answered>0?Math.round((correct/tot)*100):0)+'%';
  document.getElementById('prog-bar').style.width=(answered/tot*100)+'%';
}
function showFinal(){
  const tot=questions.length;const pct=Math.round((correct/tot)*100);
  const b=document.getElementById('final-banner');b.style.display='block';
  const pass=pct>=78;
  b.style.background=pass?'#00e87a':'#ff3b5c';
  b.style.color='#fff';b.style.borderColor=pass?'#00e87a':'#ff3b5c';
  document.getElementById('final-text').textContent='Final Score: '+pct+'%';
  document.getElementById('final-sub').textContent=correct+' correct out of '+tot+' \u2014 '+(pass?'PASS \u2713':'FAIL \u2717')+' (passing score: 78%)';
  b.scrollIntoView({behavior:'smooth'});
}
function retake(){window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>init(),300);}
init();
</script>
<script src="footer.js"></script>
