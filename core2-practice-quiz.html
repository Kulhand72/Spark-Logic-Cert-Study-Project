<!DOCTYPE html>
<html lang="en">
<head>

<title>CompTIA A+ Core 2 (220-1202) &mdash; Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e6ede6;color:#1a1a1a;font-family:'Syne',sans-serif;min-height:100vh}
#scoreboard{position:sticky;top:0;z-index:1000;background:#dce5dc;border-bottom:1px solid #bccfbc;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.sc-item{display:flex;flex-direction:column;align-items:center}
.sc-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace}
.sc-val{font-size:16px;font-weight:600;font-family:'Syne',sans-serif}
.sc-val.cor{color:#00e87a}.sc-val.wrg{color:#ff3b5c}.sc-val.rem{color:#666}.sc-val.pct{color:#ffd166}
#quiz-title{font-size:15px;font-weight:700;color:#1a1a1a}
#prog-wrap{position:sticky;top:73px;z-index:999;height:6px;background:#e6ede6}
#prog-bar{height:6px;background:linear-gradient(90deg,#00c2ff,#00e87a);width:0%;transition:width 300ms ease-out}
#container{max-width:760px;margin:32px auto;padding:0 20px}
.qcard{background:#f4f9f4;border:1px solid #bccfbc;border-radius:8px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.qnum{background:#00c2ff;color:#fff;padding:4px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;white-space:nowrap}
.qmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.b-messer{background:#1a3a2a;color:#4ade80;padding:4px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px}
.b-acr{background:#2a1a3a;color:#c084fc;padding:4px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px}
.b-ref{font-family:'JetBrains Mono',monospace;font-size:13px;color:#666}
.qtext{font-size:18px;color:#1a1a1a;margin-bottom:20px;line-height:1.6;font-family:'Syne',sans-serif}
.answers{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.abtn{background:#fff;color:#1a1a1a;padding:12px 16px;border:1px solid #bccfbc;border-radius:6px;cursor:pointer;font-family:'Syne',sans-serif;font-size:16px;text-align:left;transition:all 200ms ease-out;line-height:1.4}
.abtn:hover:not(.locked){background:#f0f7f0;border-color:#00c2ff}
.abtn.sel-multi{background:#00c2ff;color:#fff;border-color:#00c2ff}
.abtn.locked{pointer-events:none}
.abtn.correct{background:#00e87a!important;color:#fff!important;border-color:#00e87a!important;opacity:1!important}
.abtn.wrong-sel{background:#ff3b5c!important;color:#fff!important;border-color:#ff3b5c!important;opacity:1!important}
.abtn.unchosen{background:#f4f9f4;opacity:.5;border-color:#bccfbc}
.sub-btn{background:#00c2ff;color:#fff;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-top:12px;transition:background 200ms}
.sub-btn:hover{background:#00b3e6}
.result-badge{background:#f4f9f4;border:1px solid #bccfbc;border-radius:6px;padding:12px 16px;margin:16px 0;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;display:none}
.result-badge.cor{color:#00e87a}.result-badge.wrg{color:#ff3b5c}
.explanation{background:#f4f9f4;border:1px solid #bccfbc;border-radius:6px;padding:16px;margin-top:12px;font-family:'Space Grotesk',sans-serif;font-size:15px;line-height:1.6;color:#1a1a1a;display:none}
#final-banner{display:none;border-radius:8px;padding:32px;text-align:center;margin:32px 0;border-width:2px;border-style:solid}
#final-banner h2{font-size:24px;font-weight:700;font-family:'Syne',sans-serif}
#final-banner p{margin-top:8px;font-size:16px;font-family:'Syne',sans-serif}
#retake-btn{background:#00c2ff;color:#fff;padding:12px 24px;border:none;border-radius:6px;cursor:pointer;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-top:20px;transition:background 200ms}
#retake-btn:hover{background:#00b3e6}
</style>
</head>
<body>
<div id="scoreboard">
  <div id="quiz-title">CompTIA A+ Core 2 (220-1202)</div>
  <div style="display:flex;gap:24px;flex-wrap:wrap">
    <div class="sc-item"><span class="sc-label">Correct</span><span class="sc-val cor" id="sc-cor">0</span></div>
    <div class="sc-item"><span class="sc-label">Wrong</span><span class="sc-val wrg" id="sc-wrg">0</span></div>
    <div class="sc-item"><span class="sc-label">Remaining</span><span class="sc-val rem" id="sc-rem">0</span></div>
    <div class="sc-item"><span class="sc-label">Score %</span><span class="sc-val pct" id="sc-pct">0%</span></div>
  </div>
</div>

<div id="container">
  <div id="quiz-area"></div>
  <div id="final-banner">
    <h2 id="final-text"></h2>
    <p id="final-sub"></p>
    <button id="retake-btn" onclick="retake()">Retake Quiz</button>
  </div>
</div>
<script>
const ALL_Q = [{"id": "ACR27", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Resilient File System – Microsoft server-grade file system with fault tolerance</em>?", "opts": ["RAM", "FAT32", "PXE", "ReFS"], "ans": [3], "why": "<strong>ReFS</strong> stands for Resilient File System – Microsoft server-grade file system with fault tolerance. FAT32 = File Allocation Table 32 – older Windows/cross-platform file system, 4GB max file size. PXE = Preboot eXecution Environment – network boot protocol for remote OS installation. RAM = Random-Access Memory – volatile system memory.", "isAcronym": true}, {"id": "ACR24", "obj": "Acronyms", "q": "What does <strong>PXE</strong> stand for?", "opts": ["Solid-State Drive – flash-based non-volatile storage", "Facial Recognition Technology – biometric authentication using facial features", "Secure Shell – encrypted protocol for remote command-line access", "Preboot eXecution Environment – network boot protocol for remote OS installation"], "ans": [3], "why": "<strong>PXE</strong> stands for <em>Preboot eXecution Environment – network boot protocol for remote OS installation</em>. The other options describe SSH, FRT, and SSD respectively.", "isAcronym": true}, {"id": "B46", "obj": "Obj 2.4", "q": "A user has called the help desk to get assistance with random blue screens on their Windows laptop. The technician finds CPU utilization is constantly high, and many network sites are unavailable or only load half of the site content. The user mentions some random pop-up messages have appeared on the desktop during the workday. Which of the following would be the most likely reason for these issues?", "opts": ["Storage drive is failing", "Network proxy settings are incorrect", "Operating system needs to be updated", "Laptop has a malware infection", "Video subsystem is faulty"], "ans": [3], "why": "The combination of high CPU, random BSODs, pop-ups, and degraded network access is a classic pattern of active <strong>malware infection</strong>.", "isAcronym": false}, {"id": "C34", "obj": "Obj 2.8", "q": "A user has a smartphone to assist with maps and directions when traveling to other company locations. At a remote site, the user finds his phone attempting to contact a third-party website to share location information. Which of the following would be the best way to address this issue?", "opts": ["Disable the GPS", "Perform a soft reset", "Run an anti-malware scan", "Use the cellular network instead of Wi-Fi"], "ans": [2], "why": "Unauthorized transmission of location data to a third-party site is a symptom of <strong>stalkerware or spyware</strong> requiring an anti-malware scan.", "isAcronym": false}, {"id": "A24", "obj": "Obj 1.5", "q": "A system administrator has created a shared folder on a server to store operating system images. Technicians access the shared folder to download the latest images when performing large-scale system installations. Which of the following will be the most likely method of accessing this data?", "opts": ["Map the shared folder to an available drive letter", "Download the shared folder through a proxy", "Link the images to a cloud storage service", "Access the folder using a remote access client"], "ans": [0], "why": "<strong>Mapping a shared folder to a drive letter</strong> provides easy, persistent access through File Explorer using net use or GUI mapping. A proxy is for web traffic. Cloud storage would require file migration.", "isAcronym": false}, {"id": "ACR37", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Video Random-Access Memory – dedicated memory for GPU/graphics processing</em>?", "opts": ["VGA", "HDD", "VRAM", "CPU"], "ans": [2], "why": "<strong>VRAM</strong> stands for Video Random-Access Memory – dedicated memory for GPU/graphics processing. HDD = Hard Disk Drive – traditional spinning magnetic storage. VGA = Video Graphics Array – older analog video output standard. CPU = Central Processing Unit – the processor.", "isAcronym": true}, {"id": "ACR40", "obj": "Acronyms", "q": "What does <strong>AUP</strong> stand for?", "opts": ["Central Processing Unit – the processor", "Facial Recognition Technology – biometric authentication using facial features", "Multi-Factor Authentication – requiring two or more verification factors", "Acceptable Use Policy – document defining rules for use of company resources"], "ans": [3], "why": "<strong>AUP</strong> stands for <em>Acceptable Use Policy – document defining rules for use of company resources</em>. The other options describe MFA, FRT, and CPU respectively.", "isAcronym": true}, {"id": "ACR30", "obj": "Acronyms", "q": "What does <strong>SODIMM</strong> stand for?", "opts": ["Small Outline DIMM – laptop RAM form factor", "Random-Access Memory – volatile system memory", "Double Data Rate – RAM generation type (DDR4, DDR5)", "Time-based One-Time Password – rotating codes used in authenticator apps"], "ans": [0], "why": "<strong>SODIMM</strong> stands for <em>Small Outline DIMM – laptop RAM form factor</em>. The other options describe TOTP, DDR, and RAM respectively.", "isAcronym": true}, {"id": "C46", "obj": "Obj 1.2", "q": "A manager in the accounting department would like to upgrade to Windows 11, but she doesn't want to lose access to any of the currently installed applications or data. Which of the following methods would be the best choice for these requirements?", "opts": ["Clean install", "Image deployment", "Remote network installation", "In-place upgrade"], "ans": [3], "why": "An <strong>in-place upgrade</strong> preserves all existing applications, files, and settings while upgrading the OS version. A clean install wipes everything. Image deployment replaces the OS with a pre-built snapshot. Remote network installation is a delivery method, not a preservation strategy.", "isAcronym": false}, {"id": "A20", "obj": "Obj 1.4", "q": "A user is attempting to start an application on his laptop computer. Each time the application shows the starting graphic, it suddenly disappears and the application icon disappears from the taskbar. A technician would like to get more information about each previous occurrence of the application crash. Which of these choices would provide these details?", "opts": ["Event Viewer", "Task Manager", "Startup Repair", "Safe Mode"], "ans": [0], "why": "<strong>Event Viewer</strong> logs application crashes and errors with timestamps, providing a history of each occurrence. Task Manager shows current processes but not crash history. Startup Repair fixes boot issues.", "isAcronym": false}, {"id": "ACR05", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Double Data Rate – RAM generation type (DDR4, DDR5)</em>?", "opts": ["DDR", "BIOS", "NTFS", "AES"], "ans": [0], "why": "<strong>DDR</strong> stands for Double Data Rate – RAM generation type (DDR4, DDR5). AES = Advanced Encryption Standard – symmetric block cipher used in WPA2/WPA3. NTFS = New Technology File System – standard Windows file system with permissions and encryption. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "B42", "obj": "Obj 1.2", "q": "Which of the following partition types limit a Windows installation to a maximum partition size of 2 TB?", "opts": ["FAT32", "GPT", "APFS", "MBR"], "ans": [3], "why": "<strong>MBR</strong> (Master Boot Record) has a hard 2TB maximum partition size limit and supports only four primary partitions. GPT supports partitions larger than 2TB. FAT32 is a file system. APFS is Apple's file system.", "isAcronym": false}, {"id": "C78", "obj": "Obj 4.1", "q": "Which of the following should a company use to reduce their legal liability if an employee is dismissed?", "opts": ["End user licensing agreement", "Acceptable use policy", "Standard operating procedures", "Regulatory compliance documentation"], "ans": [1], "why": "An <strong>AUP</strong> documents the rules employees must follow; having employees acknowledge it provides legal evidence of policy violations during dismissal proceedings.", "isAcronym": false}, {"id": "A32", "obj": "Obj 2.4", "q": "An internal audit has found a server in the DMZ which appears to be infected with malware. The malware does not appear to be part of a file in the OS, and the malware runs each time the system is started. What type of malware would be most likely found on this server?", "opts": ["Trojan", "Ransomware", "Keylogger", "Spyware", "Boot sector virus"], "ans": [4], "why": "A <strong>boot sector virus</strong> infects the master boot record rather than OS files, executing at every startup before the OS loads.", "isAcronym": false}, {"id": "A36", "obj": "Obj 2.1", "q": "A user has been provided with a username and password for accessing the corporate VPN. The user has also been provided with a hardware device displaying a six digit code, and the code changes every 30 seconds. Which of the following would best describe the use of this device?", "opts": ["ACL", "Group Policy", "SMS", "Least privilege", "MFA"], "ans": [4], "why": "A hardware token generating a rotating time-based code combined with a password is a form of <strong>MFA</strong> (Multi-Factor Authentication) — something you know plus something you have.", "isAcronym": false}, {"id": "A45", "obj": "Obj 1.7", "q": "The hard drive in a macOS desktop has failed and none of the data on the drive is recoverable. A new storage drive has now been installed. Which of the following should be used to restore the data on the computer?", "opts": ["Backup and Restore", "Mission Control", "Time Machine", "Disk Utility"], "ans": [2], "why": "<strong>Time Machine</strong> is macOS's built-in backup utility used to restore data to a new drive after a failure. Backup and Restore is a Windows tool. Mission Control is macOS multitasking. Disk Utility manages disk formatting and repair.", "isAcronym": false}, {"id": "C63", "obj": "Obj 2.8", "q": "A user's smartphone contains company confidential information which should not be shared outside of the organization. Which of the following would be the best way to limit access to this data if the smartphone was lost or stolen?", "opts": ["Locator application", "Remote wipe", "Authenticator app", "Cloud backup"], "ans": [1], "why": "A <strong>remote wipe</strong> erases all data on a lost or stolen device, preventing unauthorized access to company confidential information.", "isAcronym": false}, {"id": "C40", "obj": "Obj 4.4", "q": "Which of the following fire extinguishers would be most appropriate to use in a data center?", "opts": ["Foam", "Carbon Dioxide", "Saline", "Water"], "ans": [1], "why": "<strong>Carbon dioxide extinguishers</strong> are ideal for data centers as they suppress electrical fires without damaging equipment or leaving conductive residue.", "isAcronym": false}, {"id": "B57", "obj": "Obj 3.2", "q": "A user on the sales team has opened a help desk ticket because of short battery times on a new company-provided tablet. When using the tablet, the battery only lasts a few hours before shutting off. Which of the following would be the best choices for improving the battery life? (Select TWO)", "opts": ["Install the latest operating system patches", "Increase the brightness levels", "Connect to the corporate VPN", "Disable Bluetooth and cellular connections", "Close apps which work in the background", "Perform a soft reset"], "ans": [3, 4], "why": "<strong>Disabling unused radios</strong> (Bluetooth and cellular) and <strong>closing background apps</strong> are the most direct ways to reduce battery consumption.", "isAcronym": false}, {"id": "A90", "obj": "Obj 2.5", "q": "A company has discovered a recent data breach, and this breach appears to have originated through a vulnerability introduced with a software upgrade. The vulnerability was added by the attacker at the source and distributed to all customers who performed the upgrade. Which of the following would best describe this attack type?", "opts": ["Supply chain attack", "Insider threat", "Business email compromise", "On-path attack"], "ans": [0], "why": "A <strong>supply chain attack</strong> compromises software at the source before distribution, affecting all customers who install the update.", "isAcronym": false}, {"id": "B55", "obj": "Obj 4.2", "q": "A server administrator has been planning an operating system upgrade for a group of important services. The administrator has provided a detailed scope and risk assessment of the change, and the plan has been documented. However, the risk analysis wasn't completed until Friday afternoon, so the change cannot occur over the weekend. Which of the following is preventing the upgrade from occurring?", "opts": ["Upgrade file availability", "Change board approval", "Not enough time to complete the upgrade", "Need more people for the upgrade process"], "ans": [1], "why": "<strong>Change board approval</strong> must be obtained before any change proceeds; submitting the risk analysis too late means approval cannot be granted in time.", "isAcronym": false}, {"id": "A51", "obj": "Obj 1.4", "q": "A system administrator would like all help desk computers to check for anti-virus signature updates every hour during the workday. Which of the following would be the best way to provide this functionality?", "opts": ["System Configuration", "Task Scheduler", "Device Manager", "Certificate Manager", "SFC"], "ans": [1], "why": "<strong>Task Scheduler</strong> automates the execution of programs or scripts at defined time intervals without manual intervention. System Configuration manages startup settings. Device Manager handles hardware.", "isAcronym": false}, {"id": "A70", "obj": "Obj 4.1", "q": "A help desk director would like to identify and track computer systems which have been returned for service or moved from one location to another. Which of the following would be the best solution for these requirements?", "opts": ["Cable labels", "Asset tags", "Topology diagrams", "Login names"], "ans": [1], "why": "<strong>Asset tags</strong> provide unique identifiers on physical hardware that allow tracking of location, service history, and movement.", "isAcronym": false}, {"id": "ACR39", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Advanced Encryption Standard – symmetric block cipher used in WPA2/WPA3</em>?", "opts": ["POST", "AES", "RSR", "HDD"], "ans": [1], "why": "<strong>AES</strong> stands for Advanced Encryption Standard – symmetric block cipher used in WPA2/WPA3. POST = Power-On Self-Test – hardware check performed at system startup. RSR = Rapid Security Response – Apple's fast-delivery security patch system for macOS/iOS. HDD = Hard Disk Drive – traditional spinning magnetic storage.", "isAcronym": true}, {"id": "B16", "obj": "Obj 3.2", "q": "A user is reporting some apps launched on their mobile phone will show an error message and then disappear without starting. This problem occurs with a group of apps normally used during the work day. Which of the following tasks would be the first step for troubleshooting this issue?", "opts": ["Install the previous version of the apps", "Connect the phone to a power source", "Power cycle the phone", "Disable the GPS radio"], "ans": [2], "why": "<strong>Power cycling</strong> is the first troubleshooting step for multiple apps failing to launch as it clears memory and resets system processes.", "isAcronym": false}, {"id": "A63", "obj": "Obj 1.5", "q": "In which of the following file types would a system administrator expect to see the command, \"cd c:\\source\"?", "opts": ["  .sh", ".vbs", ".py", ".bat"], "ans": [3], "why": "The <strong>.bat</strong> (batch) file type is a Windows command-line script format that executes DOS/Windows commands like cd. .sh is a Linux/macOS shell script. .vbs is Visual Basic Script. .py is Python.", "isAcronym": false}, {"id": "C75", "obj": "Obj 1.3", "q": "A user has purchased a computer which uses a 32-bit version of an operating system. Which of the following would be the maximum amount of RAM supported in this OS?", "opts": ["32 GB", "2 TB", "512 GB", "128 GB", "4 GB", "16 GB"], "ans": [4], "why": "<strong>32-bit operating systems</strong> are architecturally limited to a 4 GB maximum addressable memory space due to the 2^32 address limit. All other options exceed this architectural ceiling.", "isAcronym": false}, {"id": "ACR09", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Fourth Extended Filesystem – primary Linux file system</em>?", "opts": ["SSD", "ext4", "NVMe", "VRAM"], "ans": [1], "why": "<strong>ext4</strong> stands for Fourth Extended Filesystem – primary Linux file system. VRAM = Video Random-Access Memory – dedicated memory for GPU/graphics processing. NVMe = Non-Volatile Memory Express – high-speed SSD interface protocol. SSD = Solid-State Drive – flash-based non-volatile storage.", "isAcronym": true}, {"id": "B24", "obj": "Obj 3.4", "q": "A user is performing a series of Google searches, but the results pages are displaying links and advertisements from a different website. This issue occurs each time a Google search is performed. The same Google search on a different computer results in a normal Google results page. Which of the following would resolve this issue?", "opts": ["Run the search from Safe Mode", "Install the latest operating system patches", "Run a malware removal utility", "Login as a different user"], "ans": [2], "why": "Search result hijacking that occurs only on one computer is a classic symptom of <strong>browser-redirecting malware</strong> requiring a malware removal scan.", "isAcronym": false}, {"id": "A58", "obj": "Obj 3.4", "q": "A user has received a pop up message on their computer stating applications on their computer are infected with a virus. A technician has determined the pop up message is a hoax and it needs to be removed from the computer. The technician has disabled System Restore to remove all previous restore points. Which of the following tasks would be the best next step?", "opts": ["Update the anti-virus signatures", "Educate the end-user", "Schedule anti-virus scans for midnight each day", "Boot the system with the original installation media"], "ans": [0], "why": "After disabling System Restore, <strong>updating antivirus signatures</strong> ensures the scanner has the latest definitions to identify and remove the fake alert malware.", "isAcronym": false}, {"id": "ACR55", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Uninterruptible Power Supply – battery backup to maintain power during outages</em>?", "opts": ["FRT", "UPS", "ext4", "GPU"], "ans": [1], "why": "<strong>UPS</strong> stands for Uninterruptible Power Supply – battery backup to maintain power during outages. ext4 = Fourth Extended Filesystem – primary Linux file system. FRT = Facial Recognition Technology – biometric authentication using facial features. GPU = Graphics Processing Unit – dedicated graphics processor.", "isAcronym": true}, {"id": "A46", "obj": "Obj 2.7", "q": "A user purchased a copy of home tax software and has installed it on their company computer. This morning, the user logs in and finds the tax software has been automatically removed from the system. Which of the following would be the most likely reason for this result?", "opts": ["The company per-seat licenses are all in use", "The software uses an open-source license", "The user has installed a personal license", "The software requires a USB key for DRM"], "ans": [2], "why": "Corporate MDM or software management policies typically detect and remove <strong>personally licensed software</strong> installed on company devices.", "isAcronym": false}, {"id": "ACR44", "obj": "Acronyms", "q": "What does <strong>IAM</strong> stand for?", "opts": ["Central Processing Unit – the processor", "Encrypting File System – Windows feature for file-level encryption", "Solid-State Drive – flash-based non-volatile storage", "Identity Access Management – managing user identities and access controls"], "ans": [3], "why": "<strong>IAM</strong> stands for <em>Identity Access Management – managing user identities and access controls</em>. The other options describe CPU, EFS, and SSD respectively.", "isAcronym": true}, {"id": "B33", "obj": "Obj 3.1", "q": "A desktop administrator is troubleshooting an older computer which has been slowing down as more applications and files are stored on the hard drive. Which of the following commands would be the best choice for increasing the performance of this computer?", "opts": ["defrag", "format", "sfc", "xcopy", "winver"], "ans": [0], "why": "The <strong>defrag</strong> command reorganizes fragmented files on an HDD, reducing seek times and improving read/write performance.", "isAcronym": false}, {"id": "ACR33", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Unified Extensible Firmware Interface – modern replacement for BIOS</em>?", "opts": ["MBR", "USB", "exFAT", "UEFI"], "ans": [3], "why": "<strong>UEFI</strong> stands for Unified Extensible Firmware Interface – modern replacement for BIOS. exFAT = Extended File Allocation Table – cross-platform file system for flash drives. MBR = Master Boot Record – legacy partition style, max 4 partitions, max 2TB. USB = Universal Serial Bus – standard connection interface for peripherals and boot media.", "isAcronym": true}, {"id": "C72", "obj": "Obj 3.2", "q": "A user's smartphone app shows a splash screen but disappears after a few seconds. Which of the following would be the best way for a technician to view logs and memory statistics for the app?", "opts": ["Developer mode", "Cloud storage", "Jailbreaking", "Application spoofing"], "ans": [0], "why": "<strong>Developer mode</strong> on mobile devices provides access to application logs, memory statistics, and debugging tools not available in standard mode.", "isAcronym": false}, {"id": "A56", "obj": "Obj 2.9", "q": "A healthcare company has replaced some of their desktop computers with laptops and will be disposing of the older computers. The security administrator would like to guarantee none of the existing data on the hard drives could be recovered once the systems are sent to the recycling center. Which of the following methods would meet this requirement?", "opts": ["Quick format", "Reinstall the OS", "Remove all user folders", "Shred the drives"], "ans": [3], "why": "Physical <strong>shredding</strong> of drives is the only method that guarantees data cannot be recovered, meeting the highest security disposal requirement.", "isAcronym": false}, {"id": "C59", "obj": "Obj 1.7", "q": "A user is working with a .dmg file on their macOS desktop. Which of the following would describe the contents of this file?", "opts": ["Debug information", "Disk image", "Application library", "Disk maintenance utility"], "ans": [1], "why": "A <strong>.dmg</strong> file is a macOS disk image file used to distribute applications and other software in a mountable format.", "isAcronym": false}, {"id": "C50", "obj": "Obj 4.7", "q": "While working at a customer's desk, a technician's mobile phone begins to ring. Which of the following would be the most appropriate response?", "opts": ["Take the call and address the caller's requests before continuing", "Take the call and ask the caller if you can return their call later", "Send the call to voicemail and apologize for the interruption", "Politely excuse yourself and step out to take the call"], "ans": [2], "why": "<strong>Sending the call to voicemail and apologizing</strong> keeps focus on the customer without being rude or creating a prolonged interruption.", "isAcronym": false}, {"id": "A87", "obj": "Obj 2.10", "q": "A network administrator is configuring a wireless network at a small office. The administrator would like to allow wireless access for all computers but exclude a single kiosk in the lobby. Which of the following configuration settings would meet this requirement?", "opts": ["SSID suppression", "Content filtering", "Secure management access", "DHCP reservation", "IP filtering"], "ans": [4], "why": "<strong>IP filtering</strong> allows the administrator to block a specific IP address (assigned to the kiosk) from accessing the wireless network.", "isAcronym": false}, {"id": "B83", "obj": "Obj 4.6", "q": "A user would like to install an image and photo editing program on their home computer, but they would prefer an application without a monthly subscription. Which of the following would be the best licensing option for this requirement?", "opts": ["Open-source", "Corporate", "Personal", "DRM"], "ans": [0], "why": "<strong>Open-source software</strong> is freely available without subscription fees, making it ideal for users who want a no-cost perpetual option.", "isAcronym": false}, {"id": "A53", "obj": "Obj 1.9", "q": "A Windows user is installing a new application, and the installation process also installs a service. Which of the following permissions will be required for this installation?", "opts": ["Guest", "Power User", "Administrator", "Standard user"], "ans": [2], "why": "Installing a service requires <strong>Administrator</strong>-level permissions as services run at the OS level and modify system configuration.", "isAcronym": false}, {"id": "C15", "obj": "Obj 2.2", "q": "A system administrator is concerned about the security of devices in the field and would like to encrypt all data on company laptops. Which of these Windows features would provide this functionality?", "opts": ["EFS", "Domain Services", "WPA3", "BitLocker"], "ans": [3], "why": "<strong>BitLocker</strong> provides full drive encryption on Windows laptops, protecting all stored data if the device is lost or stolen. EFS only encrypts individual files.", "isAcronym": false}, {"id": "B72", "obj": "Obj 4.8", "q": "Which of the following script extensions would commonly be used inside of a Microsoft Office application?", "opts": ["  .vbs", ".py", ".bat", ".js"], "ans": [0], "why": "<strong>VBScript (.vbs)</strong> is the native scripting language used for macros and automation within Microsoft Office applications.", "isAcronym": false}, {"id": "ACR38", "obj": "Acronyms", "q": "What does <strong>XFS</strong> stand for?", "opts": ["Resilient File System – Microsoft server-grade file system with fault tolerance", "Temporal Key Integrity Protocol – older WPA encryption algorithm", "Universal Serial Bus – standard connection interface for peripherals and boot media", "Extended File System – high-performance Linux/Unix file system"], "ans": [3], "why": "<strong>XFS</strong> stands for <em>Extended File System – high-performance Linux/Unix file system</em>. The other options describe TKIP, ReFS, and USB respectively.", "isAcronym": true}, {"id": "ACR47", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Network Time Protocol – synchronizes clocks across network devices</em>?", "opts": ["NTP", "SSO", "SODIMM", "GPU"], "ans": [0], "why": "<strong>NTP</strong> stands for Network Time Protocol – synchronizes clocks across network devices. SSO = Single Sign-On – authenticate once to access multiple systems. SODIMM = Small Outline DIMM – laptop RAM form factor. GPU = Graphics Processing Unit – dedicated graphics processor.", "isAcronym": true}, {"id": "A23", "obj": "Obj 3.1", "q": "When connecting a new USB webcam to Windows 11, a message appears stating \"The controller does not have enough resources for this device.\" Which of the following would be the best next troubleshooting step?", "opts": ["Close all large-memory processes", "Modify the BCD", "Move the webcam to a different USB interface", "Use System Restore to rollback to a previous configuration"], "ans": [2], "why": "USB controllers have a limited number of endpoints; <strong>moving the device to a different USB port or controller</strong> resolves resource exhaustion errors.", "isAcronym": false}, {"id": "A66", "obj": "Obj 1.6", "q": "A system administrator would like to require a specific level of password complexity for all Active Directory users. Which of the following would be the best way to complete this requirement?", "opts": ["Login script", "Folder redirection", "Port security", "Group Policy"], "ans": [3], "why": "<strong>Group Policy</strong> allows administrators to enforce password complexity requirements across all Active Directory users from a central location.", "isAcronym": false}, {"id": "ACR41", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Data Loss Prevention – tools/policies to prevent unauthorized data exfiltration</em>?", "opts": ["CPU", "VPN", "DLP", "TKIP"], "ans": [2], "why": "<strong>DLP</strong> stands for Data Loss Prevention – tools/policies to prevent unauthorized data exfiltration. TKIP = Temporal Key Integrity Protocol – older WPA encryption algorithm. VPN = Virtual Private Network – encrypted tunnel for secure remote access. CPU = Central Processing Unit – the processor.", "isAcronym": true}, {"id": "B77", "obj": "Obj 3.1", "q": "Last week, a computer on the manufacturing floor was upgraded from 8 GB of RAM to 16 GB. Since the upgrade, the system has rebooted itself randomly every few hours. Which of the following would be the best next troubleshooting step?", "opts": ["Run Windows Update", "Perform a hardware diagnostic", "Upgrade the BIOS to the latest version", "Replace the storage drive"], "ans": [1], "why": "Random reboots following a RAM upgrade indicate the new memory may be faulty or incompatible; a <strong>hardware diagnostic</strong> confirms this.", "isAcronym": false}, {"id": "C74", "obj": "Obj 2.7", "q": "A system administrator is installing a file server into the corporate data center. Which of the following would be the best way to improve security of the file sharing service? (Select TWO)", "opts": ["Enable a BIOS user password", "Connect the server to a wireless network", "Limit the number of concurrent connections", "Disable guest account", "Enable file storage quotas", "Enable password complexity"], "ans": [3, 5], "why": "<strong>Disabling the guest account</strong> prevents anonymous access, and <strong>enabling password complexity</strong> strengthens authentication against brute-force attacks.", "isAcronym": false}, {"id": "A77", "obj": "Obj 1.3", "q": "A financial corporation is deploying laptops to their salespeople in the field. The sales teams require video playback functionality, but the Windows configuration does not include any multimedia utilities. Which of the following would be the most likely reason for these missing utilities?", "opts": ["Laptops are using Windows N edition", "Video playback is disabled in the BIOS", "Laptop hardware does not support video playback", "The video format is not recognized by the laptop"], "ans": [0], "why": "<strong>Windows N editions</strong> are sold in Europe and do not include Windows Media Player or other multimedia components by default. BIOS settings don't control multimedia software availability.", "isAcronym": false}, {"id": "B56", "obj": "Obj 2.11", "q": "A user receives a browser security alert on his laptop when visiting any website which uses HTTPS. If he uses his smartphone, he does not receive any error messages. Which of the following would best describe this situation?", "opts": ["The date and time on the laptop is incorrect", "The smartphone is not updated with the latest OS version", "The laptop has an incorrect subnet mask", "The laptop does not have the latest anti-virus signatures"], "ans": [0], "why": "SSL/TLS certificate validation checks the <strong>system date and time</strong>; an incorrect date causes all HTTPS certificates to appear invalid.", "isAcronym": false}, {"id": "A25", "obj": "Obj 1.2", "q": "A system administrator is installing a Windows Server device in the data center. Which of the following file systems would be the best choice for this task?", "opts": ["ReFS", "APFS", "ext4", "XFS"], "ans": [0], "why": "<strong>ReFS</strong> (Resilient File System) is Microsoft's modern file system designed for server environments with enhanced data integrity and fault tolerance. APFS is Apple's file system. ext4 and XFS are Linux file systems.", "isAcronym": false}, {"id": "C62", "obj": "Obj 2.11", "q": "A user receives this message each time they visit a secure website: \"The site's security certificate is not trusted.\" A technician investigates the issue and finds the problem only occurs on this user's computer and not with other computers in the same office. Which of the following would be the best next troubleshooting task?", "opts": ["Disable Windows Firewall for all HTTPS traffic", "Create a new certificate for the user's computer", "Check the date and time on the user's computer", "Release and refresh the IP address configuration"], "ans": [2], "why": "Certificate trust errors occurring only on one computer typically indicate an incorrect <strong>system date or time</strong> causing certificate validation to fail.", "isAcronym": false}, {"id": "C20", "obj": "Obj 1.5", "q": "A server administrator needs to create a folder on a Windows server to store weekly status report documents. Which of the following command-line tools would provide this functionality?", "opts": ["md", "net use", "cd", "dir", "ls"], "ans": [0], "why": "The <strong>md</strong> (make directory) command creates a new folder at the specified path from the command line. net use maps network shares. cd changes directory. dir lists directory contents. ls is a Linux/macOS command not available in Windows Command Prompt.", "isAcronym": false}, {"id": "B40", "obj": "Obj 2.6", "q": "A desktop administrator has just removed malware from a user's desktop computer and has configured the system to automatically update anti-virus signatures and perform a scan each night. Which of the following should be the next step in the removal process?", "opts": ["Enable System Restore", "Educate the end-user", "Quarantine the computer", "Boot to Safe Mode"], "ans": [1], "why": "After completing technical remediation steps, the malware removal process concludes with <strong>educating the user</strong> to prevent future infections.", "isAcronym": false}, {"id": "A43", "obj": "Obj 2.10", "q": "A security administrator is concerned a bad actor may use packet analysis to determine a list of web sites visited by their users. Which of the following would prevent this type of reconnaissance?", "opts": ["Enable full disk encryption", "Login with multifactor authentication", "Use a secure DNS", "Configure the BIOS for Secure Boot"], "ans": [2], "why": "<strong>Secure DNS</strong> (DNS over HTTPS or DNS over TLS) encrypts DNS queries, preventing packet analysis from revealing visited websites.", "isAcronym": false}, {"id": "C39", "obj": "Obj 3.2", "q": "A user in the shipping department is using a tracking app on a tablet. The app normally takes 10 seconds to load, but now takes over a minute before it can be used. Tracking searches which normally take seconds are taking almost a minute to show the tracking details. Other tablets are not experiencing this slowdown. Which of the following would be the best next troubleshooting step?", "opts": ["Reinstall the tracking app", "Check the app battery usage", "Roll back to the previous tablet OS version", "Perform a reboot"], "ans": [3], "why": "A <strong>reboot</strong> clears memory leaks and stale processes that cause gradual performance degradation on a single device.", "isAcronym": false}, {"id": "B6", "obj": "Obj 2.9", "q": "A technician is delivering a new laptop to a user and moving the older laptop to a different user. Which of the following would allow the existing hard drive to be used but prevent recovery of any of the previous user's data?", "opts": ["Perform a regular format", "Run a defragmentation", "Connect the laptop to the Windows Domain", "Delete the \\Users folder"], "ans": [0], "why": "A <strong>regular format</strong> overwrites the drive's file system making previous user data unrecoverable while keeping the drive usable.", "isAcronym": false}, {"id": "B39", "obj": "Obj 2.5", "q": "A user in the shipping department has received a call from someone claiming to be from the IT Help Desk. The caller asks the user to disclose their location, employee ID, and login credentials. Which of the following would describe this situation?", "opts": ["Denial of service", "Social engineering", "Brute force", "Shoulder surfing"], "ans": [1], "why": "Impersonating IT staff to trick users into revealing credentials is a classic <strong>social engineering</strong> attack.", "isAcronym": false}, {"id": "A49", "obj": "Obj 4.1", "q": "A technician has been called to resolve an issue with a networked laser printer not printing. When the technician arrives on-site, they find the printer will require a hardware replacement. All hardware is managed by a third-party and will take a week before the printer is operational again. Which of the following would be the technician's best next step?", "opts": ["Work on the next ticket in the queue", "Add a follow-up event for one week later", "Inform the user of the repair status", "Order a printer maintenance kit"], "ans": [2], "why": "<strong>Communicating repair status and timeline</strong> to the user is the most important immediate next step to set expectations and maintain service quality.", "isAcronym": false}, {"id": "ACR26", "obj": "Acronyms", "q": "What does <strong>RAM</strong> stand for?", "opts": ["Universal Serial Bus – standard connection interface for peripherals and boot media", "Random-Access Memory – volatile system memory", "Graphical User Interface – visual OS interface", "External SATA – external version of SATA interface for storage"], "ans": [1], "why": "<strong>RAM</strong> stands for <em>Random-Access Memory – volatile system memory</em>. The other options describe USB, eSATA, and GUI respectively.", "isAcronym": true}, {"id": "B90", "obj": "Obj 2.7", "q": "Which of these would be the best way to prevent an attacker from modifying default routes on a SOHO wireless network?", "opts": ["Configure MAC address filtering", "Enable WPS connectivity", "Change the router's default password", "Disable unneeded interfaces"], "ans": [2], "why": "Default router passwords are publicly known; <strong>changing the default password</strong> prevents attackers from using default credentials to modify network settings.", "isAcronym": false}, {"id": "A57", "obj": "Obj 4.7", "q": "A technician was assigned a support ticket with an urgently requested a laptop screen repair. The support team was able to locate a replacement and install a new LCD display in less than 24 hours. The laptop was returned to the user and the user immediately left on a business trip. Which of the following would be the best next step for this repair?", "opts": ["Order a backup replacement display", "Update the user's login script", "Run diagnostics on the original screen", "Contact the user to verify satisfaction"], "ans": [3], "why": "<strong>Following up with the customer</strong> to confirm satisfaction is a required step in professional support to ensure the repair resolved the issue.", "isAcronym": false}, {"id": "A74", "obj": "Obj 1.5", "q": "An organization has been tasked with increasing the minimum password length. A systems administrator has created a policy to require all passwords to be at least ten characters long for all users. When testing this policy in the lab, a laptop computer allowed the creation of eight-character passwords. Which of the following commands should be used to apply this new policy on the laptop?", "opts": ["net use", "gpupdate", "sfc", "tasklist"], "ans": [1], "why": "The <strong>gpupdate</strong> command forces an immediate refresh of Group Policy settings on a local computer. net use maps network drives. sfc checks system file integrity. tasklist shows running processes.", "isAcronym": false}, {"id": "C42", "obj": "Obj 1.6", "q": "A Windows administrator needs to define a minimum password length for all network users. Which of the following should be used to complete this task?", "opts": ["Device Manager", "Certificate Manager", "Group Policy Editor", "Performance Monitor"], "ans": [2], "why": "<strong>Group Policy Editor</strong> (gpedit.msc) is used to configure and enforce security policies including minimum password length for all domain users.", "isAcronym": false}, {"id": "C44", "obj": "Obj 3.1", "q": "A user is receiving this message on their Windows desktop: \"The controller does not have enough resources for this device.\" Which of the following would be the most likely reason for this issue?", "opts": ["Remote printer has been disabled", "Wireless network bandwidth exceeded", "USB endpoints are exceeded", "The system clock is incorrect"], "ans": [2], "why": "The USB controller resource warning occurs when the number of connected USB device <strong>endpoints exceeds the controller's capacity</strong>.", "isAcronym": false}, {"id": "B87", "obj": "Obj 1.5", "q": "A technician is working on many different terminal sessions on their screen from different servers. The technician has also used different authentication credentials on each server. Which of the following would be the best way to display the login name associated with each terminal session?", "opts": ["winver", "nslookup", "whoami", "net use"], "ans": [2], "why": "The <strong>whoami</strong> command displays the username of the currently authenticated user in the active terminal session. winver shows the Windows version. nslookup queries DNS. net use maps network drives.", "isAcronym": false}, {"id": "A72", "obj": "Obj 2.3", "q": "A financial management company would like to ensure mobile users are configured with the highest level of wireless encryption while working in the office. They would also like to include an additional user verification step during the login process. Which of the following would provide this functionality? (Choose TWO)", "opts": ["RADIUS", "UPnP", "Multi-factor authentication", "TKIP", "TACACS", "Kerberos", "WPA3"], "ans": [2, 6], "why": "<strong>WPA3</strong> provides the highest wireless encryption standard, and <strong>MFA</strong> adds a required second verification step. RADIUS is an authentication server protocol. TKIP is an older, weaker WPA encryption algorithm.", "isAcronym": false}, {"id": "C60", "obj": "Obj 1.5", "q": "A laptop in the accounting department has been infected with malware, and the technician has just completed the removal process. Which of the following would be the best way to verify the integrity of the core operating system files?", "opts": ["Perform a clean Windows install", "Run the system file check utility", "Rebuild the Windows profile", "Roll back the last Windows update"], "ans": [1], "why": "<strong>SFC</strong> (System File Checker) verifies and repairs the integrity of protected Windows system files after a malware removal. A clean install is excessive and destroys data. Rebuilding the profile doesn't address OS file integrity.", "isAcronym": false}, {"id": "B62", "obj": "Obj 2.1", "q": "A company is deploying a new set of laptops for field service technicians who travel and work at customer locations. The IT department has been asked to create a secure authentication factor for a minimal cost. Which of the following would be the best choice for this security requirement?", "opts": ["Retina scanner", "TOTP app", "Keyfob", "Magnetometer"], "ans": [1], "why": "A <strong>TOTP authenticator app</strong> provides strong MFA at no additional hardware cost, requiring only the technician's smartphone. Retina scanners require specialized hardware. Key fobs are hardware tokens with ongoing replacement costs.", "isAcronym": false}, {"id": "B32", "obj": "Obj 4.5", "q": "A user's video editing workstation often performs an overnight rendering process. On some mornings, the user is presented with a login screen instead of the rendering completion page. A technician finds the building occasionally loses power overnight. Which of the following should be used to avoid these issues with the video editing workstation?", "opts": ["Use a surge suppressor", "Save the rendered file to an external storage drive", "Create a separate partition for user documents", "Install a UPS"], "ans": [3], "why": "A <strong>UPS</strong> provides battery power during outages, allowing the overnight rendering process to complete without interruption.", "isAcronym": false}, {"id": "ACR14", "obj": "Acronyms", "q": "What does <strong>HDD</strong> stand for?", "opts": ["Hard Disk Drive – traditional spinning magnetic storage", "Privileged Access Management – security controls for admin-level accounts", "Central Processing Unit – the processor", "Virtual Machine – software emulation of a computer system"], "ans": [0], "why": "<strong>HDD</strong> stands for <em>Hard Disk Drive – traditional spinning magnetic storage</em>. The other options describe VM, PAM, and CPU respectively.", "isAcronym": true}, {"id": "C25", "obj": "Obj 4.4", "q": "A technician has been asked to replace a faulty adapter card in a server. The technician doesn't have an anti-static strap, but they have removed the server from the power source. Which of the following would be the best way to safely complete this repair?", "opts": ["Store the faulty card in an anti-static bag", "Periodically touch the server's metal chassis", "Wear safety goggles", "Have a carbon dioxide extinguisher nearby"], "ans": [1], "why": "<strong>Periodically touching the server's metal chassis</strong> equalizes the static charge between the technician and the system, reducing ESD risk when no strap is available.", "isAcronym": false}, {"id": "A82", "obj": "Obj 2.1", "q": "An employee at a company is responsible for determining the correct access controls for each user, manage the authentication process, and track all access to network resources. Which of the following would best describe this employee's job function?", "opts": ["PAM", "DLP", "MDM", "IAM"], "ans": [3], "why": "<strong>IAM</strong> (Identity Access Management) covers managing user identities, authentication, access controls, and auditing of resource access. PAM focuses specifically on admin accounts. DLP prevents data leakage. MDM manages mobile devices.", "isAcronym": false}, {"id": "C27", "obj": "Obj 2.4", "q": "A user has started their computer and received this message on the screen: \"Your important files are encrypted. If you want to decrypt all of your files, you need to pay.\" A desktop administrator has confirmed the user can no longer access his desktop, and none of his installed applications are available in the system menus. The user also notices a payment link is posted at the bottom of the screen. Which of the following would best describe this scenario?", "opts": ["Spyware", "Boot sector virus", "Rootkit", "Ransomware"], "ans": [3], "why": "<strong>Ransomware</strong> encrypts victim files and demands payment for the decryption key, locking users out of their system.", "isAcronym": false}, {"id": "A54", "obj": "Obj 1.6", "q": "A user working from home is not able to print to a laser printer at the corporate office. Which of the following would be the most likely reason for this issue?", "opts": ["WPA3 settings", "Outdated anti-virus signatures", "Disconnected VPN", "MDM configuration"], "ans": [2], "why": "Corporate printers are on the internal network; without a <strong>VPN connection</strong>, a remote user cannot reach internal network resources.", "isAcronym": false}, {"id": "ACR19", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>New Technology File System – standard Windows file system with permissions and encryption</em>?", "opts": ["NTFS", "MBR", "PII", "GPU"], "ans": [0], "why": "<strong>NTFS</strong> stands for New Technology File System – standard Windows file system with permissions and encryption. MBR = Master Boot Record – legacy partition style, max 4 partitions, max 2TB. PII = Personally Identifiable Information – data that can identify an individual. GPU = Graphics Processing Unit – dedicated graphics processor.", "isAcronym": true}, {"id": "A33", "obj": "Obj 4.7", "q": "A user has delivered a broken laptop to the help desk, and they are visibly upset and quite vocal about the problem they're having. The user is also asking for a very specific repair which doesn't appear to have any relationship to his issue. What's the best way to handle this situation?", "opts": ["Repeat your understanding of the issue to the customer and provide an estimate and follow-up time", "Refuse the repair until the customer calms down", "Inform the customer of his mistake with the proposed repair", "Refuse to make any commitments until the computer is examined"], "ans": [0], "why": "<strong>Restating the issue and providing a timeline</strong> de-escalates the situation, sets clear expectations, and demonstrates active listening.", "isAcronym": false}, {"id": "C9", "obj": "Obj 3.2", "q": "A user has recently been assigned a new tablet, but each time she tries to read her email the tablet reboots. The user has reinstalled the email client, but the problem continues to occur. Which of the following would be the best next troubleshooting step?", "opts": ["Replace the battery", "Perform a factory reset", "Run a hardware diagnostic", "Disable Wi-Fi"], "ans": [2], "why": "When a reinstalled app still causes reboots, a <strong>hardware diagnostic</strong> determines if a hardware fault is triggering the crash.", "isAcronym": false}, {"id": "A30", "obj": "Obj 2.5", "q": "A security guard has reported a person passing through a secure door without using a door badge. The intruder slipped through the door by closely following the person in front of them. Which of these would best describe these actions?", "opts": ["Dumpster diving", "Brute force", "Phishing", "Tailgating"], "ans": [3], "why": "<strong>Tailgating</strong> is a physical security attack where an unauthorized person follows an authorized person through a secured entry without using their own credentials.", "isAcronym": false}, {"id": "ACR21", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Original Equipment Manufacturer – hardware/software pre-installed by manufacturer</em>?", "opts": ["OEM", "RAM", "exFAT", "VPN"], "ans": [0], "why": "<strong>OEM</strong> stands for Original Equipment Manufacturer – hardware/software pre-installed by manufacturer. VPN = Virtual Private Network – encrypted tunnel for secure remote access. exFAT = Extended File Allocation Table – cross-platform file system for flash drives. RAM = Random-Access Memory – volatile system memory.", "isAcronym": true}, {"id": "C47", "obj": "Obj 2.3", "q": "A network administrator has modified all wireless access points to use WPA3 instead of WPA2. Which of the following would be a reason for this change?", "opts": ["Additional frequency choices", "Lower power consumption", "Larger usable range", "Stronger encryption"], "ans": [3], "why": "<strong>WPA3</strong> uses stronger encryption algorithms and improved key exchange protocols compared to WPA2. Frequency, power consumption, and range are physical hardware characteristics.", "isAcronym": false}, {"id": "C70", "obj": "Obj 3.2", "q": "A user would like to use their smartphone for a payment during checkout at the grocery store, but the smartphone is not seen by the payment system. Which of the following would be the BEST next troubleshooting step?", "opts": ["Restart the smartphone", "Replace the battery", "Perform a factory reset", "Enable Wi-Fi"], "ans": [0], "why": "NFC payment failures are often caused by a frozen NFC stack; <strong>restarting the smartphone</strong> resets the NFC subsystem.", "isAcronym": false}, {"id": "C36", "obj": "Obj 2.6", "q": "A desktop administrator has been tasked with removing malware from an executive's laptop computer. The system has been removed from the network, but the Windows startup process now shows a Stop Error and reboots into a repeating cycle. Which of the following would be the best next step in the malware removal process?", "opts": ["Perform a Windows Repair installation", "Boot with a pre-installation environment", "Schedule periodic scans", "Create a restore point"], "ans": [1], "why": "When malware prevents normal Windows startup, <strong>booting with a preinstallation environment</strong> allows access for scanning and removal outside of the infected OS.", "isAcronym": false}, {"id": "C32", "obj": "Obj 1.3", "q": "The upgrade process for Windows requires the installation of TPM hardware. Which of the following would best describe the reason for this system requirement?", "opts": ["Wired networking", "64-bit compatibility", "USB support", "Cryptographic features"], "ans": [3], "why": "<strong>TPM</strong> (Trusted Platform Module) is a dedicated security chip that provides hardware-based cryptographic functions required by Windows 11. It has no role in networking, USB support, or 64-bit compatibility.", "isAcronym": false}, {"id": "B70", "obj": "Obj 4.3", "q": "An IT manager would like to provide users with the option to recover daily versions of documents and spreadsheets. A user will have the option to roll back to any daily version in the last month. Which of the following would be the best way to implement this feature?", "opts": ["Create a file-level backup each day", "Maintain a monthly image level backup", "Store full backup tapes at an off-site facility", "Assign each user a USB flash drive"], "ans": [0], "why": "<strong>Daily file-level backups</strong> capture individual file versions each day, allowing users to restore any version from the past month.", "isAcronym": false}, {"id": "A6", "obj": "Obj 4.4", "q": "A system administrator is installing a new server into the metal racks in a data center. During the installation process, the administrator can feel a faint tingling sensation when mounting the server. Which of the following safety systems should be tested and verified first?", "opts": ["Equipment grounding", "Air filtration", "Cable management", "Waste disposal regulations"], "ans": [0], "why": "A tingling sensation when touching equipment indicates a potential grounding fault; <strong>equipment grounding</strong> must be verified immediately to prevent electrocution.", "isAcronym": false}, {"id": "C88", "obj": "Obj 4.4", "q": "A company is moving three computer racks of equipment from an old data center to a new facility. Which of these safety features should be the most important requirement at the new location?", "opts": ["Air filter masks", "Anti-static mat", "Equipment grounding", "Surge protectors"], "ans": [2], "why": "Proper <strong>equipment grounding</strong> at a new facility is the most critical safety requirement to protect both personnel and equipment from electrical faults.", "isAcronym": false}, {"id": "ACR51", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>Secure Shell – encrypted protocol for remote command-line access</em>?", "opts": ["VNC", "BIOS", "GPU", "SSH"], "ans": [3], "why": "<strong>SSH</strong> stands for Secure Shell – encrypted protocol for remote command-line access. VNC = Virtual Network Computing – cross-platform graphical remote desktop protocol. GPU = Graphics Processing Unit – dedicated graphics processor. BIOS = Basic Input/Output System – firmware interface pre-UEFI.", "isAcronym": true}, {"id": "A22", "obj": "Obj 4.2", "q": "A system administrator is upgrading an email service in the corporate data center. During the upgrade, an error message appears and the upgrade fails. Subsequent attempts to perform the upgrade also fail. Which of the following processes should the system administrator follow to return the email server to its previous state?", "opts": ["Rollback plan", "Disaster recovery plan", "Incident response plan", "Power plan"], "ans": [0], "why": "A <strong>rollback plan</strong> defines the steps to revert a failed change back to the last known working state.", "isAcronym": false}, {"id": "A75", "obj": "Obj 2.6", "q": "A technician has been tasked with removing malware on a training room laptop. After updating the anti-virus software and removing the malware, the technician creates a backup of the system. After the training class ends, the technician is notified the malware has returned. Which of the following steps was missed and caused the system to be infected again?", "opts": ["Boot to a pre-installation environment", "Identify malware symptoms", "Disable System Restore before removal", "Update to the latest BIOS version"], "ans": [2], "why": "If <strong>System Restore is not disabled</strong> before removal, Windows can restore the malware from an infected restore point causing re-infection.", "isAcronym": false}, {"id": "ACR34", "obj": "Acronyms", "q": "What does <strong>USB</strong> stand for?", "opts": ["Central Processing Unit – the processor", "Video Random-Access Memory – dedicated memory for GPU/graphics processing", "Universal Serial Bus – standard connection interface for peripherals and boot media", "Advanced Encryption Standard – symmetric block cipher used in WPA2/WPA3"], "ans": [2], "why": "<strong>USB</strong> stands for <em>Universal Serial Bus – standard connection interface for peripherals and boot media</em>. The other options describe AES, VRAM, and CPU respectively.", "isAcronym": true}, {"id": "A39", "obj": "Obj 2.9", "q": "A technician is dismantling a test lab for a recently completed project, and the lab manager would like to use the existing computers on a new project. However, the security administrator would like to ensure none of the data from the previous project is accessible on the existing hard drives. Which of the following would be the best way to accomplish this?", "opts": ["Quick format", "Degauss", "Regular format", "Reinstall the operating system"], "ans": [2], "why": "A <strong>regular format</strong> overwrites the file system and makes previous data inaccessible while keeping the drive functional for reuse. A quick format only clears the file table.", "isAcronym": false}, {"id": "ACR42", "obj": "Acronyms", "q": "What does <strong>EFS</strong> stand for?", "opts": ["Serial Advanced Technology Attachment – storage drive interface", "Video Graphics Array – older analog video output standard", "Encrypting File System – Windows feature for file-level encryption", "Random-Access Memory – volatile system memory"], "ans": [2], "why": "<strong>EFS</strong> stands for <em>Encrypting File System – Windows feature for file-level encryption</em>. The other options describe VGA, SATA, and RAM respectively.", "isAcronym": true}, {"id": "B19", "obj": "Obj 1.3", "q": "Which of the following features would be found in Windows 11 Pro but not in Windows 11 Home?", "opts": ["32-bit and 64-bit versions", "Domain access", "RDP client", "Windows Workgroup"], "ans": [1], "why": "<strong>Windows 11 Pro</strong> supports joining an Active Directory domain; Windows 11 Home does not include this capability. Both editions include an RDP client and workgroup support. 32-bit versions of Windows 11 are not available in any edition.", "isAcronym": false}, {"id": "C71", "obj": "Obj 2.4", "q": "A technician is troubleshooting a problem with user's laptop and very high utilization, even with no activity on the screen or user input to the operating system. Task Manager shows the CPU is operating at 100% utilization, memory utilization is slightly elevated, and there is a large amount of outbound network communication. Which of the following would be the most likely reason for these issues?", "opts": ["System RAM is faulty", "User has not properly authenticated", "Laptop is part of a DDoS attack", "Network adapter is faulty"], "ans": [2], "why": "High CPU with no user activity and heavy outbound traffic indicates the system is part of a <strong>botnet conducting a DDoS attack</strong>.", "isAcronym": false}, {"id": "ACR46", "obj": "Acronyms", "q": "What does <strong>NAC</strong> stand for?", "opts": ["Graphics Processing Unit – dedicated graphics processor", "GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB", "Central Processing Unit – the processor", "Network Access Control – enforcing security policy before network access is granted"], "ans": [3], "why": "<strong>NAC</strong> stands for <em>Network Access Control – enforcing security policy before network access is granted</em>. The other options describe CPU, GPT, and GPU respectively.", "isAcronym": true}, {"id": "A88", "obj": "Obj 3.4", "q": "A company maintains a Windows system in the conference room for use during meetings. However, the system has not received any recent updates and will no longer connect to the corporate network due to missing security patches. Which of the following would be the most likely reason for this issue?", "opts": ["BIOS administrator password is enabled", "No users are actively logged in", "Firewall is filtering traffic", "Guest accounts are disabled"], "ans": [2], "why": "Network Access Control (NAC) enforced by a <strong>firewall</strong> commonly blocks non-compliant systems that are missing required security patches.", "isAcronym": false}, {"id": "ACR16", "obj": "Acronyms", "q": "What does <strong>MBR</strong> stand for?", "opts": ["Boot Configuration Data – Windows boot loader data store", "Master Boot Record – legacy partition style, max 4 partitions, max 2TB", "Time-based One-Time Password – rotating codes used in authenticator apps", "Solid-State Drive – flash-based non-volatile storage"], "ans": [1], "why": "<strong>MBR</strong> stands for <em>Master Boot Record – legacy partition style, max 4 partitions, max 2TB</em>. The other options describe TOTP, BCD, and SSD respectively.", "isAcronym": true}, {"id": "C80", "obj": "Obj 4.7", "q": "A technician has received a help desk ticket asking for help with a broken laptop keyboard. After calling the user, the technician learns the laptop is scheduled to be used for a press event the following day. Which of the following would be the best next step with the ticket?", "opts": ["Refer the ticket to the laptop group", "Escalate the issue with management", "Add the event information to the problem description", "Assign the ticket to the \"laptop\" category"], "ans": [1], "why": "A time-sensitive ticket involving a high-profile event the following day requires <strong>management escalation</strong> to ensure priority handling.", "isAcronym": false}, {"id": "A8", "obj": "Obj 2.8", "q": "A user in the accounting department is trying to install an app on their new corporate mobile phone, but the installation fails each time. Which of the following would be the most likely reason for this issue?", "opts": ["Incorrect file system type", "MDM policy restriction", "Slow CPU speeds", "Low battery level"], "ans": [1], "why": "<strong>MDM</strong> (Mobile Device Management) policies on corporate devices commonly restrict unauthorized app installations.", "isAcronym": false}, {"id": "A14", "obj": "Obj 4.6", "q": "A company maintains data retention requirements of five years for all customer names, addresses, and phone numbers. Which of the following would best describe this data?", "opts": ["Credit card transactions", "Government-issued information", "PII", "Healthcare data"], "ans": [2], "why": "Customer names, addresses, and phone numbers are <strong>PII</strong> (Personally Identifiable Information), which is subject to data retention and privacy regulations.", "isAcronym": false}, {"id": "B12", "obj": "Obj 4.7", "q": "A technician is scheduled to replace a faulty motherboard today, but the motherboard delivery has been delayed and will not arrive until tomorrow. The new motherboard will repair a laptop used by a company executive. Which of the following would be the best way to handle these events?", "opts": ["Move the installation to the next business day", "Schedule another repair into today's newly opened time slot", "Ask the delivery company for a refund on the shipping charges", "Contact the end user and inform them of the shipping issue"], "ans": [3], "why": "<strong>Proactively communicating delays</strong> to the customer, especially an executive, maintains trust and allows them to make alternative arrangements.", "isAcronym": false}, {"id": "ACR15", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>International Organization for Standardization – also refers to disc image file format</em>?", "opts": ["NTFS", "USB", "ISO", "EFS"], "ans": [2], "why": "<strong>ISO</strong> stands for International Organization for Standardization – also refers to disc image file format. NTFS = New Technology File System – standard Windows file system with permissions and encryption. EFS = Encrypting File System – Windows feature for file-level encryption. USB = Universal Serial Bus – standard connection interface for peripherals and boot media.", "isAcronym": true}, {"id": "C54", "obj": "Obj 4.6", "q": "A technician has been asked to work on an urgent computer repair while the user is at lunch. When the technician arrives, they notice paperwork on the desk which may contain private customer information. Which of the following would be the best next step?", "opts": ["Complete the repair as quickly as possible", "Ask an associate in the department for assistance", "Move the papers somewhere out of sight", "Leave without repairing the computer"], "ans": [1], "why": "When encountering potentially sensitive materials, the appropriate action is to involve a <strong>departmental associate</strong> to maintain proper oversight and confidentiality.", "isAcronym": false}, {"id": "A26", "obj": "Obj 2.4", "q": "A security technician has identified malware running in the OS kernel. Traditional anti-malware scans were not able to identify any problems on the computer. Which of the following would be the best description of this malware?", "opts": ["Rootkit", "Worm", "Botnet", "Cryptominer"], "ans": [0], "why": "A <strong>rootkit</strong> embeds itself in the OS kernel to hide from standard security scans while maintaining persistent unauthorized access.", "isAcronym": false}, {"id": "B89", "obj": "Obj 1.4", "q": "A desktop administrator is troubleshooting an error which randomly causes a workstation to spike to 100% utilization. Which of these utilities would help the administrator track and report on system utilization over a 24-hour period?", "opts": ["Performance Monitor", "Device Manager", "Services", "Task Scheduler"], "ans": [0], "why": "<strong>Performance Monitor</strong> can log and graph system resource utilization over extended time periods, enabling analysis of intermittent spikes. Task Manager shows real-time data but doesn't log over time.", "isAcronym": false}, {"id": "B51", "obj": "Obj 3.1", "q": "An executive has a laptop which runs very slowly after login and continues running slowly throughout the day. The user has complained certain applications cannot be started and others will randomly crash. A check of the laptop shows the memory utilization is very close to 100%. Which of the following would provide a short-term fix for this issue?", "opts": ["Disable startup items", "Update to the latest OS patches", "Defragment the hard drive", "Reboot the computer"], "ans": [0], "why": "<strong>Disabling startup items</strong> frees up RAM consumed at boot, providing a short-term fix for high memory utilization.", "isAcronym": false}, {"id": "A44", "obj": "Obj 3.2", "q": "A user in the sales department is attempting to upgrade the operating system of their smartphone, but the smartphone will not start the installation when selected. Which of the following is the most likely reason for this issue?", "opts": ["Bluetooth is enabled", "The smartphone storage is nearly full", "Rotation lock is disabled", "The phone is connected to a power source"], "ans": [1], "why": "OS updates require significant free storage space to download and install; <strong>insufficient storage</strong> prevents the update from starting.", "isAcronym": false}, {"id": "C23", "obj": "Obj 3.1", "q": "A Windows computer has one application which crashes randomly throughout the day. Other applications work normally, and the operating system itself runs without any errors. Which of the following would be the best way to address these application crashes?", "opts": ["Perform a full backup", "Reload the Active Directory profile", "Defragment the hard drive", "Uninstall and reinstall the application"], "ans": [3], "why": "When only one application crashes while everything else runs normally, the <strong>application installation is likely corrupted</strong> and needs reinstalling.", "isAcronym": false}, {"id": "C30", "obj": "Obj 4.4", "q": "A server technician is removing the memory from a web server and adding new memory modules to the motherboard. The old memory modules will be used to upgrade a server in a different data center. Which of the following would be the best way to protect the old memory modules?", "opts": ["Padded envelope", "Cotton fabric", "Molded foam packing material", "Anti-static bag"], "ans": [3], "why": "<strong>Anti-static bags</strong> protect memory modules from electrostatic discharge during transport to another data center.", "isAcronym": false}, {"id": "C12", "obj": "Obj 4.7", "q": "A user has brought their laptop to the help desk because of an issue during startup. The laptop screen remains black when powering on, and no status lights appear on the system. The user is traveling tomorrow to a remote site in another country and needs the laptop while they are on the road. Which of the following would be the best option?", "opts": ["Provide the user with the option to repair, replace, or rent a new system", "Assign the user to the standard seven-day repair agreement", "Replace the external power cable and close the repair ticket", "Recommend the user cancel their travel plans"], "ans": [0], "why": "When a user has an urgent deadline, <strong>offering repair, replacement, or rental options</strong> ensures their business needs are met while the repair is addressed.", "isAcronym": false}, {"id": "B50", "obj": "Obj 3.4", "q": "A desktop administrator is troubleshooting poor performance on a user's laptop computer. The system takes an excessive amount of time during the boot process, and pop up messages appear while using the word processor and spreadsheet applications. Which of the following steps should the technician do next?", "opts": ["Educate the end-user", "Schedule periodic anti-virus scans", "Enable System Protection", "Disconnect the laptop from the network"], "ans": [3], "why": "Slow boot with pop-up messages indicates malware; <strong>disconnecting from the network</strong> quarantines the system and prevents further spread or data exfiltration.", "isAcronym": false}, {"id": "B18", "obj": "Obj 2.6", "q": "A user has opened a help desk ticket to remove malware from his laptop. A previous removal occurred two weeks earlier with a similar malware infection. Which of the following was missed during the first malware removal?", "opts": ["Restart the computer", "Educate the end-user", "Enable System Protection", "Quarantine infected systems"], "ans": [1], "why": "Failing to <strong>educate the user</strong> on safe practices after malware removal is the most common reason infections recur.", "isAcronym": false}, {"id": "A18", "obj": "Obj 4.5", "q": "An office power system occasionally experiences minor voltage spikes during the business day. Which of the following would be the best way to address this power issue?", "opts": ["Power down when not actively working", "Confirm the building has an electrical ground", "Connect a surge suppressor to each system", "Maintain an inventory of replacement power supplies"], "ans": [2], "why": "A <strong>surge suppressor</strong> absorbs minor voltage spikes protecting connected equipment from damage during transient power events.", "isAcronym": false}, {"id": "ACR11", "obj": "Acronyms", "q": "Which acronym matches the following definition: <em>GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB</em>?", "opts": ["GPT", "HDD", "VPN", "eSATA"], "ans": [0], "why": "<strong>GPT</strong> stands for GUID Partition Table – modern partitioning standard, supports 128+ partitions and >2TB. VPN = Virtual Private Network – encrypted tunnel for secure remote access. eSATA = External SATA – external version of SATA interface for storage. HDD = Hard Disk Drive – traditional spinning magnetic storage.", "isAcronym": true}, {"id": "C24", "obj": "Obj 3.2", "q": "An app on a user's corporate smartphone has stopped updating. Which of the following would be the best way to resolve this issue?", "opts": ["Connect the smartphone to a power source", "Restart the smartphone", "Disable rotation lock", "Disable Bluetooth"], "ans": [1], "why": "<strong>Restarting the smartphone</strong> clears background processes that may be preventing app updates from completing.", "isAcronym": false}, {"id": "C69", "obj": "Obj 1.2", "q": "A workstation technician manages a training center with thirty student computers in each room. All of the computers have the same hardware configurations. Which of these installation methods would be the best choice for quickly resetting the training rooms at the end of each week?", "opts": ["In-place upgrade", "Image installation", "Repair installation", "Clean install"], "ans": [1], "why": "<strong>Image installation</strong> allows rapid, identical deployment across all identically-configured systems, making weekly resets fast and consistent. A clean install requires manual setup each time.", "isAcronym": false}, {"id": "A80", "obj": "Obj 1.2", "q": "A system administrator needs to up
