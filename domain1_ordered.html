<script>
const questions=[
{num:1,source:"Dion",ref:"Q25",obj:"Obj 1.1",q:"A user is trying to transfer a 5GB video file to a USB flash drive formatted with FAT32, but the process fails. What is the most likely reason?",choices:["The file is corrupted","FAT32 does not support files larger than 4GB","The USB drive is write-protected","The file system needs to be defragmented"],answer:1,explain:"<strong>FAT32</strong> has a maximum individual file size limit of 4GB. A 5GB file exceeds this limit regardless of available drive space. The drive would need to be reformatted as exFAT or NTFS to support larger files. Write protection and fragmentation would produce different error messages.",multi:false},
{num:2,source:"Dion",ref:"Q90",obj:"Obj 1.1",q:"Which of the following macOS features is used to backup and restore files to an external hard disk?",choices:["FileVault","Mission Control","Time Machine","Keychain"],answer:2,explain:"<strong>Time Machine</strong> is macOS's built-in backup utility that automatically backs up to an external drive and allows point-in-time file restoration. FileVault provides disk encryption. Mission Control manages window and desktop organization. Keychain manages passwords and credentials.",multi:false},
{num:3,source:"Dion",ref:"Q5",obj:"Obj 1.1",q:"Which of the following commands can be used to install software on a Linux system?",choices:["nano","apt","grep","chmod"],answer:1,explain:"<strong>apt</strong> (Advanced Package Tool) is the package manager used on Debian-based Linux distributions to install, update, and remove software. nano is a text editor, grep searches file content, and chmod changes file permissions.",multi:false},
{num:4,source:"Messer",ref:"A47",obj:"Obj 1.2",q:"A system administrator is upgrading four workstations from Windows 8.1 to Windows 11. All of the user files and applications are stored on the server, and no documents or settings need to be retained between versions. Which of these installation methods would be the best way to provide this upgrade?",choices:["Factory reset","Repair installation","Clean install","In-place upgrade"],answer:2,explain:"A <strong>clean install</strong> wipes the existing OS entirely, which is ideal when no local data or settings need to be preserved. Since all files are on the server, there is no risk of data loss. A repair installation fixes existing OS issues, and an in-place upgrade preserves applications and settings which is unnecessary here.",multi:false},
{num:5,source:"Messer",ref:"C46",obj:"Obj 1.2",q:"A manager in the accounting department would like to upgrade to Windows 11, but she doesn't want to lose access to any of the currently installed applications or data. Which of the following methods would be the best choice for these requirements?",choices:["Clean install","Image deployment","Remote network installation","In-place upgrade"],answer:3,explain:"An <strong>in-place upgrade</strong> preserves all existing applications, files, and settings while upgrading the OS version. A clean install would remove all applications and data. Image deployment overwrites the drive. Remote network installation is a deployment method, not an upgrade type.",multi:false},
{num:6,source:"Messer",ref:"A80",obj:"Obj 1.2",q:"A system administrator needs to upgrade a training room of twenty systems to the latest Windows version. Which of the following would be the most efficient method of performing this upgrade process?",choices:["Recovery partition","Remote network installation","Repair installation","USB key"],answer:1,explain:"<strong>Remote network installation</strong> allows simultaneous deployment to multiple systems from a central server, making it the most efficient for large-scale upgrades. USB key requires visiting each system individually. Recovery partition restores factory state. Repair installation fixes existing OS issues.",multi:false},
{num:7,source:"Messer",ref:"B58",obj:"Obj 1.2",q:"A system administrator would like to create a Windows distribution which can automatically configure itself to connect to the corporate domain and automatically configure individual user email settings. Which of the following would be the best choice for this requirement?",choices:["Zero-touch deployment","Recovery partition installation","Image deployment","In-place upgrade"],answer:0,explain:"<strong>Zero-touch deployment</strong> automates the entire setup process including domain join and email configuration with no manual intervention. Image deployment creates identical copies but does not automate per-user configuration. Recovery partition restores factory defaults.",multi:false},
{num:8,source:"Messer",ref:"A42",obj:"Obj 1.2",q:"A technician is installing a fresh Windows operating system on a file server. Unfortunately, the drive controller in the system is not recognized during the installation process. Which of the following would be the best way to manage this issue?",choices:["Load third-party drivers","Restart the system","Use a remote network installation","Boot from the recovery partition"],answer:0,explain:"When Windows does not natively recognize a drive controller during installation, loading <strong>third-party drivers</strong> from the manufacturer provides the required support. Restarting will not resolve a missing driver. Remote network installation uses the same Windows installer which still lacks the driver.",multi:false},
{num:9,source:"Messer",ref:"A25",obj:"Obj 1.2",q:"A system administrator is installing a Windows Server device in the data center. Which of the following file systems would be the best choice for this task?",choices:["ReFS","APFS","ext4","XFS"],answer:0,explain:"<strong>ReFS</strong> (Resilient File System) is Microsoft's modern file system designed for server environments with enhanced data integrity and fault tolerance. APFS is Apple's file system. ext4 and XFS are Linux file systems. ReFS is purpose-built for Windows Server workloads.",multi:false},
{num:10,source:"Messer",ref:"A41",obj:"Obj 1.2",q:"A system administrator is configuring a server to use eight bootable partitions on a single SSD. Which of the following partition styles would be the best choice for this configuration?",choices:["MBR","NTFS","diskpart","GPT"],answer:3,explain:"<strong>GPT</strong> supports up to 128 partitions and drives larger than 2TB, whereas MBR is limited to four primary partitions. NTFS is a file system, not a partition style. diskpart is a command-line partitioning tool, not a partition style.",multi:false},
{num:11,source:"Messer",ref:"B42",obj:"Obj 1.2",q:"Which of the following partition types limit a Windows installation to a maximum partition size of 2 TB?",choices:["FAT32","GPT","APFS","MBR"],answer:3,explain:"<strong>MBR</strong> (Master Boot Record) has a hard 2TB maximum partition size limit and supports only four primary partitions. GPT supports drives larger than 2TB. FAT32 is a file system type, not a partition style. APFS is Apple's file system.",multi:false},
{num:12,source:"Messer",ref:"A19",obj:"Obj 1.3",q:"What is the maximum amount of RAM supported by a 32-bit version of an operating system?",choices:["4 GB","8 GB","16 GB","192 GB"],answer:0,explain:"A <strong>32-bit OS</strong> can address a maximum of 2^32 memory addresses, which equals 4 GB of RAM. This is a hard architectural limit regardless of how much physical RAM is installed. 64-bit operating systems support far larger amounts of RAM.",multi:false},
{num:13,source:"Messer",ref:"B19",obj:"Obj 1.3",q:"Which of the following features would be found in Windows 11 Pro but not in Windows 11 Home?",choices:["32-bit and 64-bit versions","Domain access","RDP client","Windows Workgroup"],answer:1,explain:"<strong>Windows 11 Pro</strong> supports joining an Active Directory domain; Windows 11 Home does not include this capability. Both editions support workgroups and include an RDP client for outbound connections. Windows 11 is only available in 64-bit for both editions.",multi:false},
{num:14,source:"Messer",ref:"A77",obj:"Obj 1.3",q:"A financial corporation is deploying laptops to their salespeople in the field. The sales teams require video playback functionality, but the Windows configuration does not include any multimedia utilities. Which of the following would be the most likely reason for these missing utilities?",choices:["Laptops are using Windows N edition","Video playback is disabled in the BIOS","Laptop hardware does not support video playback","The video format is not recognized by the laptop"],answer:0,explain:"<strong>Windows N editions</strong> are sold in Europe and do not include Windows Media Player or other multimedia components by default. These components must be installed separately using the Media Feature Pack. BIOS settings do not control multimedia application availability.",multi:false},
{num:15,source:"Messer",ref:"C32",obj:"Obj 1.3",q:"The upgrade process for Windows requires the installation of TPM hardware. Which of the following would best describe the reason for this system requirement?",choices:["Wired networking","64-bit compatibility","USB support","Cryptographic features"],answer:3,explain:"<strong>TPM</strong> (Trusted Platform Module) is a dedicated security chip that provides hardware-based cryptographic functions required by Windows 11. It enables BitLocker encryption, Secure Boot verification, and Windows Hello authentication. It has no role in networking, USB support, or CPU architecture.",multi:false},
{num:16,source:"Messer",ref:"A20",obj:"Obj 1.4",q:"A user is attempting to start an application on his laptop computer. Each time the application shows the starting graphic, it suddenly disappears and the application icon disappears from the taskbar. A technician would like to get more information about each previous occurrence of the application crash. Which of these choices would provide these details?",choices:["Event Viewer","Task Manager","Startup Repair","Safe Mode"],answer:0,explain:"<strong>Event Viewer</strong> logs application crashes and errors with timestamps and error codes, providing a complete history of each occurrence. Task Manager shows currently running processes but not crash history. Startup Repair fixes boot issues. Safe Mode does not provide crash logs.",multi:false},
{num:17,source:"Messer",ref:"A78",obj:"Obj 1.4",q:"A system administrator is adding an additional drive to a server and extending the size of an existing volume. Which of the following utilities would provide a graphical summary of the existing storage configuration?",choices:["Disk Management","Performance Monitor","Event Viewer","Task Scheduler"],answer:0,explain:"<strong>Disk Management</strong> provides a graphical view of all drives, volumes, and partitions and allows extending existing volumes. Performance Monitor tracks resource utilization. Event Viewer logs system events. Task Scheduler automates tasks on a schedule.",multi:false},
{num:18,source:"Messer",ref:"A51",obj:"Obj 1.4",q:"A system administrator would like all help desk computers to check for anti-virus signature updates every hour during the workday. Which of the following would be the best way to provide this functionality?",choices:["System Configuration","Task Scheduler","Device Manager","Certificate Manager"],answer:1,explain:"<strong>Task Scheduler</strong> automates the execution of programs or scripts at defined time intervals without manual intervention. System Configuration manages startup and services. Device Manager handles hardware drivers. Certificate Manager manages digital certificates.",multi:false},
{num:19,source:"Messer",ref:"B15",obj:"Obj 1.4",q:"A system administrator is analyzing a problem with a USB flash drive on a Windows computer. When the flash drive is inserted, the CPU utilization increases to 100%. The administrator would like to disable one of the computer's USB controllers for troubleshooting. Which of the following would provide this functionality?",choices:["Services","Performance Monitor","Event Viewer","Device Manager"],answer:3,explain:"<strong>Device Manager</strong> allows administrators to enable, disable, and manage hardware controllers and their drivers. Services manages background OS services. Performance Monitor tracks resource utilization. Event Viewer logs system events and errors.",multi:false},
{num:20,source:"Messer",ref:"A37",obj:"Obj 1.4",q:"A user has installed multiple applications over the last week. During the startup process, the computer now takes over fifteen minutes to display the Windows desktop. Which of the following utilities would help the system administrator troubleshoot this issue?",choices:["defrag","Performance Monitor","Task Manager","robocopy"],answer:2,explain:"<strong>Task Manager's Startup tab</strong> shows all programs that launch at boot and allows disabling those causing slow startup times. defrag optimizes HDD performance but does not manage startup programs. Performance Monitor tracks ongoing resource usage. robocopy is a file copy utility.",multi:false},
{num:21,source:"Messer",ref:"B89",obj:"Obj 1.4",q:"A desktop administrator is troubleshooting an error which randomly causes a workstation to spike to 100% utilization. Which of these utilities would help the administrator track and report on system utilization over a 24-hour period?",choices:["Performance Monitor","Device Manager","Services","Task Scheduler"],answer:0,explain:"<strong>Performance Monitor</strong> can log and graph system resource utilization over extended time periods, enabling analysis of intermittent spikes. Device Manager manages hardware. Services manages background processes. Task Scheduler automates tasks but does not track utilization history.",multi:false},
{num:22,source:"Messer",ref:"C53",obj:"Obj 1.4",q:"A technician has been tasked with updating the BIOS of any Windows device using an older BIOS version. The technician cannot reboot these systems to check the BIOS versions currently in use. Which of the following would be the best way to proceed?",choices:["Install the BIOS upgrade regardless of the version","View BIOS information in Group Policy Editor","Run a report using Performance Monitor","Use System Information to view the BIOS version"],answer:3,explain:"<strong>System Information</strong> (msinfo32) displays the current BIOS version and date without requiring a reboot. Group Policy Editor manages policy settings, not BIOS information. Performance Monitor tracks resource utilization. Installing the upgrade regardless risks issues if the version is already current.",multi:false},
{num:23,source:"Messer",ref:"C38",obj:"Obj 1.4",q:"A system administrator would like to upgrade a user's Windows video editing application to the latest version, but the upgrade utility fails with the error \"Not enough free space.\" Which of the following utilities would allow the system administrator to resolve this issue?",choices:["cleanmgr","perfmon","eventvwr","taskschd"],answer:0,explain:"<strong>Disk Cleanup</strong> (cleanmgr) removes temporary files, cached data, and other unnecessary files to free up drive space. perfmon monitors system performance. eventvwr views event logs. taskschd manages scheduled tasks. None of the others free disk space.",multi:false},
{num:24,source:"Messer",ref:"A40",obj:"Obj 1.5",q:"A system administrator needs to view a set of application log files contained in a folder named \"logs.\" Which of the following commands should be used to make this folder the current directory?",choices:["cd logs","mv logs","dir logs","md logs"],answer:0,explain:"The <strong>cd</strong> (change directory) command navigates to a specified directory, making it the current working directory. mv moves files in Linux. dir lists directory contents in Windows. md creates a new directory.",multi:false},
{num:25,source:"Messer",ref:"B13",obj:"Obj 1.5",q:"A system administrator has been tasked with locating all of the log files contained within an application folder. The folder currently contains over a thousand files, and only a portion of them have a .log extension. Which of these Windows commands would be the best way to find these files?",choices:["sfc","diskpart","robocopy","dir"],answer:3,explain:"The <strong>dir</strong> command with a wildcard (e.g., dir *.log) lists only files matching a specific extension within a directory. sfc checks system file integrity. diskpart manages partitions. robocopy copies files between locations.",multi:false},
{num:26,source:"Messer",ref:"B8",obj:"Obj 1.5",q:"A user needs to modify a spreadsheet for an upcoming meeting. The spreadsheet is currently stored on a remote computer in a shared drive. The user would like to access the shared drive as a drive letter inside of Windows File Explorer. Which of the following command line options would provide this functionality?",choices:["tasklist","net use","diskpart","netstat"],answer:1,explain:"The <strong>net use</strong> command maps a network share to a local drive letter, making it accessible in File Explorer. tasklist displays running processes. diskpart manages local disk partitions. netstat displays active network connections.",multi:false},
{num:27,source:"Messer",ref:"A74",obj:"Obj 1.5",q:"An organization has been tasked with increasing the minimum password length. A systems administrator has created a policy to require all passwords to be at least ten characters long for all users. When testing this policy in the lab, a laptop computer allowed the creation of eight-character passwords. Which of the following commands should be used to apply this new policy on the laptop?",choices:["net use","gpupdate","sfc","tasklist"],answer:1,explain:"The <strong>gpupdate</strong> command forces an immediate refresh of Group Policy settings on a local computer. net use maps network drives. sfc repairs system files. tasklist displays currently running processes.",multi:false},
{num:28,source:"Messer",ref:"C10",obj:"Obj 1.5",q:"A computer technician has been asked to verify a set of new Active Directory settings on computers at a remote site. Which of the following commands should be used to validate the last policy update on the systems?",choices:["net use","sfc","gpresult","netstat"],answer:2,explain:"The <strong>gpresult</strong> command displays the Resultant Set of Policy (RSoP) and shows which Group Policy settings have been applied to the computer. net use maps network drives. sfc repairs system files. netstat shows network connections.",multi:false},
{num:29,source:"Messer",ref:"A64",obj:"Obj 1.5",q:"A malware infection has recently been removed from a computer. When starting the operating system, Windows shows errors during the startup process indicating some core operating system files are missing. Which of the following should be used to restore these missing files?",choices:["gpupdate","winver","sfc","diskpart"],answer:2,explain:"The <strong>System File Checker</strong> (sfc /scannow) scans and restores corrupted or missing core Windows system files. gpupdate refreshes Group Policy. winver displays the Windows version. diskpart manages disk partitions.",multi:false},
{num:30,source:"Messer",ref:"C20",obj:"Obj 1.5",q:"A server administrator needs to create a folder on a Windows server to store weekly status report documents. Which of the following command-line tools would provide this functionality?",choices:["md","net use","cd","dir"],answer:0,explain:"The <strong>md</strong> (make directory) command creates a new folder at the specified path from the command line. net use maps network drives. cd changes the current directory. dir lists directory contents.",multi:false},
{num:31,source:"Messer",ref:"B87",obj:"Obj 1.5",q:"A technician is working on many different terminal sessions on their screen from different servers. The technician has also used different authentication credentials on each server. Which of the following would be the best way to display the login name associated with each terminal session?",choices:["winver","nslookup","whoami","net use"],answer:2,explain:"The <strong>whoami</strong> command displays the username of the currently authenticated user in the active terminal session. winver shows the Windows version. nslookup queries DNS. net use manages network drive mappings.",multi:false},
{num:32,source:"Messer",ref:"A24",obj:"Obj 1.5",q:"A system administrator has created a shared folder on a server to store operating system images. Technicians access the shared folder to download the latest images when performing large-scale system installations. Which of the following will be the most likely method of accessing this data?",choices:["Map the shared folder to an available drive letter","Download the shared folder through a proxy","Link the images to a cloud storage service","Access the folder using a remote access client"],answer:0,explain:"<strong>Mapping a shared folder</strong> to a drive letter provides easy, persistent access through File Explorer using net use or GUI mapping. Proxy access is for web traffic. Cloud storage would require migrating images. Remote access clients provide desktop control, not file share access.",multi:false},
{num:33,source:"Messer",ref:"A63",obj:"Obj 1.5",q:"In which of the following file types would a system administrator expect to see the command, \"cd c:\\source\"?",choices:[".sh",".vbs",".py",".bat"],answer:3,explain:"The <strong>.bat</strong> (batch) file type is a Windows command-line script format that executes DOS/Windows commands like cd. .sh is a Linux/Unix shell script. .vbs is Visual Basic Script. .py is Python. The cd command and Windows path syntax identify this as a Windows batch file.",multi:false},
{num:34,source:"Messer",ref:"A86",obj:"Obj 1.6",q:"A user is connecting their laptop to an external monitor and keyboard, but the laptop goes into sleep mode if the laptop screen is shut. Which of the following utilities can be used to keep the laptop running when the lid is closed?",choices:["Power Options","Device Manager","Personalization","User Accounts"],answer:0,explain:"<strong>Power Options</strong> in Control Panel includes a setting to define what happens when the laptop lid is closed, including keeping it running (Do nothing). Device Manager manages hardware drivers. Personalization controls visual settings. User Accounts manages account credentials.",multi:false},
{num:35,source:"Messer",ref:"B53",obj:"Obj 1.6",q:"A technician would like to modify a configuration in a user's UEFI BIOS, but the system will not provide a BIOS configuration hotkey after shutting down and powering on the computer. Which of the following would be the best way to address this issue?",choices:["Change the File Explorer Options","Modify the Indexing Options","Turn off Fast Startup","Start the computer in Safe Mode"],answer:2,explain:"<strong>Fast Startup</strong> causes Windows to hibernate rather than fully shut down, bypassing the POST and preventing BIOS access on the next boot. Turning it off forces a full shutdown, allowing the BIOS hotkey to work. File Explorer and Indexing Options are unrelated.",multi:false},
{num:36,source:"Messer",ref:"B48",obj:"Obj 1.6",q:"A system administrator needs to modify a file in the \\Windows\\Installer directory, but the folder doesn't appear in the list of available files. Which of these options would help the system administrator with this task?",choices:["Safe Mode","File Explorer Options","User Accounts","Internet Options"],answer:1,explain:"<strong>File Explorer Options</strong> allows enabling the display of hidden files and folders, which are hidden by default in Windows. The \\Windows\\Installer directory is a hidden system folder. Safe Mode does not reveal hidden folders. User Accounts and Internet Options are unrelated.",multi:false},
{num:37,source:"Messer",ref:"A79",obj:"Obj 1.6",q:"While using a Windows laptop during presentations, a company vice president has reported her system is interrupting the meeting with system notifications from the browser, PDF reader, the Microsoft Store, and other applications. Which of the following would be the best way to address this issue?",choices:["Use a different laptop for presentations","Run the presentation software as Administrator","Enable Airplane mode while presenting","Disable notifications while specific applications are running"],answer:3,explain:"<strong>Windows Focus Assist</strong> or per-application notification settings allow suppressing interruptions during presentations without disconnecting from the network. Airplane mode would disconnect networking. Running as Administrator does not suppress notifications. Using a different laptop is impractical.",multi:false},
{num:38,source:"Messer",ref:"A45",obj:"Obj 1.7",q:"The hard drive in a macOS desktop has failed and none of the data on the drive is recoverable. A new storage drive has now been installed. Which of the following should be used to restore the data on the computer?",choices:["Backup and Restore","Mission Control","Time Machine","Disk Utility"],answer:2,explain:"<strong>Time Machine</strong> is macOS's built-in backup utility used to restore data to a new drive after a failure. Backup and Restore is a Windows feature. Mission Control manages macOS window and desktop organization. Disk Utility manages partitions and disk health but does not restore backups.",multi:false},
{num:39,source:"Messer",ref:"B11",obj:"Obj 1.7",q:"A technician needs to uninstall a video editing utility from a macOS laptop. Which folder would be the most likely location of this utility?",choices:["/Program Files","/Applications","/Library","/Users"],answer:1,explain:"macOS stores all installed user applications in the <strong>/Applications</strong> directory, which is the standard location for app management and uninstallation. /Program Files is a Windows directory. /Library stores system resources and frameworks. /Users contains user home directories.",multi:false},
{num:40,source:"Messer",ref:"B60",obj:"Obj 1.7",q:"A macOS user needs to protect all of the data on their laptop if the laptop is stolen or lost. Which of the following would be the best choice for this requirement?",choices:["Spaces","Mission Control","FileVault","Keychain"],answer:2,explain:"<strong>FileVault</strong> provides full-disk encryption on macOS, protecting all data on the drive if the laptop is lost or stolen. Spaces manages virtual desktops. Mission Control manages windows and desktops. Keychain stores passwords but does not encrypt the entire disk.",multi:false},
{num:41,source:"Messer",ref:"C59",obj:"Obj 1.7",q:"A user is working with a .dmg file on their macOS desktop. Which of the following would describe the contents of this file?",choices:["Debug information","Disk image","Application library","Disk maintenance utility"],answer:1,explain:"A <strong>.dmg</strong> file is a macOS disk image file used to distribute applications and other software in a mountable format. When opened, it mounts as a virtual disk. It is not a debug file, an application library format, or a maintenance utility.",multi:false},
{num:42,source:"Messer",ref:"C21",obj:"Obj 1.7",q:"A desktop administrator has received a notification of a deployed RSR update. Which of the following would be most affected by this update?",choices:["macOS laptops","Linux database servers","Android tablets","Windows desktops"],answer:0,explain:"<strong>RSR</strong> (Rapid Security Response) is an Apple-specific update mechanism that delivers critical security patches to macOS and iOS devices rapidly between major OS updates. It has no effect on Linux, Android, or Windows systems.",multi:false},
{num:43,source:"Messer",ref:"A31",obj:"Obj 1.8",q:"A Linux administrator needs to modify the configuration text file for a service. Which of the following utilities would provide this functionality?",choices:["nano","chmod","df","sudo"],answer:0,explain:"<strong>nano</strong> is a simple command-line text editor for Linux used to create and modify configuration files. chmod changes file permissions. df displays disk space usage. sudo grants elevated privileges to run commands as root.",multi:false},
{num:44,source:"Messer",ref:"C11",obj:"Obj 1.8",q:"A system administrator needs to modify the Linux group associated with a file. Which of the following would provide this functionality?",choices:["ps","df","chown","grep"],answer:2,explain:"The <strong>chown</strong> command changes the owner and group associated with a file or directory in Linux. ps lists running processes. df displays disk usage. grep searches file contents for text patterns.",multi:false},
{num:45,source:"Messer",ref:"B49",obj:"Obj 1.8",q:"A Linux administrator is modifying a log file and needs to rename the file. Which of the following should be used to make this change?",choices:["rm","mv","mkdir","pwd"],answer:1,explain:"The <strong>mv</strong> command moves or renames files and directories in Linux. rm removes files. mkdir creates a new directory. pwd displays the current working directory path.",multi:false},
{num:46,source:"Messer",ref:"C31",obj:"Obj 1.8",q:"A Linux administrator is using the grep command while monitoring a database application. Which of the following would best describe this activity?",choices:["Search through a file for specific text","View a list of running processes","Change the permissions of a file","View the name of the working directory"],answer:0,explain:"The <strong>grep</strong> command searches through files or output for lines matching a specified text pattern. Running processes are viewed with ps or top. File permissions are changed with chmod. The current directory is shown with pwd.",multi:false},
{num:47,source:"Messer",ref:"A85",obj:"Obj 1.8",q:"A Linux administrator has been asked to upgrade the web server software on a device. Which of the following would provide the administrator with the appropriate rights and permissions for this upgrade?",choices:["chmod","apt","dig","sudo"],answer:3,explain:"The <strong>sudo</strong> command grants a user temporary elevated (root-level) privileges to perform administrative tasks. chmod changes file permissions but does not elevate user privileges. apt installs packages but still requires elevated rights. dig queries DNS records.",multi:false},
{num:48,source:"Messer",ref:"C86",obj:"Obj 1.8",q:"A technician is troubleshooting a problem on a Linux server and needs to view the real-time CPU and memory utilization for each operating system process. Which of the following would provide this functionality?",choices:["dig","df","cat","top"],answer:3,explain:"The <strong>top</strong> command displays real-time system resource usage including CPU and memory per process in Linux. dig queries DNS. df displays disk space. cat displays file contents.",multi:false},
{num:49,source:"Messer",ref:"A29",obj:"Obj 1.9",q:"A system administrator has been asked to install a new application on a server, but the application is 64-bit and the server operating system is 32-bit. Which of the following describes the issue associated with this installation?",choices:["File permissions","OS compatibility","Installation method","Available drive space"],answer:1,explain:"A <strong>64-bit application</strong> cannot run on a 32-bit operating system due to fundamental processor and memory addressing incompatibilities. This is an OS compatibility issue. File permissions, installation method, and drive space are not the cause of this specific incompatibility.",multi:false},
{num:50,source:"Messer",ref:"A53",obj:"Obj 1.9",q:"A Windows user is installing a new application, and the installation process also installs a service. Which of the following permissions will be required for this installation?",choices:["Guest","Power User","Administrator","Standard user"],answer:2,explain:"Installing a service requires <strong>Administrator</strong>-level permissions as services run at the OS level and modify system configuration. Guest and Standard user accounts do not have sufficient privileges. Power User is a legacy account type with limited elevated rights.",multi:false},
{num:51,source:"Messer",ref:"B43",obj:"Obj 1.9",q:"A user in the engineering department needs to use some applications written for Windows, but also needs to use applications designed for Linux. Which of the following would be the best way to provide access to these applications?",choices:["Assign the user multiple computers","Boot the operating systems from two removable USBs","Configure the user's PC for multiboot","Compile the Linux applications in Windows"],answer:2,explain:"A <strong>multiboot</strong> configuration allows a single PC to run either Windows or Linux at startup, providing access to both sets of applications on one machine. Multiple computers are inefficient. Booting from USB is unreliable for production use. Linux applications cannot be compiled to run natively on Windows.",multi:false},
{num:52,source:"Messer",ref:"A55",obj:"Obj 1.10",q:"An employee has modified the NTFS permissions on a folder to provide read access to Everyone. However, users connecting from a different computer do not have access to the file. Which of the following is the reason for this issue?",choices:["The NTFS permissions were not synchronized","Share permissions restrict access from remote devices","The user is an Administrator","Remote users are connecting with Guest accounts"],answer:1,explain:"When accessing files remotely, both <strong>NTFS and share permissions</strong> apply; the more restrictive of the two takes effect. Share permissions default to restricted access for remote connections even when NTFS permissions are more permissive. Both must be configured correctly for remote access.",multi:false},
{num:53,source:"Messer",ref:"B37",obj:"Obj 1.10",q:"Which of the following Windows Share permissions has the priority when assigning access on a mapped drive?",choices:["Allow","Full control","List folder contents","Deny"],answer:3,explain:"A <strong>Deny</strong> permission always overrides any Allow permission in Windows, regardless of group membership or other assignments. This applies to both NTFS and share permissions. Full Control, Allow, and List Folder Contents are all overridden by an explicit Deny.",multi:false},
{num:54,source:"Messer",ref:"A67",obj:"Obj 1.10",q:"A system administrator is creating a series of shared folders which should not be visible when users browse the network for available resources. What symbol should be added to the end of a share name to provide this functionality?",choices:[". (period)","$ (dollar sign)","! (exclamation mark)","# (hash sign)"],answer:1,explain:"Appending a <strong>$</strong> (dollar sign) to a Windows share name creates a hidden administrative share that does not appear when browsing network resources. The share is still accessible to those who know the full UNC path. No other symbol provides this functionality.",multi:false},
{num:55,source:"Messer",ref:"A66",obj:"Obj 1.10",q:"A system administrator would like to require a specific level of password complexity for all Active Directory users. Which of the following would be the best way to complete this requirement?",choices:["Login script","Folder redirection","Port security","Group Policy"],answer:3,explain:"<strong>Group Policy</strong> allows administrators to enforce password complexity requirements across all Active Directory users from a central location. Login scripts run commands at logon. Folder redirection manages user folder locations. Port security is a network switch feature.",multi:false},
{num:56,source:"Messer",ref:"A54",obj:"Obj 1.10",q:"A user working from home is not able to print to a laser printer at the corporate office. Which of the following would be the most likely reason for this issue?",choices:["WPA3 settings","Outdated anti-virus signatures","Disconnected VPN","MDM configuration"],answer:2,explain:"Corporate printers are on the internal network; without a <strong>VPN</strong> connection, a remote user cannot reach internal network resources including printers. WPA3 is a wireless encryption protocol. Antivirus signatures do not affect network printing. MDM manages mobile devices.",multi:false},
{num:57,source:"Messer",ref:"C48",obj:"Obj 1.10",q:"A help desk is receiving reports associated with a group of devices not able to communicate outside of their local IP subnet. A technician can ping devices on the same network, but does not receive a response when pinging the IP address of external devices. Which of the following would be the most likely cause of this issue?",choices:["Default gateway","DNS server","Proxy server","Metered connection"],answer:0,explain:"The <strong>default gateway</strong> routes traffic from the local subnet to external networks; a missing or incorrect gateway prevents outside communication while local communication remains functional. DNS resolves names. Proxy servers and metered connections would not prevent ICMP responses to IPs.",multi:false},
{num:58,source:"Dion",ref:"Q19",obj:"Obj 1.11",q:"A company's new messaging platform causes employees to miss important updates in busy chats. What is the best way to fix this using the platform's built-in features?",choices:["Disable all notifications","Configure notification settings to highlight key messages","Switch to a different platform","Require employees to check messages every hour"],answer:1,explain:"<strong>Cloud-based collaboration tools</strong> like Slack, Teams, and others include built-in notification and highlight settings that allow users to be alerted for important messages without being overwhelmed. Disabling notifications causes the original problem. Switching platforms is excessive. Mandatory check schedules are inefficient.",multi:false},
{num:59,source:"Dion",ref:"Q48",obj:"Obj 1.11",q:"An employee reports that they must log in separately to email, cloud storage, and the company intranet. What is the most effective solution to streamline this process?",choices:["Train employees to use a password manager","Implement Single Sign-On","Require the same password for all services","Remove authentication from internal systems"],answer:1,explain:"<strong>Single Sign-On (SSO)</strong> is the cloud identity synchronization feature that allows users to authenticate once and access all connected services — email, storage, and intranet — without separate logins. Password managers help but don't eliminate multiple logins. Reusing passwords is a security risk. Removing authentication is dangerous.",multi:false},
{num:60,source:"Dion",ref:"Q3",obj:"Obj 1.11",q:"Which of the following concepts is the MOST important for a company's long-term health in the event of a disaster?",choices:["Uninterruptible power supplies","Off-site backups","Implementing an acceptable use policy","Vulnerability scanning"],answer:1,explain:"<strong>Off-site backups</strong> are the most critical cloud/storage concept for long-term business continuity in a disaster scenario. On-site UPS systems would be destroyed in a large-scale disaster. An AUP governs user behavior but does not protect data. Vulnerability scanning is proactive security, not disaster recovery.",multi:false},
{num:61,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"Which acronym refers to Apple's native file system used on macOS devices?",choices:["NTFS","APFS","exFAT","ReFS"],answer:1,explain:"<strong>APFS</strong> stands for Apple File System. It is Apple's proprietary file system introduced for macOS, iOS, and other Apple devices. NTFS is the standard Windows file system. exFAT is a cross-platform format for flash drives. ReFS is Microsoft's server file system.",multi:false},
{num:59,source:"Messer",ref:"Acronym",obj:"Obj 1.2",q:"What does GPT stand for in the context of disk partitioning?",choices:["General Partition Table","Graphical Processing Tool","GUID Partition Table","Global Partition Type"],answer:2,explain:"<strong>GPT</strong> stands for GUID Partition Table. It is the modern partitioning standard that supports up to 128 partitions and drives larger than 2TB. MBR is the older legacy alternative limited to 4 primary partitions and 2TB maximum size.",multi:false},
{num:60,source:"Messer",ref:"Acronym",obj:"Obj 1.2",q:"What does MBR stand for?",choices:["Master Boot Record","Main BIOS Register","Memory Buffer Region","Master Byte Routine"],answer:0,explain:"<strong>MBR</strong> stands for Master Boot Record. It is the legacy partition style limited to four primary partitions and a maximum drive size of 2TB. It has been largely replaced by GPT on modern systems, especially those using UEFI firmware.",multi:false},
{num:61,source:"Messer",ref:"Acronym",obj:"Obj 1.2",q:"What does ReFS stand for?",choices:["Remote File Sharing","Resilient File System","Registry File Structure","Redundant File Service"],answer:1,explain:"<strong>ReFS</strong> stands for Resilient File System. It is Microsoft's modern server-grade file system designed for enhanced data integrity, automatic error correction, and fault tolerance. It is best suited for Windows Server environments rather than desktop workstations.",multi:false},
{num:62,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"What does FAT32 stand for?",choices:["Fast Access Table 32","File Allocation Table 32","Fixed Allocation Type 32","Format And Transfer 32"],answer:1,explain:"<strong>FAT32</strong> stands for File Allocation Table 32-bit. It is an older cross-platform file system compatible with Windows, macOS, and Linux, but has a maximum individual file size limit of 4GB. exFAT was created to overcome this limitation.",multi:false},
{num:63,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"What does ext4 stand for?",choices:["Extended Transfer 4","External Type 4","Fourth Extended Filesystem","Extra Texture Format 4"],answer:2,explain:"<strong>ext4</strong> stands for Fourth Extended Filesystem. It is the primary file system used by most Linux distributions. It supports large files and volumes, journaling for data integrity, and is backward compatible with ext2 and ext3.",multi:false},
{num:64,source:"Messer",ref:"Acronym",obj:"Obj 1.3",q:"What does TPM stand for?",choices:["Transfer Protocol Module","Trusted Platform Module","Terminal Process Manager","Total Power Management"],answer:1,explain:"<strong>TPM</strong> stands for Trusted Platform Module. It is a dedicated hardware security chip that provides cryptographic functions including key storage, Secure Boot verification, and BitLocker encryption support. Windows 11 requires TPM 2.0 to install.",multi:false},
{num:65,source:"Messer",ref:"Acronym",obj:"Obj 1.3",q:"What does UEFI stand for?",choices:["Universal Extended Firmware Interface","Unified Extensible Firmware Interface","Updated Executable Firmware Install","Unified External File Interface"],answer:1,explain:"<strong>UEFI</strong> stands for Unified Extensible Firmware Interface. It is the modern replacement for BIOS, offering faster boot times, support for drives larger than 2TB, Secure Boot, and a graphical interface. Most systems manufactured after 2012 use UEFI.",multi:false},
{num:66,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"What does OS stand for?",choices:["Output System","Online Service","Operating System","Optical Storage"],answer:2,explain:"<strong>OS</strong> stands for Operating System. It is the software that manages computer hardware and software resources and provides common services for applications. Examples include Windows, macOS, Linux, Android, and iOS.",multi:false},
{num:67,source:"Messer",ref:"Acronym",obj:"Obj 1.7",q:"What does RSR stand for in the context of Apple operating systems?",choices:["Remote System Restore","Rapid Security Response","Registry System Reset","Redundant Storage Repair"],answer:1,explain:"<strong>RSR</strong> stands for Rapid Security Response. It is Apple's mechanism for delivering critical security patches to macOS and iOS devices quickly between major OS updates without requiring a full system update. It is exclusive to Apple platforms.",multi:false},
{num:68,source:"Messer",ref:"Acronym",obj:"Obj 1.9",q:"What does GUI stand for?",choices:["Global User Interface","Graphical User Interface","General Utility Input","Guided Update Installer"],answer:1,explain:"<strong>GUI</strong> stands for Graphical User Interface. It is the visual interface that allows users to interact with a computer using windows, icons, and menus rather than text commands. Windows, macOS, and most modern operating systems provide a GUI.",multi:false},
{num:69,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"What does exFAT stand for?",choices:["Extended File Access Table","Extensible File Allocation Table","External Format and Transfer","Extended File Allocation Table"],answer:3,explain:"<strong>exFAT</strong> stands for Extended File Allocation Table. It is a modern cross-platform file system designed for flash drives and external storage. It overcomes FAT32's 4GB file size limit while maintaining compatibility with Windows and macOS.",multi:false},
{num:70,source:"Messer",ref:"Acronym",obj:"Obj 1.1",q:"What does XFS stand for?",choices:["Extended File System","External Format Storage","eXclusive File Service","eXtra Format Specification"],answer:0,explain:"<strong>XFS</strong> stands for Extended File System. It is a high-performance journaling file system originally developed by SGI and now used primarily in Linux and Unix environments. It is particularly efficient for large files and high I/O workloads.",multi:false},
{num:71,source:"Messer",ref:"Acronym",obj:"Obj 1.10",q:"What does MDM stand for?",choices:["Mobile Data Management","Multiple Device Monitor","Mobile Device Management","Managed Deployment Module"],answer:2,explain:"<strong>MDM</strong> stands for Mobile Device Management. It is a platform used by organizations to manage, monitor, and enforce security policies on mobile devices such as smartphones and tablets. MDM can control app installation, enforce encryption, and remotely wipe devices.",multi:false}
];

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;}

// Shuffle questions and also shuffle answer choices
function prepareQuestions(qs){
  const shuffled=shuffle([...qs]);
  return shuffled.map(q=>{
    const indices=[...Array(q.choices.length).keys()];
    shuffle(indices);
    const newChoices=indices.map(i=>q.choices[i]);
    const newAnswer=indices.indexOf(q.answer);
    return {...q,choices:newChoices,answer:newAnswer};
  });
}

let prepared=prepareQuestions(questions);
const total=prepared.length;
let correct=0,wrong=0,answered=0;

function updateScore(){
  document.getElementById('sc').textContent=correct;
  document.getElementById('sw').textContent=wrong;
  document.getElementById('sr').textContent=total-answered;
  const pct=answered>0?Math.round((correct/answered)*100):0;
  document.getElementById('sp').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=(answered/total*100)+'%';
  if(answered===total)showFinal();
}

function showFinal(){
  const pct=Math.round((correct/total)*100);
  const banner=document.getElementById('final-banner');
  const inner=document.getElementById('final-inner');
  banner.style.display='block';
  inner.style.background=pct>=78?'#00e87a':'#ff3b5c';
  inner.style.border='2px solid '+(pct>=78?'#00e87a':'#ff3b5c');
  document.getElementById('final-title').textContent='Final Score: '+pct+'%';
  document.getElementById('final-score').textContent=correct+' correct out of '+total+' — '+(pct>=78?'PASS ✓':'FAIL ✗');
  banner.scrollIntoView({behavior:'smooth'});
}

function retake(){
  correct=0;wrong=0;answered=0;
  prepared=prepareQuestions(questions);
  document.getElementById('final-banner').style.display='none';
  document.getElementById('container').innerHTML='';
  buildQuiz();
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildQuiz(){
  const container=document.getElementById('container');
  prepared.forEach((q,idx)=>{
    const card=document.createElement('div');
    card.className='card';
    const srcBadge=q.source==='Messer'
      ?'<span class="badge-messer">Messer</span>'
      :'<span class="badge-dion">Dion</span>';
    const refLabel=q.ref==='Acronym'?'Acronym':q.ref;
    card.innerHTML=`
      <div class="card-header">
        <span class="q-badge">Q${idx+1}</span>
        <div class="meta">${srcBadge}<span class="ref-code">${refLabel}</span><span class="obj-tag">${q.obj}</span></div>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="choices" id="choices-${idx}">
        ${q.choices.map((c,ci)=>`<button class="choice-btn" onclick="selectAnswer(${idx},${ci})">${String.fromCharCode(65+ci)}. ${c}</button>`).join('')}
      </div>
      <div class="result-badge" id="result-${idx}"></div>
      <div class="explain-pane" id="explain-${idx}">${q.explain}</div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(idx,chosen){
  const q=prepared[idx];
  const btns=document.getElementById('choices-'+idx).querySelectorAll('.choice-btn');
  btns.forEach((btn,bi)=>{
    btn.classList.add('locked');
    if(bi===q.answer){btn.classList.add('correct');}
    else if(bi===chosen&&chosen!==q.answer){btn.classList.add('wrong-selected');}
    else{btn.classList.add('unchosen');}
  });
  const isCorrect=chosen===q.answer;
  const resultEl=document.getElementById('result-'+idx);
  resultEl.className='result-badge show';
  resultEl.innerHTML=isCorrect
    ?'<span class="result-correct">✓ Correct!</span>'
    :`<span class="result-wrong">✗ Wrong — Answer: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</span>`;
  document.getElementById('explain-'+idx).classList.add('show');
  isCorrect?correct++:wrong++;
  answered++;
  updateScore();
}

buildQuiz();
updateScore();
</script>
