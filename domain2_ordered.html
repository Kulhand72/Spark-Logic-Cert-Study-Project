<script>
const questions=[
// Obj 2.1 Security Measures
{num:1,source:"Messer",ref:"A9",obj:"Obj 2.1",q:"A system administrator has required the use of FRT for authentication on all laptops, mobile phones, and tablets. Which of the following will be required to meet this requirement?",choices:["Fingerprint reader","Badge reader","Token generator","Integrated camera"],answer:3,explain:"<strong>FRT</strong> (Facial Recognition Technology) requires a camera to capture and analyze facial features for authentication. A fingerprint reader is used for fingerprint biometrics. A badge reader reads physical access cards. A token generator produces one-time passwords.",multi:false},
{num:2,source:"Messer",ref:"A35",obj:"Obj 2.1",q:"When making configuration changes, a technician is assigned a temporary administrator password to use for the duration of the update. Once the administrator credentials are used, they are automatically deleted. Which of the following would best describe this process?",choices:["Single sign-on","Data loss prevention","User Access Console","Just-in-time access"],answer:3,explain:"<strong>Just-in-time access</strong> grants temporary elevated credentials that are automatically revoked after use, minimizing the privilege exposure window. Single sign-on allows one login across systems. Data loss prevention monitors data movement. User Access Console is not a standard term.",multi:false},
{num:3,source:"Messer",ref:"A36",obj:"Obj 2.1",q:"A user has been provided with a username and password for accessing the corporate VPN. The user has also been provided with a hardware device displaying a six digit code, and the code changes every 30 seconds. Which of the following would best describe the use of this device?",choices:["ACL","Group Policy","SMS","Least privilege","MFA"],answer:4,explain:"A hardware token generating a rotating time-based code combined with a password is a form of <strong>MFA</strong> (Multi-Factor Authentication). The token provides a second factor — something you have — in addition to the password. ACL and Group Policy are access control mechanisms, not authentication factors.",multi:false},
{num:4,source:"Messer",ref:"A82",obj:"Obj 2.1",q:"An employee at a company is responsible for determining the correct access controls for each user, manage the authentication process, and track all access to network resources. Which of the following would best describe this employee's job function?",choices:["PAM","DLP","MDM","IAM"],answer:3,explain:"<strong>IAM</strong> (Identity Access Management) covers managing user identities, authentication, access controls, and auditing of resource access. PAM focuses specifically on privileged accounts. DLP monitors data movement. MDM manages mobile devices.",multi:false},
{num:5,source:"Messer",ref:"B45",obj:"Obj 2.1",q:"The employees of a company have direct access to applications and databases from their desktop computers. If the employees are using the company wireless network or the conference room, connectivity is only available after authenticating through a VPN. Which of the following would best describe this policy?",choices:["Multifactor authentication","Group Policy","Least privilege","Zero trust"],answer:3,explain:"<strong>Zero trust</strong> requires all users to authenticate regardless of network location, never implicitly trusting any connection even from within the office. MFA is an authentication method. Group Policy enforces settings. Least privilege limits access scope.",multi:false},
{num:6,source:"Messer",ref:"C29",obj:"Obj 2.1",q:"Users on the corporate network authenticate once at the beginning of the day, and are not prompted again for authentication until the following day. Which of the following would BEST describe this functionality?",choices:["NTFS","SSO","Inherited permissions","EFS"],answer:1,explain:"<strong>SSO</strong> (Single Sign-On) allows a user to authenticate once and access all authorized resources without repeated prompts throughout the day. NTFS is a file system. Inherited permissions are a Windows access control concept. EFS encrypts individual files and folders.",multi:false},
{num:7,source:"Messer",ref:"C43",obj:"Obj 2.1",q:"A user in the shipping department is able to view order information, but they cannot modify or delete any order details. Which of the following would best describe this security principle?",choices:["Multi-factor authentication","Least privilege","Group Policy","Organizational Units"],answer:1,explain:"<strong>Least privilege</strong> grants users only the minimum access needed to perform their job, nothing more. The shipping user can view but not modify, which is exactly what their role requires. MFA is an authentication method. Group Policy enforces settings. Organizational Units organize AD objects.",multi:false},
{num:8,source:"Messer",ref:"B62",obj:"Obj 2.1",q:"A company is deploying a new set of laptops for field service technicians who travel and work at customer locations. The IT department has been asked to create a secure authentication factor for a minimal cost. Which of the following would be the best choice for this security requirement?",choices:["Retina scanner","TOTP app","Keyfob","Magnetometer"],answer:1,explain:"A <strong>TOTP app</strong> (Time-based One-Time Password authenticator application) provides strong MFA at no additional hardware cost, requiring only the technician's smartphone. Retina scanners require expensive hardware. Keyfobs have a per-unit cost. Magnetometers are physical security screening devices.",multi:false},
{num:9,source:"Messer",ref:"B61",obj:"Obj 2.1",q:"A data center manager is installing a new access door which will require multi-factor authentication. Which of the following should be used to meet this requirement? (Select TWO)",choices:["Cabinet locks","Key fobs","Privacy filter","Palmprint scanner","USB lock","Cable lock"],answer:[1,3],explain:"A <strong>key fob</strong> (something you have) and <strong>palmprint scanner</strong> (something you are) together satisfy two different MFA factor types. Cabinet locks, privacy filters, USB locks, and cable locks are physical security devices but do not constitute authentication factors.",multi:true},
{num:10,source:"Messer",ref:"B65",obj:"Obj 2.1",q:"A network administrator is installing a set of upgraded Internet routers in the data center. Which of the following would be the best choices to secure the access to the internal data center door? (Select TWO)",choices:["Biometric lock","ACL","Bollard","Additional lighting","Motion sensor","Access control vestibule"],answer:[0,5],explain:"A <strong>biometric lock</strong> and <strong>access control vestibule</strong> (mantrap) provide layered physical security for high-security data center entry points. ACLs are logical controls. Bollards stop vehicles. Lighting and motion sensors are deterrents but do not control door access.",multi:true},
{num:11,source:"Messer",ref:"C79",obj:"Obj 2.1",q:"A healthcare administrator stores sensitive data on his laptop computer. His desk is in an open area near a busy hallway. Which of the following would add additional security to the administrator's work area?",choices:["Door lock","Fingerprint scanner","Magnetometer","Bollards"],answer:1,explain:"A <strong>fingerprint scanner</strong> adds biometric authentication, preventing unauthorized access to the laptop even in an open area. A door lock secures a room but not a specific device. A magnetometer screens for weapons. Bollards stop vehicles, not people.",multi:false},
// Obj 2.2 Windows OS Security
{num:12,source:"Messer",ref:"A13",obj:"Obj 2.2",q:"Which of these Windows features provides full disk encryption for all data on a storage drive?",choices:["Domain Services","EFS","RDP","BitLocker"],answer:3,explain:"<strong>BitLocker</strong> is Windows' built-in full disk encryption feature that protects all data on a storage drive. EFS encrypts individual files and folders, not entire drives. RDP is a remote access protocol. Domain Services is an Active Directory role.",multi:false},
{num:13,source:"Messer",ref:"B41",obj:"Obj 2.2",q:"A user would like to encrypt a small group of files in a shared folder without modifying other files on the drive. Which of the following would be the best way to accomplish this?",choices:["EFS","Save the files with Administrator rights","BitLocker","Save the files with a dollar sign at the end of the filename"],answer:0,explain:"<strong>EFS</strong> (Encrypting File System) encrypts individual files and folders without requiring full disk encryption. BitLocker encrypts the entire drive. Saving with Administrator rights does not encrypt. The dollar sign creates a hidden share, not encryption.",multi:false},
{num:14,source:"Messer",ref:"A89",obj:"Obj 2.2",q:"A company is deploying laptops to all of their field sales teams. The company is concerned about protecting the security of data if the laptop is stolen or misplaced. Which of the following would be the best way to address this concern?",choices:["Multifactor authentication","Strong password policies","Unique device certificates","Data-at-rest encryption"],answer:3,explain:"<strong>Data-at-rest encryption</strong> (such as BitLocker) protects stored data on a stolen or lost device by making it unreadable without the decryption key. MFA and strong passwords can be bypassed if someone removes the drive. Certificates authenticate devices, not protect stored data.",multi:false},
{num:15,source:"Messer",ref:"A71",obj:"Obj 2.2",q:"A technician is troubleshooting a computer infected with a virus. The user thought they were opening a spreadsheet, but the file was actually a virus executable. Which of the following Windows options were most likely associated with this issue?",choices:["Always show icons, never thumbnails","Display the full path in the title bar","Always show menus","Hide extensions for known file types"],answer:3,explain:"<strong>Hide extensions for known file types</strong> causes a file like invoice.xlsx.exe to appear as invoice.xlsx, tricking users into executing malware. The other options affect display preferences but do not hide the true nature of a file's type from the user.",multi:false},
{num:16,source:"Messer",ref:"B30",obj:"Obj 2.2",q:"A manufacturing company performs a third-party audit of their accounting records each year. The auditors use laptops provided by the company to access internal resources. When the audit is complete, the auditors should be prevented from logging on until the following audit process begins. Which of the following would be the best way to accomplish this?",choices:["Uninstall the audit software","Assign an expiration date to the auditor accounts","Remove the auditor accounts from all Windows groups","Require two-factor authentication for the auditor accounts"],answer:1,explain:"<strong>Account expiration dates</strong> automatically disable access after a defined date without requiring manual account management each year. Removing from groups requires manual tracking. Uninstalling software doesn't prevent login. 2FA adds security but doesn't disable the account.",multi:false},
{num:17,source:"Messer",ref:"A84",obj:"Obj 2.2",q:"A business partner in a different country needs to access an internal company server during the very early morning hours. The internal firewall will limit the partner's access to this single server. Which of these would be the most important security task to perform on this server?",choices:["Restrict log-in times for the partner account","Remove the server from the Active Directory domain","Use only 64-bit applications","Run a weekly anti-virus scan"],answer:0,explain:"<strong>Restricting login times</strong> limits when the account can authenticate, reducing the attack window to only approved hours. Removing from the domain would break access controls. 64-bit applications and antivirus scans do not restrict when an account can log in.",multi:false},
// Obj 2.3 Wireless Security
{num:18,source:"Messer",ref:"A72",obj:"Obj 2.3",q:"A financial management company would like to ensure mobile users are configured with the highest level of wireless encryption while working in the office. They would also like to include an additional user verification step during the login process. Which of the following would provide this functionality? (Choose TWO)",choices:["RADIUS","UPnP","Multi-factor authentication","TKIP","TACACS","Kerberos","WPA3"],answer:[2,6],explain:"<strong>WPA3</strong> provides the highest wireless encryption standard available, and <strong>MFA</strong> adds a required second verification step at login. RADIUS and TACACS are authentication server protocols. TKIP is an older, weaker encryption protocol used with WPA. UPnP is a network discovery protocol.",multi:true},
{num:19,source:"Messer",ref:"B21",obj:"Obj 2.3",q:"A security administrator is installing a new VPN connection for remote users. The administrator would like all users to authenticate with their Windows Active Directory credentials. Which of the following technologies would provide this functionality?",choices:["RADIUS","WPA3","TKIP","AES"],answer:0,explain:"<strong>RADIUS</strong> integrates with Active Directory to provide centralized authentication for VPN and network access services. WPA3 is a wireless encryption protocol. TKIP and AES are encryption algorithms, not authentication frameworks.",multi:false},
{num:20,source:"Messer",ref:"C47",obj:"Obj 2.3",q:"A network administrator has modified all wireless access points to use WPA3 instead of WPA2. Which of the following would be a reason for this change?",choices:["Additional frequency choices","Lower power consumption","Larger usable range","Stronger encryption"],answer:3,explain:"<strong>WPA3</strong> uses stronger encryption algorithms and improved key exchange protocols (SAE replacing PSK) compared to WPA2. It does not add new frequency bands, reduce power consumption, or increase wireless range. Security is the sole motivation for the upgrade.",multi:false},
// Obj 2.4 Malware
{num:21,source:"Messer",ref:"A26",obj:"Obj 2.4",q:"A security technician has identified malware running in the OS kernel. Traditional anti-malware scans were not able to identify any problems on the computer. Which of the following would be the best description of this malware?",choices:["Rootkit","Worm","Botnet","Cryptominer"],answer:0,explain:"A <strong>rootkit</strong> embeds itself in the OS kernel to hide from standard security scans while maintaining persistent unauthorized access. A worm self-replicates across networks. A botnet is a network of infected machines. A cryptominer uses CPU resources for cryptocurrency mining.",multi:false},
{num:22,source:"Messer",ref:"A32",obj:"Obj 2.4",q:"An internal audit has found a server in the DMZ which appears to be infected with malware. The malware does not appear to be part of a file in the OS, and the malware runs each time the system is started. What type of malware would be most likely found on this server?",choices:["Trojan","Ransomware","Keylogger","Spyware","Boot sector virus"],answer:4,explain:"A <strong>boot sector virus</strong> infects the master boot record rather than OS files, executing at every startup before the OS loads. This explains why it is not detected as a file-based threat. Trojans, ransomware, keyloggers, and spyware are file-based and would appear in OS scans.",multi:false},
{num:23,source:"Messer",ref:"A62",obj:"Obj 2.4",q:"A user has opened a help desk ticket relating to desktop alerts randomly appearing throughout the day. Most of the alerts contain information about third-party products and services. Which of the following is the most likely cause of these messages?",choices:["On-path attack","Corrupted email database","OS update failure","Adware"],answer:3,explain:"<strong>Adware</strong> generates unsolicited advertisements and pop-up alerts, typically promoting third-party products. An on-path attack intercepts communications. A corrupted email database would cause mail issues, not random desktop alerts. OS update failures produce error messages, not advertisements.",multi:false},
{num:24,source:"Messer",ref:"C27",obj:"Obj 2.4",q:"A user has started their computer and received this message on the screen: \"Your important files are encrypted. If you want to decrypt all of your files, you need to pay.\" A desktop administrator has confirmed the user can no longer access his desktop, and none of his installed applications are available in the system menus. The user also notices a payment link is posted at the bottom of the screen. Which of the following would best describe this scenario?",choices:["Spyware","Boot sector virus","Rootkit","Ransomware"],answer:3,explain:"<strong>Ransomware</strong> encrypts victim files and demands payment for the decryption key, locking users out of their system. Spyware secretly collects data without locking the system. A boot sector virus executes at startup but does not typically encrypt files. A rootkit hides in the kernel.",multi:false},
{num:25,source:"Messer",ref:"B86",obj:"Obj 2.4",q:"A user has downloaded a browser add-on which assists with new car purchases. During the installation, the Windows UAC is requesting permissions to continue with the install. Which of these is most likely?",choices:["The operating system requires an update","The software is a Trojan horse","The workstation is already part of a botnet","A worm will be downloaded and installed"],answer:1,explain:"A <strong>Trojan horse</strong> disguises itself as legitimate software (a car purchase add-on) while requesting elevated permissions to install malicious components. Worms self-replicate without user interaction. Botnets are existing infections. An OS update request comes from Windows Update, not a browser add-on.",multi:false},
// Obj 2.5 Social Engineering
{num:26,source:"Messer",ref:"A21",obj:"Obj 2.5",q:"An attacker is using every combination of letters, numbers, and special characters in an attempt to discover a user's password. Which of the following would describe this attack type?",choices:["Spoofing","Social engineering","Brute force attack","DDoS"],answer:2,explain:"A <strong>brute force attack</strong> tries every possible character combination systematically until the correct password is found. Spoofing fakes an identity or address. Social engineering manipulates people psychologically. DDoS floods a system with traffic to make it unavailable.",multi:false},
{num:27,source:"Messer",ref:"A30",obj:"Obj 2.5",q:"A security guard has reported a person passing through a secure door without using a door badge. The intruder slipped through the door by closely following the person in front of them. Which of these would best describe these actions?",choices:["Dumpster diving","Brute force","Phishing","Tailgating"],answer:3,explain:"<strong>Tailgating</strong> is a physical security attack where an unauthorized person follows an authorized person through a secured entry without using their own credentials. Dumpster diving retrieves discarded information. Brute force cracks passwords. Phishing uses deceptive communications.",multi:false},
{num:28,source:"Messer",ref:"A90",obj:"Obj 2.5",q:"A company has discovered a recent data breach, and this breach appears to have originated through a vulnerability introduced with a software upgrade. The vulnerability was added by the attacker at the source and distributed to all customers who performed the upgrade. Which of the following would best describe this attack type?",choices:["Supply chain attack","Insider threat","Business email compromise","On-path attack"],answer:0,explain:"A <strong>supply chain attack</strong> compromises software at the source before distribution, affecting all customers who install the update. An insider threat comes from within the organization. Business email compromise targets email communications. An on-path attack intercepts network communications.",multi:false},
{num:29,source:"Messer",ref:"B39",obj:"Obj 2.5",q:"A user in the shipping department has received a call from someone claiming to be from the IT Help Desk. The caller asks the user to disclose their location, employee ID, and login credentials. Which of the following would describe this situation?",choices:["Denial of service","Social engineering","Brute force","Shoulder surfing"],answer:1,explain:"<strong>Social engineering</strong> (specifically impersonation) manipulates people into revealing sensitive information by pretending to be a trusted authority. DoS attacks overwhelm systems. Brute force cracks passwords computationally. Shoulder surfing involves physically observing someone entering credentials.",multi:false},
{num:30,source:"Messer",ref:"B67",obj:"Obj 2.5",q:"Four users in the accounting department have received similar emails asking for payment of an outstanding invoice and a link to a third-party payment site. The emails contains purchase information which appears to be correct, but additional research shows the invoice numbers are not valid. Which of the following would best describe this attack type?",choices:["Spear phishing","Denial of service","Shoulder surfing","Evil twin"],answer:0,explain:"<strong>Spear phishing</strong> targets a specific group (accounting department) with personalized, convincing content to manipulate them into fraudulent action. A DoS attack overwhelms systems. Shoulder surfing is physical observation. An evil twin is a rogue wireless access point.",multi:false},
{num:31,source:"Messer",ref:"C19",obj:"Obj 2.5",q:"An attacker has gained access to a password hash file. Which of the following will the attacker use to obtain the passwords?",choices:["DoS","Decryption","Brute force","Phishing"],answer:2,explain:"Attackers hash guessed passwords and compare them against stolen hashes using <strong>brute force</strong> until a match is found. DoS attacks overwhelm systems. Password hashes cannot be decrypted directly — they must be matched. Phishing tricks users into revealing passwords, not cracking hash files.",multi:false},
{num:32,source:"Messer",ref:"C90",obj:"Obj 2.5",q:"Which of the following would allow someone else in the room to maliciously obtain a username and password?",choices:["Spoofing","Tailgating","DoS","Shoulder surfing"],answer:3,explain:"<strong>Shoulder surfing</strong> involves directly observing someone entering credentials by looking over their shoulder or watching a screen. Spoofing fakes an identity or address. Tailgating bypasses physical access controls. DoS overwhelms systems with traffic.",multi:false},
// Obj 2.6 Malware Removal
{num:33,source:"Messer",ref:"A75",obj:"Obj 2.6",q:"A technician has been tasked with removing malware on a training room laptop. After updating the anti-virus software and removing the malware, the technician creates a backup of the system. After the training class ends, the technician is notified the malware has returned. Which of the following steps was missed and caused the system to be infected again?",choices:["Boot to a pre-installation environment","Identify malware symptoms","Disable System Restore before removal","Update to the latest BIOS version"],answer:2,explain:"If <strong>System Restore is not disabled</strong> before removal, Windows can restore the malware from an infected restore point causing re-infection. Booting to a pre-install environment and identifying symptoms are earlier steps. BIOS updates are unrelated to malware removal.",multi:false},
{num:34,source:"Messer",ref:"A81",obj:"Obj 2.6",q:"A user has opened a help desk ticket for application slowdowns and unwanted pop-up windows. A technician updates the anti-virus software, scans the computer, and removes the malware. The technician then schedules future scans and creates a new restore point. Which of the following should be the next step in the removal process?",choices:["Disable System Restore","Update the anti-virus signatures","Quarantine the system","Educate the end user"],answer:3,explain:"After completing all technical removal steps, <strong>educating the end user</strong> on safe practices is the final step in the malware removal process. System Restore and antivirus signatures should have been handled earlier. The system has already been cleaned so quarantine is no longer needed.",multi:false},
{num:35,source:"Messer",ref:"B63",obj:"Obj 2.6",q:"An administrator has identified and removed malware on a corporate desktop computer. Which of the following malware removal steps should be performed next?",choices:["Disconnect the computer from the corporate network","Educate the end-user","Schedule periodic anti-virus scans","Disable System Restore"],answer:2,explain:"<strong>Scheduling periodic anti-virus scans</strong> is step 8 in the malware removal process, ensuring ongoing protection after remediation. Disconnecting from the network (quarantine) happens at the beginning. Disabling System Restore happens before removal. Educating the user is the final step.",multi:false},
{num:36,source:"Messer",ref:"C22",obj:"Obj 2.6",q:"A desktop administrator is removing a virus from a laptop computer in a shared lab. The computer has been removed from the network and the System Restore feature has been disabled. When the administrator attempts to update to the latest anti-virus signatures, the anti-virus utility disables itself. Which of the following would be the best next step?",choices:["Boot to Safe Mode and use signatures downloaded from a separate computer","Roll back to a previous configuration","Schedule periodic updates and reconnect to the network","Discuss anti-virus strategies with the end user"],answer:0,explain:"<strong>Booting to Safe Mode</strong> prevents malware from loading and allows scanning with externally obtained signatures when the malware disables antivirus tools in normal mode. Rolling back would restore an infected restore point. Reconnecting exposes the infected system to the network.",multi:false},
{num:37,source:"Messer",ref:"C36",obj:"Obj 2.6",q:"A desktop administrator has been tasked with removing malware from an executive's laptop computer. The system has been removed from the network, but the Windows startup process now shows a Stop Error and reboots into a repeating cycle. Which of the following would be the best next step in the malware removal process?",choices:["Perform a Windows Repair installation","Boot with a pre-installation environment","Schedule periodic scans","Create a restore point"],answer:1,explain:"When malware prevents normal Windows startup, <strong>booting with a preinstallation environment</strong> allows access for scanning and removal outside of the infected OS. A repair installation may reintroduce malware. Scheduling scans and creating restore points are later steps.",multi:false},
// Obj 2.7 Workstation Security
{num:38,source:"Messer",ref:"A46",obj:"Obj 2.7",q:"A user purchased a copy of home tax software and has installed it on their company computer. This morning, the user logs in and finds the tax software has been automatically removed from the system. Which of the following would be the most likely reason for this result?",choices:["The company per-seat licenses are all in use","The software uses an open-source license","The user has installed a personal license","The software requires a USB key for DRM"],answer:2,explain:"Corporate MDM or software management policies typically detect and remove <strong>personally licensed software</strong> installed on company devices. Per-seat limits would simply prevent activation. Open-source software is generally permitted. DRM USB keys would block the software from running, not remove it.",multi:false},
{num:39,source:"Messer",ref:"C74",obj:"Obj 2.7",q:"A system administrator is installing a file server into the corporate data center. Which of the following would be the best way to improve security of the file sharing service? (Select TWO)",choices:["Enable a BIOS user password","Connect the server to a wireless network","Limit the number of concurrent connections","Disable guest account","Enable file storage quotas","Enable password complexity"],answer:[3,5],explain:"<strong>Disabling the guest account</strong> prevents anonymous access, and <strong>enabling password complexity</strong> strengthens authentication against brute-force attacks. A BIOS password protects local access but not network file sharing. Wireless connectivity and quotas do not directly improve authentication security.",multi:true},
{num:40,source:"Messer",ref:"B90",obj:"Obj 2.7",q:"Which of these would be the best way to prevent an attacker from modifying default routes on a SOHO wireless network?",choices:["Configure MAC address filtering","Enable WPS connectivity","Change the router's default password","Disable unneeded interfaces"],answer:2,explain:"<strong>Changing the router's default password</strong> prevents attackers from using publicly known default credentials to access the router admin panel and modify settings. MAC filtering can be spoofed. WPS is a security vulnerability. Disabling interfaces reduces attack surface but does not protect the admin panel.",multi:false},
{num:41,source:"Messer",ref:"C33",obj:"Obj 2.7",q:"A medical center's hospital staff uses shared computer systems installed in hallways and patient rooms. However, hospital administrators are concerned patient information might be visible if someone leaves the computer without logging out. Which of the following would help prevent this type of issue?",choices:["Multi-factor authentication","Password expiration policy","Login time restrictions","Screensaver passwords"],answer:3,explain:"A <strong>screensaver password</strong> automatically locks the workstation after inactivity, preventing unauthorized access to patient data on shared systems. MFA secures the login process but does not auto-lock. Password expiration and login time restrictions do not prevent an unlocked session from being viewed.",multi:false},
// Obj 2.8 Mobile Security
{num:42,source:"Messer",ref:"A8",obj:"Obj 2.8",q:"A user in the accounting department is trying to install an app on their new corporate mobile phone, but the installation fails each time. Which of the following would be the most likely reason for this issue?",choices:["Incorrect file system type","MDM policy restriction","Slow CPU speeds","Low battery level"],answer:1,explain:"<strong>MDM</strong> (Mobile Device Management) policies on corporate devices commonly restrict unauthorized app installations. File system type is not relevant to app installation. CPU speed and battery level would cause slowness or shutdown, not installation failures.",multi:false},
{num:43,source:"Messer",ref:"A15",obj:"Obj 2.8",q:"A user in the accounting department would like to ensure their mobile device data is always available. If the user's smartphone is damaged or stolen, they would like to replace the device and restore all data as quickly as possible. Which of the following would provide this functionality?",choices:["Full device encryption","Remote backup","IoT isolation","Remote wipe"],answer:1,explain:"<strong>Remote backup</strong> stores device data to the cloud, enabling quick restoration to a new device after loss or damage. Full device encryption protects data but does not enable restoration to a new device. Remote wipe erases data. IoT isolation is a network segmentation concept.",multi:false},
{num:44,source:"Messer",ref:"A34",obj:"Obj 2.8",q:"A user in the finance department has purchased a new Android smartphone and has installed a number of productivity apps. After a day of use, the phone is displaying a large number of advertisements when browsing the Internet. Which of the following tasks should the user perform after completing a factory reset?",choices:["Disable Bluetooth","Check app sharing permissions","Run a speed test on the cellular connection","Verify the source of each app before installation"],answer:3,explain:"<strong>Verifying the source of each app</strong> before installation prevents future adware infections. Adware typically enters via apps from unofficial or untrustworthy sources. Disabling Bluetooth, running speed tests, and checking sharing permissions do not prevent adware from unofficial app sources.",multi:false},
{num:45,source:"Messer",ref:"B88",obj:"Obj 2.8",q:"A system administrator needs a way to deploy new smartphone configurations across four different user groups. Each group will require a different set of email and security configurations. Which of the following would be the best way to setup these smartphones?",choices:["Assign configuration profiles for each group","Restore all smartphones from cloud backups","Provide customized instructions for each user","Assign separate support teams for each group"],answer:0,explain:"<strong>MDM configuration profiles</strong> allow administrators to push different email and security settings to specific user groups automatically and consistently. Cloud backups restore data, not configurations. Manual instructions are error-prone. Separate support teams are operationally inefficient.",multi:false},
{num:46,source:"Messer",ref:"C63",obj:"Obj 2.8",q:"A user's smartphone contains company confidential information which should not be shared outside of the organization. Which of the following would be the best way to limit access to this data if the smartphone was lost or stolen?",choices:["Locator application","Remote wipe","Authenticator app","Cloud backup"],answer:1,explain:"A <strong>remote wipe</strong> erases all data on a lost or stolen device, preventing unauthorized access to company confidential information. A locator app helps find the device but does not erase data. An authenticator app provides MFA. A cloud backup stores data off-device but does not protect the device itself.",multi:false},
// Obj 2.9 Data Destruction
{num:47,source:"Messer",ref:"A39",obj:"Obj 2.9",q:"A technician is dismantling a test lab for a recently completed project, and the lab manager would like to use the existing computers on a new project. However, the security administrator would like to ensure none of the data from the previous project is accessible on the existing hard drives. Which of the following would be the best way to accomplish this?",choices:["Quick format","Degauss","Regular format","Reinstall the operating system"],answer:2,explain:"A <strong>regular format</strong> overwrites the file system and makes previous data inaccessible while keeping the drive functional for reuse on the new project. A quick format only removes pointers, leaving data recoverable. Degaussing destroys the drive. Reinstalling the OS does not securely wipe user data.",multi:false},
{num:48,source:"Messer",ref:"A56",obj:"Obj 2.9",q:"A healthcare company has replaced some of their desktop computers with laptops and will be disposing of the older computers. The security administrator would like to guarantee none of the existing data on the hard drives could be recovered once the systems are sent to the recycling center. Which of the following methods would meet this requirement?",choices:["Quick format","Reinstall the OS","Remove all user folders","Shred the drives"],answer:3,explain:"<strong>Physical shredding</strong> of drives is the only method that guarantees data cannot be recovered, meeting the highest security disposal requirement. Quick format leaves data recoverable. Reinstalling the OS does not wipe all data. Removing user folders leaves other system and application data intact.",multi:false},
{num:49,source:"Messer",ref:"C76",obj:"Obj 2.9",q:"A financial services company is upgrading the storage drives in their SAN and need to dispose of one hundred older storage drives. The security administrator would like to permanently disable the drive and guarantee the data on the drives could not be recovered. Which of the following methods would be the best way to accomplish this goal?",choices:["Standard format","Full disk encryption","Shredder","Delete the master boot record"],answer:2,explain:"A <strong>shredder</strong> physically destroys drives, permanently preventing any data recovery. Standard format overwrites the file system but is recoverable with forensic tools. Full disk encryption protects data but does not destroy it. Deleting the MBR prevents booting but does not destroy the data on the drive.",multi:false},
{num:50,source:"Messer",ref:"C85",obj:"Obj 2.9",q:"A company is donating ten laptop computers to a local community center. Which of the following processes should be followed before making this donation?",choices:["Inventory management","Acceptable use policy","Password policy","Knowledge base article"],answer:0,explain:"<strong>Inventory management</strong> ensures donated assets are properly tracked, decommissioned, and wiped before leaving the organization. An AUP governs employee behavior. Password policies define authentication requirements. A knowledge base article documents procedures but is not a required process step before donation.",multi:false},
// Obj 2.10 SOHO Network Security
{num:51,source:"Messer",ref:"A43",obj:"Obj 2.10",q:"A security administrator is concerned a bad actor may use packet analysis to determine a list of web sites visited by their users. Which of the following would prevent this type of reconnaissance?",choices:["Enable full disk encryption","Login with multifactor authentication","Use a secure DNS","Configure the BIOS for Secure Boot"],answer:2,explain:"<strong>Secure DNS</strong> (DNS over HTTPS or DNS over TLS) encrypts DNS queries, preventing packet analysis from revealing visited websites. Full disk encryption protects stored data, not network traffic. MFA secures authentication. Secure Boot validates the OS loader, not DNS queries.",multi:false},
{num:52,source:"Messer",ref:"A87",obj:"Obj 2.10",q:"A network administrator is configuring a wireless network at a small office. The administrator would like to allow wireless access for all computers but exclude a single kiosk in the lobby. Which of the following configuration settings would meet this requirement?",choices:["SSID suppression","Content filtering","Secure management access","DHCP reservation","IP filtering"],answer:4,explain:"<strong>IP filtering</strong> allows the administrator to block a specific IP address assigned to the kiosk from accessing the wireless network. SSID suppression hides the network name. Content filtering blocks specific content types. DHCP reservation assigns a fixed IP, which when combined with IP filtering achieves the goal — but IP filtering is the direct answer.",multi:false},
{num:53,source:"Messer",ref:"B27",obj:"Obj 2.10",q:"A local coffee shop has a public wireless network for customers and a private wireless network for company devices. The shop owner wants to be sure customers can never connect to the company network. Which of the following should be configured on this network?",choices:["Install a new access point for company devices","Configure WPA3 on the company network","Require static IP addresses on the customer network","Assign MAC filters to the company network","Use a firewall between the customer and corporate network"],answer:1,explain:"<strong>WPA3</strong> encryption with a strong passphrase on the company network prevents unauthorized customers from connecting. MAC filtering can be spoofed. Static IPs on the customer network do not protect the company network. A separate AP does not inherently secure the company network.",multi:false},
{num:54,source:"Messer",ref:"C45",obj:"Obj 2.10",q:"A small company is located in a large office building shared by fifty different companies. A network administrator would like to limit the possibility of someone else in the building accidentally connecting to their wireless network. Which of these configuration settings would prevent their wireless network from appearing in a list of available networks?",choices:["MAC filtering","Static IP addressing","WPA3 encryption","SSID suppression"],answer:3,explain:"<strong>SSID suppression</strong> (disabling SSID broadcast) hides the network name from appearing in available network lists. MAC filtering restricts who can connect but does not hide the network. Static IPs are address assignments. WPA3 encrypts connections but the network name still appears.",multi:false},
// Obj 2.11 Browser Security
{num:55,source:"Messer",ref:"A11",obj:"Obj 2.11",q:"After a user authenticates to a web site, the browser performs very slowly and some of the items on the page will not properly display. Which of the following would be the best way to resolve this issue?",choices:["Disable browser notifications","Update the web server certificate","Update the system BIOS","Clear the browser cache"],answer:3,explain:"A <strong>corrupted or oversized browser cache</strong> can cause slow page loads and display issues; clearing it resolves these symptoms. Browser notifications cause pop-ups, not slow rendering. Web server certificates are server-side. System BIOS updates address hardware firmware, not browser performance.",multi:false},
{num:56,source:"Messer",ref:"B56",obj:"Obj 2.11",q:"A user receives a browser security alert on his laptop when visiting any website which uses HTTPS. If he uses his smartphone, he does not receive any error messages. Which of the following would best describe this situation?",choices:["The date and time on the laptop is incorrect","The smartphone is not updated with the latest OS version","The laptop has an incorrect subnet mask","The laptop does not have the latest anti-virus signatures"],answer:0,explain:"<strong>SSL/TLS certificate validation</strong> checks the system date and time; an incorrect date causes all HTTPS certificates to appear invalid or expired. The smartphone works correctly, confirming the issue is specific to the laptop's clock. Subnet mask and antivirus have no bearing on certificate validation.",multi:false},
{num:57,source:"Messer",ref:"C62",obj:"Obj 2.11",q:"A user receives this message each time they visit a secure website: \"The site's security certificate is not trusted.\" A technician investigates the issue and finds the problem only occurs on this user's computer and not with other computers in the same office. Which of the following would be the best next troubleshooting task?",choices:["Disable Windows Firewall for all HTTPS traffic","Create a new certificate for the user's computer","Check the date and time on the user's computer","Release and refresh the IP address configuration"],answer:2,explain:"Certificate trust errors occurring only on one computer typically indicate an <strong>incorrect system date or time</strong> causing certificate validation to fail. Disabling the firewall for HTTPS would be a security risk. The certificate is on the server, not the client computer. IP configuration affects connectivity, not certificate trust.",multi:false},
// Acronym questions for Domain 2
{num:58,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does MFA stand for?",choices:["Managed Firewall Access","Multi-Factor Authentication","Multiple File Authorization","Mandatory Firewall Activation"],answer:1,explain:"<strong>MFA</strong> stands for Multi-Factor Authentication. It requires users to verify their identity using two or more factors: something you know (password), something you have (token), or something you are (biometric). MFA significantly reduces the risk of unauthorized access from stolen passwords.",multi:false},
{num:59,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does SSO stand for?",choices:["Secure Socket Output","Single Sign-On","System Security Override","Shared Session Object"],answer:1,explain:"<strong>SSO</strong> stands for Single Sign-On. It allows a user to authenticate once and gain access to multiple systems or applications without being prompted to log in again. SSO improves user experience while centralizing authentication management.",multi:false},
{num:60,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does MDM stand for in a mobile security context?",choices:["Mobile Data Management","Multiple Device Monitor","Mobile Device Management","Managed Deployment Module"],answer:2,explain:"<strong>MDM</strong> stands for Mobile Device Management. It is a platform used by organizations to manage, monitor, and enforce security policies on smartphones and tablets, including app control, encryption enforcement, and remote wipe capabilities.",multi:false},
{num:61,source:"Messer",ref:"Acronym",obj:"Obj 2.2",q:"What does EFS stand for?",choices:["External File Storage","Encrypting File System","Enterprise Firewall Service","Extended Format Specification"],answer:1,explain:"<strong>EFS</strong> stands for Encrypting File System. It is a Windows feature that encrypts individual files and folders at the file system level. Unlike BitLocker which encrypts entire drives, EFS allows selective encryption of specific files while leaving others unencrypted.",multi:false},
{num:62,source:"Messer",ref:"Acronym",obj:"Obj 2.2",q:"What does UAC stand for?",choices:["Universal Access Control","User Account Control","Unified Authorization Certificate","Unrestricted Admin Console"],answer:1,explain:"<strong>UAC</strong> stands for User Account Control. It is a Windows security feature that prompts for confirmation or administrator credentials before allowing applications to make changes that could affect system settings or other users, preventing unauthorized system modifications.",multi:false},
{num:63,source:"Messer",ref:"Acronym",obj:"Obj 2.3",q:"What does WPA3 stand for?",choices:["Wide Protocol Access 3","Wireless Protocol Authentication 3","Wi-Fi Protected Access 3","Wired Packet Authorization 3"],answer:2,explain:"<strong>WPA3</strong> stands for Wi-Fi Protected Access 3. It is the latest wireless security protocol offering stronger encryption and improved authentication over WPA2, including Simultaneous Authentication of Equals (SAE) which replaces the vulnerable pre-shared key handshake.",multi:false},
{num:64,source:"Messer",ref:"Acronym",obj:"Obj 2.3",q:"What does TKIP stand for?",choices:["Terminal Key Integrity Protocol","Temporal Key Integrity Protocol","Transfer Key Integration Process","Trusted Kernel Interface Protocol"],answer:1,explain:"<strong>TKIP</strong> stands for Temporal Key Integrity Protocol. It was a security protocol used with WPA to improve on WEP by dynamically changing encryption keys. TKIP is now considered deprecated and insecure, replaced by AES encryption in WPA2 and WPA3.",multi:false},
{num:65,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does DLP stand for?",choices:["Data Loss Prevention","Disk Level Protection","Dynamic Link Protocol","Directory Lookup Process"],answer:0,explain:"<strong>DLP</strong> stands for Data Loss Prevention. It refers to tools and policies designed to detect and prevent sensitive data from being transmitted outside the organization's network without authorization, protecting against both accidental and intentional data leakage.",multi:false},
{num:66,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does IAM stand for?",choices:["Internal Access Module","Identity Access Management","Integrated Authentication Mechanism","Infrastructure Account Manager"],answer:1,explain:"<strong>IAM</strong> stands for Identity Access Management. It is the framework of policies, processes, and technologies that manages digital identities, controls user access to resources, and ensures the right people have appropriate access to technology resources.",multi:false},
{num:67,source:"Messer",ref:"Acronym",obj:"Obj 2.5",q:"What does XSS stand for?",choices:["External Script Source","Cross-site Scripting","eXtended Security Standard","Cross-System Sharing"],answer:1,explain:"<strong>XSS</strong> stands for Cross-site Scripting. It is a web security vulnerability where attackers inject malicious scripts into web pages viewed by other users. The injected scripts can steal session cookies, redirect users, or perform actions on behalf of the victim.",multi:false},
{num:68,source:"Messer",ref:"Acronym",obj:"Obj 2.5",q:"What does SQL stand for in the context of SQL injection attacks?",choices:["Secure Query Language","System Queue Logic","Structured Query Language","Standard Quality Layer"],answer:2,explain:"<strong>SQL</strong> stands for Structured Query Language. In the context of SQL injection, attackers insert malicious SQL code into input fields to manipulate the database backend. Successful SQL injection can expose, modify, or delete database contents.",multi:false},
{num:69,source:"Messer",ref:"Acronym",obj:"Obj 2.4",q:"What does EDR stand for?",choices:["Enterprise Data Recovery","Endpoint Detection and Response","External Device Restriction","Encrypted Data Repository"],answer:1,explain:"<strong>EDR</strong> stands for Endpoint Detection and Response. It is a cybersecurity solution that continuously monitors endpoints (computers, mobile devices) to detect suspicious activity, investigate threats, and provide automated or guided response to security incidents.",multi:false},
{num:70,source:"Messer",ref:"Acronym",obj:"Obj 2.3",q:"What does RADIUS stand for?",choices:["Remote Access Dial-In User Service","Rapid Authentication Data Integration User System","Remote Admin Domain Identity Utilization System","Registered Access Domain Internet User Security"],answer:0,explain:"<strong>RADIUS</strong> stands for Remote Authentication Dial-In User Service. It is a networking protocol that provides centralized authentication, authorization, and accounting (AAA) for users connecting to a network, commonly used with VPNs and wireless networks integrated with Active Directory.",multi:false},
{num:71,source:"Messer",ref:"Acronym",obj:"Obj 2.5",q:"What does BEC stand for?",choices:["Browser Extension Control","Business Email Compromise","Basic Encryption Certificate","Bridged Endpoint Connection"],answer:1,explain:"<strong>BEC</strong> stands for Business Email Compromise. It is a type of social engineering attack where cybercriminals impersonate executives or trusted partners via email to trick employees into transferring funds or revealing sensitive information.",multi:false},
{num:72,source:"Messer",ref:"Acronym",obj:"Obj 2.1",q:"What does PAM stand for in a security context?",choices:["Password Authentication Module","Privileged Access Management","Public Access Monitor","Policy Administration Manager"],answer:1,explain:"<strong>PAM</strong> stands for Privileged Access Management. It is a security solution that controls, monitors, and audits access to critical systems by privileged accounts such as administrators. PAM enforces least privilege and provides just-in-time access to sensitive resources.",multi:false},
{num:73,source:"Messer",ref:"Acronym",obj:"Obj 2.5",q:"What does DoS stand for?",choices:["Directory of Services","Denial of Service","Domain of Security","Data Over Satellite"],answer:1,explain:"<strong>DoS</strong> stands for Denial of Service. It is an attack that floods a target system with traffic or requests to overwhelm its resources, making it unavailable to legitimate users. A DDoS (Distributed Denial of Service) uses multiple systems to amplify the attack.",multi:false}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;}

function prepareQuestions(qs){
  const shuffled=shuffle([...qs]);
  return shuffled.map(q=>{
    if(q.multi){
      // For multi-answer, shuffle choices and remap correct answer indices
      const indices=[...Array(q.choices.length).keys()];
      shuffle(indices);
      const newChoices=indices.map(i=>q.choices[i]);
      const newAnswer=q.answer.map(a=>indices.indexOf(a));
      return {...q,choices:newChoices,answer:newAnswer};
    } else {
      const indices=[...Array(q.choices.length).keys()];
      shuffle(indices);
      const newChoices=indices.map(i=>q.choices[i]);
      const newAnswer=indices.indexOf(q.answer);
      return {...q,choices:newChoices,answer:newAnswer};
    }
  });
}

let prepared=prepareQuestions(questions);
const total=prepared.length;
let correct=0,wrong=0,answered=0;
document.getElementById('sr').textContent=total;

function updateScore(){
  document.getElementById('sc').textContent=correct;
  document.getElementById('sw').textContent=wrong;
  document.getElementById('sr').textContent=total-answered;
  const pct=answered>0?Math.round((correct/answered)*100):0;
  document.getElementById('sp').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=(answered/total*100)+'%';
  if(answered===total)showFinal();
}

function showFinal(){
  const pct=Math.round((correct/total)*100);
  const banner=document.getElementById('final-banner');
  const inner=document.getElementById('final-inner');
  banner.style.display='block';
  inner.style.background=pct>=78?'#00e87a':'#ff3b5c';
  inner.style.border='2px solid '+(pct>=78?'#00e87a':'#ff3b5c');
  document.getElementById('final-title').textContent='Final Score: '+pct+'%';
  document.getElementById('final-score').textContent=correct+' correct out of '+total+' — '+(pct>=78?'PASS ✓':'FAIL ✗');
  banner.scrollIntoView({behavior:'smooth'});
}

function retake(){
  correct=0;wrong=0;answered=0;
  prepared=prepareQuestions(questions);
  document.getElementById('final-banner').style.display='none';
  document.getElementById('container').innerHTML='';
  buildQuiz();
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildQuiz(){
  const container=document.getElementById('container');
  prepared.forEach((q,idx)=>{
    const card=document.createElement('div');
    card.className='card';
    const srcBadge=q.source==='Messer'?'<span class="badge-messer">Messer</span>':'<span class="badge-dion">Dion</span>';
    const refLabel=q.ref==='Acronym'?'Acronym':q.ref;
    const multiNote=q.multi?`<div class="multi-note">★ Select TWO answers, then click Submit</div>`:'';
    const btnHtml=q.choices.map((c,ci)=>`<button class="choice-btn" id="btn-${idx}-${ci}" onclick="toggleMulti(${idx},${ci})">${String.fromCharCode(65+ci)}. ${c}</button>`).join('');
    const submitHtml=q.multi?`<button class="submit-btn" id="submit-${idx}" onclick="submitMulti(${idx})">Submit Answer</button>`:'';
    card.innerHTML=`
      <div class="card-header">
        <span class="q-badge">Q${idx+1}</span>
        <div class="meta">${srcBadge}<span class="ref-code">${refLabel}</span><span class="obj-tag">${q.obj}</span></div>
      </div>
      <div class="question-text">${q.q}</div>
      ${multiNote}
      <div class="choices" id="choices-${idx}">${q.multi?btnHtml:q.choices.map((c,ci)=>`<button class="choice-btn" onclick="selectSingle(${idx},${ci})">${String.fromCharCode(65+ci)}. ${c}</button>`).join('')}</div>
      ${submitHtml}
      <div class="result-badge" id="result-${idx}"></div>
      <div class="explain-pane" id="explain-${idx}">${q.explain}</div>
    `;
    container.appendChild(card);
  });
}

const multiSelected={};
function toggleMulti(idx,ci){
  const q=prepared[idx];
  if(!q.multi)return;
  if(!multiSelected[idx])multiSelected[idx]=new Set();
  const sel=multiSelected[idx];
  const btn=document.getElementById(`btn-${idx}-${ci}`);
  if(sel.has(ci)){sel.delete(ci);btn.style.background='#e0e0e0';btn.style.color='#1a1a1a';}
  else{sel.add(ci);btn.style.background='#00c2ff';btn.style.color='#ffffff';}
  const submitBtn=document.getElementById(`submit-${idx}`);
  if(submitBtn)submitBtn.style.display=sel.size>=1?'block':'none';
}

function submitMulti(idx){
  const q=prepared[idx];
  const sel=multiSelected[idx]?Array.from(multiSelected[idx]):[];
  const correctSet=new Set(q.answer);
  const selSet=new Set(sel);
  const btns=document.getElementById('choices-'+idx).querySelectorAll('.choice-btn');
  btns.forEach((btn,bi)=>{
    btn.style.background='';btn.style.color='';
    btn.classList.add('locked');
    if(correctSet.has(bi)){btn.classList.add('correct');}
    else if(selSet.has(bi)&&!correctSet.has(bi)){btn.classList.add('wrong-selected');}
    else{btn.classList.add('unchosen');}
  });
  const submitBtn=document.getElementById(`submit-${idx}`);
  if(submitBtn)submitBtn.style.display='none';
  const isCorrect=q.answer.every(a=>selSet.has(a))&&sel.length===q.answer.length;
  const resultEl=document.getElementById('result-'+idx);
  resultEl.className='result-badge show';
  if(isCorrect){
    resultEl.innerHTML='<span class="result-correct">✓ Correct!</span>';
    correct++;
  } else {
    const correctLetters=q.answer.map(a=>String.fromCharCode(65+a)).join(', ');
    const selLetters=sel.map(a=>String.fromCharCode(65+a)).join(', ');
    resultEl.innerHTML=`<span class="result-wrong">✗ Wrong — Correct answers: ${correctLetters}. You selected: ${selLetters||'none'}.</span>`;
    wrong++;
  }
  document.getElementById('explain-'+idx).classList.add('show');
  answered++;updateScore();
}

function selectSingle(idx,chosen){
  const q=prepared[idx];
  if(q.multi)return;
  const btns=document.getElementById('choices-'+idx).querySelectorAll('.choice-btn');
  btns.forEach((btn,bi)=>{
    btn.classList.add('locked');
    if(bi===q.answer){btn.classList.add('correct');}
    else if(bi===chosen&&chosen!==q.answer){btn.classList.add('wrong-selected');}
    else{btn.classList.add('unchosen');}
  });
  const isCorrect=chosen===q.answer;
  const resultEl=document.getElementById('result-'+idx);
  resultEl.className='result-badge show';
  resultEl.innerHTML=isCorrect?'<span class="result-correct">✓ Correct!</span>':`<span class="result-wrong">✗ Wrong — Answer: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</span>`;
  document.getElementById('explain-'+idx).classList.add('show');
  isCorrect?correct++:wrong++;
  answered++;updateScore();
}

buildQuiz();
updateScore();
</script>
</body>
</html>
