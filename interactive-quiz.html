<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Core 2 Networking Services PBQ Study Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* SERVICE TABS NAVIGATION */
        .service-tabs-nav {
            border: 3px solid #667eea;
            border-radius: 12px;
            padding: 16px 20px 12px;
            margin-bottom: 25px;
            background: #f8f9ff;
            display: inline-block;
            position: relative;
        }
        .service-tabs-label {
            position: absolute;
            top: -11px;
            left: 16px;
            background: #667eea;
            color: white;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 2px 12px;
            border-radius: 4px;
        }
        .tab-buttons { display: flex; gap: 12px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .tab-btn {
            background: #e8eaf0;
            color: #555;
            border: 3px solid #c0c4d0;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 8px;
            position: relative;
        }
        .tab-btn:hover:not(.active) {
            background: #dde0ea;
            border-color: #9aa0b8;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #4a5ecf;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
        }
        .btn-check { background: #4caf50; color: white; }
        .btn-check:hover { background: #45a049; }
        .btn-reset { background: #f44336; color: white; }
        .btn-reset:hover { background: #d32f2f; }
        .btn-back { background: #2196F3; color: white; }
        .btn-back:hover { background: #0b7dda; }
        
        /* HOST SELECTION SCREEN */
        .host-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .host-card {
            background: white;
            border: 3px solid #667eea;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .host-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .host-icon { font-size: 48px; margin-bottom: 10px; }
        .host-label { font-weight: bold; color: #333; }
        .host-card.completed { opacity: 0.6; }
        .host-card.completed::after { content: " ✓"; color: #4caf50; font-weight: bold; }
        
        /* EXPANDED VIEW */
        .expanded-view { display: none; }
        .expanded-view.active { display: block; }
        .back-button { margin-bottom: 20px; }
        
        .columns-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .column {
            border: 2px solid #667eea;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            max-height: 600px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }
        .column-header {
            background: #667eea;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }
        .column-content {
            overflow-y: auto;
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .service-row {
            display: grid;
            grid-template-columns: auto 80px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }
        .service-row:last-child { border-bottom: none; }
        .service-name {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            word-break: break-word;
        }
        
        .service-select {
            width: 80px;
            padding: 6px 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .service-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .service-select.correct { 
            background-color: #92D050 !important; 
            color: white !important; 
            font-weight: bold; 
            border-color: #92D050 !important;
        }
        
        .service-select.wrong { 
            background-color: #FF6B6B !important; 
            color: white !important; 
            font-weight: bold; 
            border-color: #FF6B6B !important;
        }
        
        .stats { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
        }
        .stat-value { font-size: 22px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 3px; }
        
        /* QUARANTINE ZONE */
        .quarantine-section {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border: 3px dashed #ff6b6b;
            border-radius: 12px;
            display: none;
        }
        .quarantine-section.active { display: block; }
        .quarantine-title { font-weight: bold; color: #d32f2f; margin-bottom: 15px; font-size: 16px; }
        .quarantine-zone {
            width: 250px;
            height: 250px;
            border: 3px dashed #d32f2f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 107, 107, 0.1);
            cursor: pointer;
            margin: 20px auto;
            transition: all 0.3s;
        }
        .quarantine-zone:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }
        .quarantine-zone.active {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            border-style: solid;
        }
        .quarantine-zone.quarantined {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            border-style: solid;
        }
        .quarantine-icon { font-size: 80px; animation: pulse-worm 1.5s infinite; }
        @keyframes pulse-worm {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .quarantine-message { color: #d32f2f; font-weight: bold; text-align: center; }
        .host2-card-quarantine {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: move;
            font-weight: bold;
            text-align: center;
            draggable: true;
            margin-bottom: 15px;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>CompTIA A+ Core 2 Networking — Services PBQ Study Guide</h1>
    <p class="subtitle">Configure Windows Services for different network scenarios</p>

    <div class="service-tabs-nav">
        <span class="service-tabs-label">Service Tabs</span>
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-host" onclick="switchTab('host')">Host Services</button>
            <button class="tab-btn" id="tab-server" onclick="switchTab('server')">Server Role Services</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn-check" onclick="checkAnswers()">✓ Check Answers</button>
        <button class="btn-reset" onclick="resetAll()">↻ Reset</button>
    </div>

    <div class="stats" id="statsContainer"></div>

    <!-- HOST SERVICES TAB -->
    <div id="host-tab">
        <!-- SELECTION SCREEN -->
        <div id="host-selection-screen" class="host-selection"></div>
        
        <!-- EXPANDED VIEW -->
        <div id="host-expanded-view" class="expanded-view">
            <div class="back-button">
                <button class="btn-back" onclick="backToHostSelection()">← Back to Host Selection</button>
            </div>
            <div class="columns-wrapper" id="host-expanded-column"></div>
        </div>
        
        <!-- QUARANTINE ZONE -->
        <div id="host-quarantine-section" class="quarantine-section">
            <div class="quarantine-title">🚨 QUARANTINE ZONE 🚨</div>
            <div class="quarantine-message">Drag Host 2 below to quarantine the infected system:</div>
            
            <div class="quarantine-zone" id="quarantine-zone" ondragover="dragOver(event)" ondrop="dropInQuarantine(event)" ondragleave="dragLeave(event)">
                <div class="quarantine-icon" id="quarantine-icon">🦠</div>
            </div>
            <div id="quarantine-status"></div>
            <div id="pbq-grade"></div>
        </div>
    </div>

    <!-- SERVER SERVICES TAB -->
    <div id="server-tab" class="hidden">
        <!-- SELECTION SCREEN -->
        <div id="server-selection-screen" class="host-selection"></div>
        
        <!-- EXPANDED VIEW -->
        <div id="server-expanded-view" class="expanded-view">
            <div class="back-button">
                <button class="btn-back" onclick="backToServerSelection()">← Back to Server Selection</button>
            </div>
            <div class="columns-wrapper" id="server-expanded-column"></div>
        </div>
        
        <!-- QUARANTINE ZONE -->
        <div id="server-quarantine-section" class="quarantine-section">
            <div class="quarantine-title">🚨 QUARANTINE ZONE 🚨</div>
            <div class="quarantine-message">Configuration complete!</div>
        </div>
    </div>
</div>

<script>
const services = [
    { name: 'Application Information', answer: 'Start' },
    { name: 'Background Intelligent Transfer Service', answer: 'Start' },
    { name: 'Bluetooth Support Service', answer: 'Stop' },
    { name: 'DHCP Client', answer: 'Stop' },
    { name: 'DNS Client', answer: 'Start' },
    { name: 'Extensible Authentication Protocol', answer: 'Stop' },
    { name: 'Network Connections', answer: 'Start' },
    { name: 'Netlogon', answer: 'Start' },
    { name: 'Offline Files', answer: 'Start' },
    { name: 'Parental Controls', answer: 'Start' },
    { name: 'Persistence.j1zpxn installer service', answer: 'Stop', serverName: 'Plug and Play' },
    { name: 'Portable Device Enumerator Service', answer: 'Stop' },
    { name: 'Remote Access Connection Manager', answer: 'Stop' },
    { name: 'Remote Desktop Configuration', answer: 'Stop' },
    { name: 'Remote Procedure Call (RPC)', answer: 'Start' },
    { name: 'Remote Registry', answer: 'Stop' },
    { name: 'Routing and Remote Access', answer: 'Stop' },
    { name: 'RPC Endpoint Mapper', answer: 'Start' },
    { name: 'Secondary Logon', answer: 'Start' },
    { name: 'Secure Socket Tunneling Protocol', answer: 'Stop' },
    { name: 'Security Center', answer: 'Start' },
    { name: 'SNMP Trap', answer: 'Stop' },
    { name: 'Task Scheduler', answer: 'Start' },
    { name: 'Telephony', answer: 'Stop' },
    { name: 'User Profile Service', answer: 'Start' },
    { name: 'Windows Audio', answer: 'Start', serverAnswers: { media: 'Start', database: 'Stop', file: 'Stop' } },
    { name: 'Windows Card Space', answer: 'Stop' },
    { name: 'Windows Defender', answer: 'Start' },
    { name: 'Windows Event Log', answer: 'Start' },
    { name: 'Windows Firewall', answer: 'Start' },
    { name: 'Windows Installer', answer: 'Start' },
    { name: 'Windows Search', answer: 'Start', serverAnswers: { media: 'Start', database: 'Stop', file: 'Stop' } },
    { name: 'Windows Time', answer: 'Start' },
    { name: 'Windows Update', answer: 'Start' },
    { name: 'Print Spooler', answer: 'Start', serverAnswers: { media: 'Start', database: 'Stop', file: 'Start' } },
    { name: 'Protected Storage', answer: 'Start' },
    { name: 'Storage Service', answer: 'Start' },
    { name: 'Virtual Disk', answer: 'Start' },
    { name: 'Volume Shadow Copy', answer: 'Start' },
    { name: 'Windows Backup', answer: 'Start' },
];

let currentTab = 'host';
let currentHostIndex = null;
let hostCompleted = {};
let serverCompleted = {};
let host2Quarantined = false;

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('host-tab').classList.toggle('hidden', tab !== 'host');
    document.getElementById('server-tab').classList.toggle('hidden', tab !== 'server');

    const hostBtn = document.getElementById('tab-host');
    const serverBtn = document.getElementById('tab-server');

    hostBtn.classList.toggle('active', tab === 'host');
    serverBtn.classList.toggle('active', tab === 'server');


    if (tab === 'host') {
        renderHostSelection();
    } else {
        renderServerSelection();
    }
}

function renderHostSelection() {
    const container = document.getElementById('host-selection-screen');
    const hosts = ['Host 2', 'Host 3', 'Host 4', 'Host 5', 'Host 6', 'Host 7', 'Host 8'];
    
    let html = hosts.map((host, idx) => {
        const isCompleted = hostCompleted[idx];
        const draggable = idx === 0 ? 'draggable="true" ondragstart="dragStartHost2(event)"' : '';
        return `
            <div class="host-card ${isCompleted ? 'completed' : ''}" onclick="selectHost(${idx})" ${draggable}>
                <div class="host-icon">🖥️</div>
                <div class="host-label">${host}</div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = html;
    
    document.getElementById('host-quarantine-section').classList.add('active');
}

function renderServerSelection() {
    const container = document.getElementById('server-selection-screen');
    const roles = ['Media Server', 'Database Server', 'File Server'];
    
    container.innerHTML = roles.map((role, idx) => {
        const isCompleted = serverCompleted[idx];
        return `
            <div class="host-card ${isCompleted ? 'completed' : ''}" onclick="selectServer(${idx})">
                <div class="host-icon">🖧</div>
                <div class="host-label">${role}</div>
            </div>
        `;
    }).join('');
}

function selectHost(idx) {
    currentHostIndex = idx;
    document.getElementById('host-selection-screen').style.display = 'none';
    document.getElementById('host-expanded-view').classList.add('active');
    renderHostExpanded(idx);
}

function backToHostSelection() {
    currentHostIndex = null;
    document.getElementById('host-selection-screen').style.display = 'grid';
    document.getElementById('host-expanded-view').classList.remove('active');
    document.getElementById('host-quarantine-section').classList.add('active');
    renderHostSelection();
}

function renderHostExpanded(hostIdx) {
    const container = document.getElementById('host-expanded-column');
    const hosts = ['Host 2', 'Host 3', 'Host 4', 'Host 5', 'Host 6', 'Host 7', 'Host 8'];
    
    container.innerHTML = `
        <div class="column">
            <div class="column-header">${hosts[hostIdx]}</div>
            <div class="column-content">
                ${services.map((svc, svcIdx) => {
                    const displayName = (hostIdx === 0 && svc.name === 'Persistence.j1zpxn installer service') 
                        ? svc.name 
                        : (hostIdx > 0 && svc.serverName) 
                        ? svc.serverName 
                        : svc.name;
                    const id = `host${hostIdx}-svc${svcIdx}`;
                    return `
                        <div class="service-row">
                            <div class="service-name">${displayName}</div>
                            <select class="service-select" id="${id}" onchange="liveCheck(this, '${svc.answer}')">
                                <option value="">--</option>
                                <option>Start</option>
                                <option>Stop</option>
                            </select>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
    
    // Button to mark complete
    const btn = document.createElement('button');
    btn.textContent = '✓ Complete Host ' + hosts[hostIdx];
    btn.className = 'btn-check';
    btn.style.marginTop = '15px';
    btn.onclick = () => completeHost(hostIdx);
    container.parentElement.appendChild(btn);
}

function completeHost(hostIdx) {
    hostCompleted[hostIdx] = true;
    backToHostSelection();
}

function selectServer(idx) {
    document.getElementById('server-selection-screen').style.display = 'none';
    document.getElementById('server-expanded-view').classList.add('active');
    renderServerExpanded(idx);
}

function backToServerSelection() {
    document.getElementById('server-selection-screen').style.display = 'grid';
    document.getElementById('server-expanded-view').classList.remove('active');
    renderServerSelection();
}

function renderServerExpanded(roleIdx) {
    const container = document.getElementById('server-expanded-column');
    const roles = ['Media Server', 'Database Server', 'File Server'];
    const serverAnswerKeys = ['media', 'database', 'file'];
    
    container.innerHTML = `
        <div class="column">
            <div class="column-header">${roles[roleIdx]}</div>
            <div class="column-content">
                ${services.map((svc, svcIdx) => {
                    const displayName = svc.serverName || svc.name;
                    const answer = svc.serverAnswers ? svc.serverAnswers[serverAnswerKeys[roleIdx]] : svc.answer;
                    const id = `server-${roleIdx}-svc${svcIdx}`;
                    return `
                        <div class="service-row">
                            <div class="service-name">${displayName}</div>
                            <select class="service-select" id="${id}" onchange="liveCheck(this, '${answer}')">
                                <option value="">--</option>
                                <option>Start</option>
                                <option>Stop</option>
                            </select>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
    
    const btn = document.createElement('button');
    btn.textContent = '✓ Complete ' + roles[roleIdx];
    btn.className = 'btn-check';
    btn.style.marginTop = '15px';
    btn.onclick = () => completeServer(roleIdx);
    container.parentElement.appendChild(btn);
}

function completeServer(roleIdx) {
    serverCompleted[roleIdx] = true;
    backToServerSelection();
}

function liveCheck(el, correct) {
    el.classList.remove('correct', 'wrong');
    if (el.value === correct) {
        el.classList.add('correct');
    } else if (el.value) {
        el.classList.add('wrong');
    }
    updateStats();
}

function dragStartHost2(event) {
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', 'Host2');
}

function dragOver(event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    document.getElementById('quarantine-zone').classList.add('active');
}

function dragLeave(event) {
    document.getElementById('quarantine-zone').classList.remove('active');
}

function dropInQuarantine(event) {
    event.preventDefault();
    const data = event.dataTransfer.getData('text/plain');
    if (data === 'Host2') {
        host2Quarantined = true;
        const zone = document.getElementById('quarantine-zone');
        zone.classList.remove('active');
        zone.classList.add('quarantined');

        // Replace worm icon with Host 2 card
        const icon = document.getElementById('quarantine-icon');
        icon.innerHTML = '🖥️ Host 2';
        icon.style.fontSize = '24px';
        icon.style.fontWeight = 'bold';
        icon.style.color = '#333';

        // Hide Host 2 card from selection screen
        const hostCards = document.querySelectorAll('.host-card');
        if (hostCards.length > 0) {
            hostCards[0].style.display = 'none';  // Host 2 is first card
        }

        // Show neutral confirmation — do NOT grade yet
        document.getElementById('quarantine-status').innerHTML = '<div style="color: #4caf50; font-weight: bold; margin-top: 15px; text-align: center;">✓ Host 2 Quarantined. Continue configuring the remaining hosts, then click "Check Answers" to submit.</div>';
    }
}

function calculatePBQGrade() {
    const selects = document.querySelectorAll('select');
    let correct = 0, total = selects.length;
    selects.forEach(s => {
        if (s.classList.contains('correct')) correct++;
    });

    let accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

    const grade = accuracy >= 90 ? 'A' : accuracy >= 80 ? 'B' : accuracy >= 70 ? 'C' : 'F';
    const gradeColor = grade === 'A' ? '#4caf50' : grade === 'B' ? '#2196F3' : grade === 'C' ? '#ff9800' : '#f44336';

    const gradeDiv = document.getElementById('pbq-grade');
    gradeDiv.innerHTML = `
        <div style="margin-top: 20px; padding: 20px; background: ${gradeColor}; color: white; border-radius: 8px; text-align: center;">
            <div style="font-size: 24px; font-weight: bold;">PBQ COMPLETE</div>
            <div style="font-size: 18px; margin-top: 10px;">Grade: <strong>${grade}</strong></div>
            <div style="font-size: 14px; margin-top: 5px;">${correct} / ${total} Services Correct (${accuracy}%)</div>
        </div>
    `;
}

function updateStats() {
    const selects = document.querySelectorAll('select');
    let correct = 0, wrong = 0, total = selects.length;
    selects.forEach(s => {
        if (s.classList.contains('correct')) correct++;
        else if (s.classList.contains('wrong')) wrong++;
    });
    const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
    document.getElementById('statsContainer').innerHTML = `
        <div class="stat-box"><div class="stat-value">${correct}</div><div class="stat-label">Correct</div></div>
        <div class="stat-box"><div class="stat-value">${wrong}</div><div class="stat-label">Wrong</div></div>
        <div class="stat-box"><div class="stat-value">${accuracy}%</div><div class="stat-label">Accuracy</div></div>
    `;
}

function checkAnswers() {
    updateStats();

    // Check how many hosts are still incomplete
    const hostIndices = [0,1,2,3,4,5,6];
    const incompleteHosts = hostIndices.filter(i => !hostCompleted[i]);
    const allHostsCompleted = incompleteHosts.length === 0;

    // If not all hosts are done or Host 2 not quarantined, warn and don't grade
    const warnings = [];
    if (!host2Quarantined) {
        warnings.push('Host 2 has not been quarantined yet.');
    }
    if (!allHostsCompleted) {
        warnings.push(`${incompleteHosts.length} host(s) still need to be completed.`);
    }

    if (warnings.length > 0) {
        alert('Cannot submit yet:\n• ' + warnings.join('\n• ') + '\n\nPlease address all hosts before submitting.');
        return;
    }

    // All hosts completed and Host 2 quarantined — calculate final grade
    calculatePBQGrade();
}

function resetAll() {
    document.querySelectorAll('select').forEach(s => {
        s.value = '';
        s.classList.remove('correct', 'wrong');
    });
    hostCompleted = {};
    serverCompleted = {};
    host2Quarantined = false;
    const zone = document.getElementById('quarantine-zone');
    zone.classList.remove('quarantined');
    const icon = document.getElementById('quarantine-icon');
    icon.textContent = '🦠';
    icon.style.fontSize = '80px';
    icon.style.fontWeight = 'normal';
    icon.style.color = '';
    icon.style.display = 'block';
    icon.style.animation = '';
    document.getElementById('quarantine-status').innerHTML = '';
    document.getElementById('pbq-grade').innerHTML = '';
    
    // Show Host 2 card again
    const hostCards = document.querySelectorAll('.host-card');
    if (hostCards.length > 0) {
        hostCards[0].style.display = '';
    }
    
    renderHostSelection();
    updateStats();
}

renderHostSelection();
updateStats();
</script>

<script src="footer.js"></script>
</body>
</html>
