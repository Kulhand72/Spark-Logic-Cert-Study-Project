{num:26,source:"Messer",ref:"B81",obj:"Obj 4.4",q:"A technician is upgrading the motherboard in a server. Which of the following should be the first task when beginning this upgrade?",choices:["Wear safety goggles","Connect an ESD strap","Remove any motherboard batteries","Disconnect from all power sources"],answer:3,explain:"<strong>Disconnecting from all power sources</strong> is always the first step before opening any system to perform internal hardware work. Safety goggles, ESD straps, and removing batteries all come after power is safely disconnected.",multi:false},
{num:27,source:"Messer",ref:"C25",obj:"Obj 4.4",q:"A technician has been asked to replace a faulty adapter card in a server. The technician doesn't have an anti-static strap, but they have removed the server from the power source. Which of the following would be the best way to safely complete this repair?",choices:["Store the faulty card in an anti-static bag","Periodically touch the server's metal chassis","Wear safety goggles","Have a carbon dioxide extinguisher nearby"],answer:1,explain:"<strong>Periodically touching the metal chassis</strong> equalizes the static charge between the technician and the system, reducing ESD risk when no strap is available. Storing the faulty card in an anti-static bag is good practice but doesn't protect the installed components. Safety goggles and extinguishers address different hazards.",multi:false},
{num:28,source:"Messer",ref:"C30",obj:"Obj 4.4",q:"A server technician is removing the memory from a web server and adding new memory modules to the motherboard. The old memory modules will be used to upgrade a server in a different data center. Which of the following would be the best way to protect the old memory modules?",choices:["Padded envelope","Cotton fabric","Molded foam packing material","Anti-static bag"],answer:3,explain:"<strong>Anti-static bags</strong> protect memory modules from electrostatic discharge during transport to another data center. A padded envelope and foam provide physical protection but not ESD protection. Cotton fabric generates static and offers no protection against electrostatic discharge.",multi:false},
{num:29,source:"Messer",ref:"C40",obj:"Obj 4.4",q:"Which of the following fire extinguishers would be most appropriate to use in a data center?",choices:["Foam","Carbon Dioxide","Saline","Water"],answer:1,explain:"<strong>Carbon dioxide extinguishers</strong> are ideal for data centers as they suppress electrical fires without damaging equipment or leaving conductive residue. Foam, saline, and water all leave residue or conduct electricity, making them dangerous or destructive in an environment with powered electronic equipment.",multi:false},
{num:30,source:"Messer",ref:"C88",obj:"Obj 4.4",q:"A company is moving three computer racks of equipment from an old data center to a new facility. Which of these safety features should be the most important requirement at the new location?",choices:["Air filter masks","Anti-static mat","Equipment grounding","Surge protectors"],answer:2,explain:"Proper <strong>equipment grounding</strong> at a new facility is the most critical safety requirement to protect both personnel and equipment from electrical faults. Air filter masks, anti-static mats, and surge protectors are all useful but secondary to establishing proper electrical grounding at a new site.",multi:false},
// Obj 4.5 Environmental Controls
{num:31,source:"Messer",ref:"A18",obj:"Obj 4.5",q:"An office power system occasionally experiences minor voltage spikes during the business day. Which of the following would be the best way to address this power issue?",choices:["Power down when not actively working","Confirm the building has an electrical ground","Connect a surge suppressor to each system","Maintain an inventory of replacement power supplies"],answer:2,explain:"A <strong>surge suppressor</strong> absorbs minor voltage spikes protecting connected equipment from damage during transient power events. Powering down is impractical during business hours. An electrical ground protects against faults, not spikes. Maintaining spare power supplies is reactive, not preventive.",multi:false},
{num:32,source:"Messer",ref:"A76",obj:"Obj 4.5",q:"A data center manager requires each server to maintain at least fifteen minutes of uptime during a power failure. Which of these would be the best choice for this requirement?",choices:["Cloud-based storage","UPS","Redundant power supplies","Surge suppressor"],answer:1,explain:"A <strong>UPS</strong> (Uninterruptible Power Supply) provides battery backup that maintains server operation for a defined period during a power failure. Cloud storage does not affect local power. Redundant power supplies switch between sources but do not provide battery backup. A surge suppressor protects against spikes, not outages.",multi:false},
{num:33,source:"Messer",ref:"C13",obj:"Obj 4.5",q:"A home user provides numerous online presentations during the day. However, the power in the area is not stable and there will often be short outages. Which of the following would help with this issue?",choices:["Cloud backups","External storage device","Battery backup","Surge suppressor"],answer:2,explain:"A <strong>battery backup</strong> (UPS) maintains power during short outages, preventing presentation interruptions. Cloud backups protect data but do not provide power continuity. An external storage device stores data but provides no power. A surge suppressor protects against spikes but provides no backup power during outages.",multi:false},
{num:34,source:"Messer",ref:"B7",obj:"Obj 4.5",q:"A company has just performed annual laser printer maintenance, and has accumulated hundreds of used toner cartridges. Which of the following would be the best way to dispose of the old cartridges?",choices:["Take to a hazardous waste facility","Send in bulk to the local landfill","Separate the parts and dispose of normally","Contract with an incineration company"],answer:0,explain:"Toner cartridges contain chemicals classified as <strong>hazardous waste</strong> and must be disposed of at an approved hazardous waste facility per MSDS guidelines. Sending to a landfill violates environmental regulations. Separating parts does not address the hazardous chemicals. Incineration of toner can release toxic particles.",multi:false},
{num:35,source:"Messer",ref:"C77",obj:"Obj 4.5",q:"A company is updating all of their UPS systems with new batteries. Which of the following would be the best way to dispose of the old batteries?",choices:["Take to a local hazardous waste facility","Throw out with the paper trash","Ship them to a battery wholesaler","Bury them in a landfill"],answer:0,explain:"UPS batteries contain <strong>lead-acid or lithium compounds</strong> classified as hazardous materials requiring disposal at an approved facility. Throwing them in paper trash and burying them in a landfill violates environmental regulations. Shipping to a wholesaler is not an approved disposal method.",multi:false},
{num:36,source:"Messer",ref:"C83",obj:"Obj 4.5",q:"A technician has just received fifty boxes of used laser printer toner cartridges removed during an annual preventive maintenance project. Which of the following would be the best next step for managing these used cartridges?",choices:["Refer to the MSDS","Ship the cartridges to the original manufacturer","Incinerate the cartridges","Drill a hole in each cartridge"],answer:0,explain:"The <strong>MSDS</strong> (Material Safety Data Sheet) provides the manufacturer's official guidance on safe handling and disposal of toner cartridges. Shipping to the manufacturer is not standard disposal. Incineration can release toxic particles. Drilling holes damages the cartridge and releases toner into the environment.",multi:false},
// Obj 4.6 Privacy Licensing & Policy
{num:37,source:"Messer",ref:"A14",obj:"Obj 4.6",q:"A company maintains data retention requirements of five years for all customer names, addresses, and phone numbers. Which of the following would best describe this data?",choices:["Credit card transactions","Government-issued information","PII","Healthcare data"],answer:2,explain:"Customer names, addresses, and phone numbers are <strong>PII</strong> (Personally Identifiable Information), which is subject to data retention and privacy regulations. Credit card transactions fall under PCI DSS. Government-issued information refers to IDs and passports. Healthcare data is protected under HIPAA.",multi:false},
{num:38,source:"Messer",ref:"B75",obj:"Obj 4.6",q:"A manufacturing company in the United States sells monthly subscriptions from their website. Which of the following regulated data types would be the MOST important to manage?",choices:["Personal government-issued information","Credit card transactions","Healthcare data","Software license terms"],answer:1,explain:"A subscription-based website processes payment information, making <strong>credit card transaction</strong> data and PCI DSS compliance the most critical regulatory concern. Government-issued information, healthcare data, and software license terms are not collected in a standard subscription payment workflow.",multi:false},
{num:39,source:"Messer",ref:"B17",obj:"Obj 4.6",q:"A technician has been asked to power down and store a server which has been exploited by an external attacker. The legal department will be performing tests and gathering information from this server. Which of the following would be most important to ensure the integrity of the server data?",choices:["Report the server location to the proper channels","Compile all support tickets associated with the server","Maintain a chain of custody","Take photos of the server in the storage room"],answer:2,explain:"<strong>Chain of custody</strong> documents who handled evidence and when, preserving its integrity and admissibility in legal proceedings. Reporting the location and compiling tickets are useful but secondary. Photos document physical condition but don't establish legal chain of custody.",multi:false},
{num:40,source:"Messer",ref:"C57",obj:"Obj 4.6",q:"A company deploys a suite of commercial software onto every workstation in the organization. Which of the following would best describe this licensing?",choices:["Personal licenses","Corporate license","Open-source license","End user licensing agreement"],answer:1,explain:"A <strong>corporate license</strong> covers deployment of software across multiple workstations within an organization under a single agreement. Personal licenses are for individual use only. Open-source licenses allow free use and modification. An EULA is the terms of agreement, not a license type itself.",multi:false},
{num:41,source:"Messer",ref:"B83",obj:"Obj 4.6",q:"A user would like to install an image and photo editing program on their home computer, but they would prefer an application without a monthly subscription. Which of the following would be the best licensing option for this requirement?",choices:["Open-source","Corporate","Personal","DRM"],answer:0,explain:"<strong>Open-source</strong> software is freely available without subscription fees, making it ideal for users who want a no-cost perpetual option. Corporate licenses are for organizational deployment. Personal licenses may still require purchase or subscription. DRM is a copy protection mechanism, not a license type.",multi:false},
{num:42,source:"Messer",ref:"C54",obj:"Obj 4.6",q:"A technician has been asked to work on an urgent computer repair while the user is at lunch. When the technician arrives, they notice paperwork on the desk which may contain private customer information. Which of the following would be the best next step?",choices:["Complete the repair as quickly as possible","Ask an associate in the department for assistance","Move the papers somewhere out of sight","Leave without repairing the computer"],answer:1,explain:"When encountering potentially sensitive materials, involving a <strong>departmental associate</strong> maintains proper oversight and confidentiality. Completing the repair alone without addressing the sensitive materials is inappropriate. Moving the papers is interfering with the customer's property. Leaving fails to complete the required repair.",multi:false},
{num:43,source:"Messer",ref:"C41",obj:"Obj 4.6",q:"The Human Resources department is installing a shared computer in the company lobby to use for electronic job applications. The kiosk should start automatically without requiring any network login prompt, and the kiosk should only have access to the job application modules. Which of the following account types would be the best choice for this system?",choices:["SSO user","Administrator","Guest","Power User"],answer:2,explain:"A <strong>guest account</strong> provides limited, restricted access without requiring domain authentication, making it ideal for a public-facing kiosk. SSO requires network authentication. An administrator account has unrestricted access. A Power User account has elevated rights inappropriate for a public kiosk.",multi:false},
// Obj 4.7 Communication & Professionalism
{num:44,source:"Messer",ref:"A33",obj:"Obj 4.7",q:"A user has delivered a broken laptop to the help desk, and they are visibly upset and quite vocal about the problem they're having. The user is also asking for a very specific repair which doesn't appear to have any relationship to his issue. What's the best way to handle this situation?",choices:["Repeat your understanding of the issue to the customer and provide an estimate and follow-up time","Refuse the repair until the customer calms down","Inform the customer of his mistake with the proposed repair","Refuse to make any commitments until the computer is examined"],answer:0,explain:"<strong>Restating the issue and providing a timeline</strong> de-escalates the situation, sets clear expectations, and demonstrates active listening. Refusing the repair and correcting the customer are confrontational. Refusing to make any commitments leaves the customer without a path forward.",multi:false},
{num:45,source:"Messer",ref:"A57",obj:"Obj 4.7",q:"A technician was assigned a support ticket with an urgently requested a laptop screen repair. The support team was able to locate a replacement and install a new LCD display in less than 24 hours. The laptop was returned to the user and the user immediately left on a business trip. Which of the following would be the best next step for this repair?",choices:["Order a backup replacement display","Update the user's login script","Run diagnostics on the original screen","Contact the user to verify satisfaction"],answer:3,explain:"<strong>Following up with the customer</strong> to confirm satisfaction is a required step in professional support to ensure the repair resolved the issue. Ordering a backup display is premature. Updating login scripts is unrelated. Running diagnostics on the broken original screen serves no immediate purpose.",multi:false},
{num:46,source:"Messer",ref:"B12",obj:"Obj 4.7",q:"A technician is scheduled to replace a faulty motherboard today, but the motherboard delivery has been delayed and will not arrive until tomorrow. The new motherboard will repair a laptop used by a company executive. Which of the following would be the best way to handle these events?",choices:["Move the installation to the next business day","Schedule another repair into today's newly opened time slot","Ask the delivery company for a refund on the shipping charges","Contact the end user and inform them of the shipping issue"],answer:3,explain:"<strong>Proactively communicating delays</strong> to the customer, especially an executive, maintains trust and allows them to make alternative arrangements. Simply rescheduling without notifying the user is unprofessional. Scheduling another repair and requesting refunds are secondary concerns.",multi:false},
{num:47,source:"Messer",ref:"B68",obj:"Obj 4.7",q:"A user has dropped off their laptop at the repair desk. A message taped to the laptop states: \"Doesn't work.\" Which of the following would be the best next step?",choices:["Start the laptop and look for any issues","Call the customer and ask for more information","Replace the power adapter and try booting the laptop","Use a diagnostics boot CD to run hardware tests"],answer:1,explain:"A vague problem description requires clarification; <strong>calling the customer</strong> to ask open-ended questions narrows the scope before attempting any repair. Starting the laptop may reveal issues but wastes time if the problem requires specific conditions to reproduce. Replacing the adapter and running diagnostics are premature guesses.",multi:false},
{num:48,source:"Messer",ref:"C12",obj:"Obj 4.7",q:"A user has brought their laptop to the help desk because of an issue during startup. The laptop screen remains black when powering on, and no status lights appear on the system. The user is traveling tomorrow to a remote site in another country and needs the laptop while they are on the road. Which of the following would be the best option?",choices:["Provide the user with the option to repair, replace, or rent a new system","Assign the user to the standard seven-day repair agreement","Replace the external power cable and close the repair ticket","Recommend the user cancel their travel plans"],answer:0,explain:"When a user has an urgent deadline, <strong>offering repair, replacement, or rental options</strong> ensures their business needs are met while the repair is addressed. A standard seven-day turnaround doesn't address the urgency. Replacing only the cable is a premature assumption. Recommending the user cancel travel is inappropriate.",multi:false},
{num:49,source:"Messer",ref:"C50",obj:"Obj 4.7",q:"While working at a customer's desk, a technician's mobile phone begins to ring. Which of the following would be the most appropriate response?",choices:["Take the call and address the caller's requests before continuing","Take the call and ask the caller if you can return their call later","Send the call to voicemail and apologize for the interruption","Politely excuse yourself and step out to take the call"],answer:2,explain:"<strong>Sending the call to voicemail and apologizing</strong> keeps focus on the customer without being rude or creating a prolonged interruption. Taking the call in any form diverts attention from the customer being served. Stepping out creates a delay in the repair.",multi:false},
{num:50,source:"Messer",ref:"C80",obj:"Obj 4.7",q:"A technician has received a help desk ticket asking for help with a broken laptop keyboard. After calling the user, the technician learns the laptop is scheduled to be used for a press event the following day. Which of the following would be the best next step with the ticket?",choices:["Refer the ticket to the laptop group","Escalate the issue with management","Add the event information to the problem description","Assign the ticket to the 'laptop' category"],answer:1,explain:"A <strong>time-sensitive ticket</strong> involving a high-profile event the following day requires <strong>management escalation</strong> to ensure priority handling. Referring to the laptop group and assigning categories are normal routing steps that do not address the urgency. Adding event information is useful but insufficient alone.",multi:false},
// Obj 4.8 Scripting
{num:51,source:"Messer",ref:"A63",obj:"Obj 4.8",q:"In which of the following file types would a system administrator expect to see the command, \"cd c:\\source\"?",choices:[".sh",".vbs",".py",".bat"],answer:3,explain:"The <strong>.bat</strong> (batch) file type executes Windows command-line instructions; the cd command and Windows path syntax (c:\\) identify this as a Windows batch file. .sh is a Linux/Unix shell script. .vbs is Visual Basic Script. .py is Python. None of the other types use Windows-style paths and commands.",multi:false},
{num:52,source:"Messer",ref:"B72",obj:"Obj 4.8",q:"Which of the following script extensions would commonly be used inside of a Microsoft Office application?",choices:[".vbs",".py",".bat",".js"],answer:0,explain:"<strong>VBScript</strong> (.vbs) is the native scripting language used for macros and automation within Microsoft Office applications. .py (Python) requires a separate interpreter. .bat files are Windows command-line scripts. .js (JavaScript) runs in browsers and Node.js environments, not natively within Office applications.",multi:false},
{num:53,source:"Messer",ref:"C26",obj:"Obj 4.8",q:"Which of the following would be the best choice for a system administrator to manage an Active Directory database?",choices:["Batch file","PowerShell","JavaScript","Visual Basic Scripting"],answer:1,explain:"<strong>PowerShell</strong> is Microsoft's preferred scripting environment for managing Active Directory with extensive built-in cmdlets for directory operations. Batch files have limited AD management capabilities. JavaScript is a web scripting language. VBScript is older and lacks the rich AD management features of PowerShell.",multi:false},
// Obj 4.9 Remote Access
{num:54,source:"Messer",ref:"A59",obj:"Obj 4.9",q:"A network administrator needs to manage a switch and a firewall in the local data center. Which of the following would be the best choice for this requirement?",choices:["RDP","VPN","SSH","VNC"],answer:2,explain:"<strong>SSH</strong> (Secure Shell) provides encrypted command-line access to network devices like switches and firewalls. RDP provides graphical Windows desktop access. VPN creates an encrypted tunnel but is not used to manage individual devices. VNC provides graphical remote access but lacks SSH's security for network device management.",multi:false},
{num:55,source:"Messer",ref:"A59b",obj:"Obj 4.9",q:"A help desk technician needs to view and control the desktop of a Windows computer at a remote location. Which of the following would be the best choice for this task?",choices:["VPN","VNC","SSH","RDP"],answer:3,explain:"<strong>RDP</strong> (Remote Desktop Protocol) provides full graphical desktop access and control of a remote Windows computer. VPN creates a secure tunnel but doesn't provide desktop control. VNC also provides remote desktop access but RDP is the native Windows solution with better integration. SSH provides command-line access only.",multi:false},
{num:56,source:"Messer",ref:"B79",obj:"Obj 4.9",q:"A system administrator needs to configure a laptop to support inbound Remote Desktop services for the help desk team. Which of these Control Panel features provides access to these settings?",choices:["Internet Options","Devices and Printers","Network and Sharing Center","System"],answer:3,explain:"<strong>Remote Desktop</strong> inbound settings are configured in the <strong>System</strong> section of Control Panel under the Remote tab. Internet Options manages browser settings. Devices and Printers manages peripherals. Network and Sharing Center manages network profiles and sharing — not Remote Desktop.",multi:false},
{num:57,source:"Messer",ref:"C81",obj:"Obj 4.9",q:"A network administrator has been asked to manage the router configurations at all company locations. Which of the following would be the best choice for this task?",choices:["SSH","VNC","NFC","RDP"],answer:0,explain:"<strong>SSH</strong> provides secure encrypted command-line management of routers and network devices across all locations. VNC and RDP provide graphical desktop access and are not used for network device CLI management. NFC is a short-range wireless communication technology, not a remote access tool.",multi:false},
{num:58,source:"Messer",ref:"B76",obj:"Obj 4.9",q:"A user is traveling to a conference, and they would like to be sure any messages sent from their phone during the event remain private while using the event's wireless network. Which of the following should be configured on this user's phone?",choices:["VPN","Strong password","Network-based firewall","Multi-factor authentication"],answer:0,explain:"A <strong>VPN</strong> encrypts all network traffic from the phone, protecting messages from interception on untrusted public wireless networks. A strong password secures the device but not transmitted data. A network-based firewall is server-side infrastructure. MFA secures authentication but does not encrypt in-transit data.",multi:false},
{num:59,source:"Messer",ref:"B64",obj:"Obj 4.9",q:"The clock on an executive's Windows laptop has consistently been losing time and is behind by a few minutes at the end of the week. The executive uses this laptop to monitor an assembly line and needs the time and date to be as accurate as possible. Which of these would be the best way to address this issue?",choices:["Create a login script to update the date and time","Configure an NTP server","Set the clock for a different time zone","Replace the laptop batteries"],answer:1,explain:"An <strong>NTP server</strong> (Network Time Protocol) automatically synchronizes the system clock at regular intervals, correcting ongoing time drift without manual intervention. A login script only corrects the time at login. Setting a different time zone does not fix drift. Replacing batteries addresses CMOS battery failure but NTP is the proper systematic solution.",multi:false},
// Obj 4.10 AI Concepts
{num:60,source:"Custom",ref:"4.10",obj:"Obj 4.10",q:"An AI-powered chatbot used by a company's IT help desk consistently recommends one hardware brand over all others, even when competing products have equal or better specifications. Which of the following BEST describes this issue?",choices:["Data integrity","Inaccurate findings","Hallucination","Bias"],answer:3,explain:"<strong>Bias</strong> in AI occurs when the model's training data or design causes it to favor certain outcomes unfairly — in this case, consistently preferring one brand regardless of objective specs. Hallucination refers to AI generating false information presented as fact. Inaccurate findings describes incorrect output generally. Data integrity refers to data being complete and uncorrupted.",multi:false},
// Acronym questions Domain 4
{num:61,source:"Messer",ref:"Acronym",obj:"Obj 4.3",q:"What does GFS stand for in the context of backup strategies?",choices:["Global File System","Grandfather-Father-Son","General Fault Storage","Grouped Full Snapshot"],answer:1,explain:"<strong>GFS</strong> stands for Grandfather-Father-Son. It is a backup rotation scheme that uses three sets of backups: daily (Son), weekly (Father), and monthly (Grandfather). This strategy balances storage efficiency with the ability to recover data from multiple points in time.",multi:false},
{num:62,source:"Messer",ref:"Acronym",obj:"Obj 4.4",q:"What does ESD stand for?",choices:["External Storage Device","Electrostatic Discharge","Encrypted System Data","Extended Sector Drive"],answer:1,explain:"<strong>ESD</strong> stands for Electrostatic Discharge. It is the sudden flow of static electricity between objects with different electrical potentials. ESD can permanently damage or destroy sensitive electronic components. ESD straps, anti-static bags, and ESD mats are used to prevent electrostatic discharge during hardware repairs.",multi:false},
{num:63,source:"Messer",ref:"Acronym",obj:"Obj 4.5",q:"What does UPS stand for?",choices:["Universal Power Source","Uninterruptible Power Supply","Unified Protection System","USB Power Surge"],answer:1,explain:"<strong>UPS</strong> stands for Uninterruptible Power Supply. It is a device that provides battery backup power when the main power supply fails or drops below acceptable voltage levels, allowing systems to continue operating during outages or giving time for graceful shutdown.",multi:false},
{num:64,source:"Messer",ref:"Acronym",obj:"Obj 4.5",q:"What does MSDS stand for?",choices:["Microsoft System Deployment Standard","Material Safety Data Sheet","Managed Storage and Distribution System","Multiple Server Diagnostic Suite"],answer:1,explain:"<strong>MSDS</strong> stands for Material Safety Data Sheet (now also called SDS — Safety Data Sheet). It is a document that provides information on the properties of hazardous chemicals, including safe handling, storage, and disposal procedures. Technicians refer to MSDS documents when disposing of toner cartridges and batteries.",multi:false},
{num:65,source:"Messer",ref:"Acronym",obj:"Obj 4.6",q:"What does PII stand for?",choices:["Private Internet Information","Personally Identifiable Information","Protected Internal Infrastructure","Primary Identity Index"],answer:1,explain:"<strong>PII</strong> stands for Personally Identifiable Information. It refers to any data that can be used to identify a specific individual, such as names, addresses, phone numbers, Social Security numbers, and email addresses. PII is subject to privacy regulations and must be handled and stored securely.",multi:false},
{num:66,source:"Messer",ref:"Acronym",obj:"Obj 4.6",q:"What does EULA stand for?",choices:["Extended User License Agreement","End-User License Agreement","Enterprise Unified Licensing Authorization","External Use and Liability Agreement"],answer:1,explain:"<strong>EULA</strong> stands for End-User License Agreement. It is a legal contract between a software publisher and the user that defines the terms under which the software may be used. Users must accept the EULA before installing most commercial software.",multi:false},
{num:67,source:"Messer",ref:"Acronym",obj:"Obj 4.8",q:"What does the file extension .ps1 refer to?",choices:["PostScript file","PowerShell script","Perl Script 1","Portable Script format"],answer:1,explain:"<strong>.ps1</strong> is the file extension for <strong>PowerShell scripts</strong>. PowerShell is Microsoft's task automation and configuration management framework, commonly used by system administrators to manage Windows systems, Active Directory, and cloud services. PowerShell scripts use the .ps1 extension.",multi:false},
{num:68,source:"Messer",ref:"Acronym",obj:"Obj 4.9",q:"What does RDP stand for?",choices:["Remote Data Protocol","Remote Desktop Protocol","Redundant Display Port","Routed Data Path"],answer:1,explain:"<strong>RDP</strong> stands for Remote Desktop Protocol. It is Microsoft's proprietary protocol that provides a graphical interface for connecting to another computer over a network. RDP allows technicians to remotely view and control Windows desktops, typically using port 3389.",multi:false},
{num:69,source:"Messer",ref:"Acronym",obj:"Obj 4.9",q:"What does SSH stand for?",choices:["Secure Socket Host","Secure Shell","System Service Handler","Standard Subnet Host"],answer:1,explain:"<strong>SSH</strong> stands for Secure Shell. It is a cryptographic network protocol that provides a secure encrypted channel for remote command-line access to servers and network devices. SSH replaced the insecure Telnet protocol and operates on port 22 by default.",multi:false},
{num:70,source:"Messer",ref:"Acronym",obj:"Obj 4.9",q:"What does VNC stand for?",choices:["Virtual Network Computer","Virtual Node Controller","Verified Network Channel","Variable NAT Configuration"],answer:0,explain:"<strong>VNC</strong> stands for Virtual Network Computer. It is a graphical desktop sharing system that allows remote control of another computer's screen, keyboard, and mouse. Unlike RDP which is Windows-specific, VNC is platform-independent and works across Windows, macOS, and Linux.",multi:false},
{num:71,source:"Messer",ref:"Acronym",obj:"Obj 4.9",q:"What does VPN stand for?",choices:["Virtual Private Network","Variable Protocol Node","Verified Packet Network","Virtual Port Number"],answer:0,explain:"<strong>VPN</strong> stands for Virtual Private Network. It creates an encrypted tunnel between a user's device and a remote network, allowing secure access to corporate resources over public internet connections. VPNs protect data in transit from interception on untrusted networks.",multi:false},
{num:72,source:"Messer",ref:"Acronym",obj:"Obj 4.2",q:"What does SLA stand for?",choices:["System Logging Agreement","Service-level Agreement","Secure Login Authorization","Software License Allocation"],answer:1,explain:"<strong>SLA</strong> stands for Service-level Agreement. It is a contract between a service provider and a customer that defines the expected level of service, including uptime guarantees, response times, and support availability. SLAs are referenced in change management and IT support documentation.",multi:false},
{num:73,source:"Messer",ref:"Acronym",obj:"Obj 4.1",q:"What does SOP stand for?",choices:["System Operations Protocol","Standard Operating Procedure","Service Order Processing","Secure Output Port"],answer:1,explain:"<strong>SOP</strong> stands for Standard Operating Procedure. It is a documented set of step-by-step instructions that describes how to perform routine tasks or processes consistently. SOPs are used in IT for procedures like onboarding new users, configuring workstations, and responding to incidents.",multi:false},
{num:74,source:"Messer",ref:"Acronym",obj:"Obj 4.6",q:"What does DRM stand for?",choices:["Data Recovery Module","Digital Rights Management","Distributed Resource Manager","Dynamic Record Map"],answer:1,explain:"<strong>DRM</strong> stands for Digital Rights Management. It is a set of access control technologies used by publishers and copyright holders to restrict the use of digital content and devices. DRM prevents unauthorized copying, sharing, and use of software, music, video, and other digital media.",multi:false},
{num:75,source:"Messer",ref:"Acronym",obj:"Obj 4.6",q:"What does NDA stand for?",choices:["Network Diagnostic Application","Non-Disclosure Agreement","Node Distribution Architecture","Networked Data Access"],answer:1,explain:"<strong>NDA</strong> stands for Non-Disclosure Agreement. It is a legal contract between parties that establishes a confidential relationship, preventing one or both parties from sharing proprietary or sensitive information with third parties. NDAs are commonly used when IT staff handle sensitive client data or company trade secrets.",multi:false}
];

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;}

function prepareQuestions(qs){
  const shuffled=shuffle([...qs]);
  return shuffled.map(q=>{
    if(q.multi){
      const indices=[...Array(q.choices.length).keys()];
      shuffle(indices);
      const newChoices=indices.map(i=>q.choices[i]);
      const newAnswer=q.answer.map(a=>indices.indexOf(a));
      return {...q,choices:newChoices,answer:newAnswer};
    } else {
      const n=q.choices.length;
      const indices=[...Array(n).keys()];
      shuffle(indices);
      const newChoices=indices.map(i=>q.choices[i]);
      const newAnswer=indices.indexOf(q.answer);
      return {...q,choices:newChoices,answer:newAnswer};
    }
  });
}

let prepared=prepareQuestions(questions);
const total=prepared.length;
let correct=0,wrong=0,answered=0;
document.getElementById('sr').textContent=total;

function updateScore(){
  document.getElementById('sc').textContent=correct;
  document.getElementById('sw').textContent=wrong;
  document.getElementById('sr').textContent=total-answered;
  const pct=answered>0?Math.round((correct/answered)*100):0;
  document.getElementById('sp').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=(answered/total*100)+'%';
  if(answered===total)showFinal();
}

function showFinal(){
  const pct=Math.round((correct/total)*100);
  const banner=document.getElementById('final-banner');
  const inner=document.getElementById('final-inner');
  banner.style.display='block';
  inner.style.background=pct>=78?'#00e87a':'#ff3b5c';
  inner.style.border='2px solid '+(pct>=78?'#00e87a':'#ff3b5c');
  document.getElementById('final-title').textContent='Final Score: '+pct+'%';
  document.getElementById('final-score').textContent=correct+' correct out of '+total+' — '+(pct>=78?'PASS ✓':'FAIL ✗');
  banner.scrollIntoView({behavior:'smooth'});
}

function retake(){
  correct=0;wrong=0;answered=0;
  prepared=prepareQuestions(questions);
  document.getElementById('final-banner').style.display='none';
  document.getElementById('container').innerHTML='';
  buildQuiz();
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildQuiz(){
  const container=document.getElementById('container');
  prepared.forEach((q,idx)=>{
    const card=document.createElement('div');
    card.className='card';
    let srcBadge='';
    if(q.source==='Messer') srcBadge='<span class="badge-messer">Messer</span>';
    else if(q.source==='Dion') srcBadge='<span class="badge-dion">Dion</span>';
    else srcBadge='<span class="badge-custom">Custom</span>';
    const refLabel=q.ref==='Acronym'?'Acronym':q.ref;
    const multiNote=q.multi?`<div class="multi-note">&#9733; Select TWO answers, then click Submit</div>`:'';
    const submitHtml=q.multi?`<button class="submit-btn" id="submit-${idx}" onclick="submitMulti(${idx})">Submit Answer</button>`:'';
    const btnHtml=q.choices.map((c,ci)=>{
      if(q.multi){
        return `<button class="choice-btn" id="btn-${idx}-${ci}" onclick="toggleMulti(${idx},${ci})">${String.fromCharCode(65+ci)}. ${c}</button>`;
      } else {
        return `<button class="choice-btn" onclick="selectSingle(${idx},${ci})">${String.fromCharCode(65+ci)}. ${c}</button>`;
      }
    }).join('');
    card.innerHTML=`
      <div class="card-header">
        <span class="q-badge">Q${idx+1}</span>
        <div class="meta">${srcBadge}<span class="ref-code">${refLabel}</span><span class="obj-tag">${q.obj}</span></div>
      </div>
      <div class="question-text">${q.q}</div>
      ${multiNote}
      <div class="choices" id="choices-${idx}">${btnHtml}</div>
      ${submitHtml}
      <div class="result-badge" id="result-${idx}"></div>
      <div class="explain-pane" id="explain-${idx}">${q.explain}</div>
    `;
    container.appendChild(card);
  });
}

const multiSelected={};
function toggleMulti(idx,ci){
  if(!multiSelected[idx])multiSelected[idx]=new Set();
  const sel=multiSelected[idx];
  const btn=document.getElementById(`btn-${idx}-${ci}`);
  if(sel.has(ci)){sel.delete(ci);btn.style.background='#e0e0e0';btn.style.color='#1a1a1a';}
  else{sel.add(ci);btn.style.background='#00c2ff';btn.style.color='#ffffff';}
  const submitBtn=document.getElementById(`submit-${idx}`);
  if(submitBtn)submitBtn.style.display=sel.size>=1?'block':'none';
}

function submitMulti(idx){
  const q=prepared[idx];
  const sel=multiSelected[idx]?Array.from(multiSelected[idx]):[];
  const correctSet=new Set(q.answer);
  const selSet=new Set(sel);
  const btns=document.getElementById('choices-'+idx).querySelectorAll('.choice-btn');
  btns.forEach((btn,bi)=>{
    btn.style.background='';btn.style.color='';
    btn.classList.add('locked');
    if(correctSet.has(bi)){btn.classList.add('correct');}
    else if(selSet.has(bi)&&!correctSet.has(bi)){btn.classList.add('wrong-selected');}
    else{btn.classList.add('unchosen');}
  });
  const submitBtn=document.getElementById(`submit-${idx}`);
  if(submitBtn)submitBtn.style.display='none';
  const isCorrect=q.answer.every(a=>selSet.has(a))&&sel.length===q.answer.length;
  const resultEl=document.getElementById('result-'+idx);
  resultEl.className='result-badge show';
  if(isCorrect){
    resultEl.innerHTML='<span class="result-correct">&#10003; Correct!</span>';correct++;
  } else {
    const correctLetters=q.answer.map(a=>String.fromCharCode(65+a)).join(', ');
    const selLetters=sel.map(a=>String.fromCharCode(65+a)).join(', ');
    resultEl.innerHTML=`<span class="result-wrong">&#10007; Wrong &mdash; Correct answers: ${correctLetters}. You selected: ${selLetters||'none'}.</span>`;wrong++;
  }
  document.getElementById('explain-'+idx).classList.add('show');
  answered++;updateScore();
}

function selectSingle(idx,chosen){
  const q=prepared[idx];
  const btns=document.getElementById('choices-'+idx).querySelectorAll('.choice-btn');
  btns.forEach((btn,bi)=>{
    btn.classList.add('locked');
    if(bi===q.answer){btn.classList.add('correct');}
    else if(bi===chosen&&chosen!==q.answer){btn.classList.add('wrong-selected');}
    else{btn.classList.add('unchosen');}
  });
  const isCorrect=chosen===q.answer;
  const resultEl=document.getElementById('result-'+idx);
  resultEl.className='result-badge show';
  resultEl.innerHTML=isCorrect
    ?'<span class="result-correct">&#10003; Correct!</span>'
    :`<span class="result-wrong">&#10007; Wrong &mdash; Answer: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</span>`;
  document.getElementById('explain-'+idx).classList.add('show');
  isCorrect?correct++:wrong++;
  answered++;updateScore();
}

buildQuiz();
updateScore();
</script>
<script src="footer.js"></script>
